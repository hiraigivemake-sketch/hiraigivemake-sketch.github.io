<!-- =====================================================================
     画面用の純粋関数。DOM には触れない（Node でもテストできる）。
     ===================================================================== -->
<script id="vs-ui">
(function (root) {
'use strict';
const VS = root.VS;
const pad2 = n => String(n).padStart(2, '0');
const DOW_JA = ['日', '月', '火', '水', '木', '金', '土'];

function fmtDateJa(s) { const [y, m, d] = s.split('-').map(Number); return `${y}年${m}月${d}日（${DOW_JA[VS.date.dowOf(s)]}）`; }
function fmtMD(s) { const [, m, d] = s.split('-').map(Number); return `${m}/${d}`; }
function fmtHours(min) { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}時間${m ? m + '分' : ''}` : `${m}分`; }
function ym(s) { return { y: Number(s.slice(0, 4)), m: Number(s.slice(5, 7)) }; }
function addMonths(y, m, n) { const d = new Date(y, m - 1 + n, 1); return { y: d.getFullYear(), m: d.getMonth() + 1 }; }

/* 指定日を含む週の7日（weekStartDow 始まり） */
function weekRange(date, weekStartDow) {
  const offset = (VS.date.dowOf(date) - weekStartDow + 7) % 7;
  const start = VS.date.addDays(date, -offset);
  return Array.from({ length: 7 }, (_, i) => VS.date.addDays(start, i));
}
/* 月カレンダーの日付配列（前後月の日で埋めて7の倍数） */
function monthGrid(y, m, weekStartDow) {
  const first = `${y}-${pad2(m)}-01`;
  const last = `${y}-${pad2(m)}-${pad2(VS.date.daysInMonth(y, m))}`;
  const start = weekRange(first, weekStartDow)[0];
  const end = weekRange(last, weekStartDow)[6];
  const n = VS.date.diffDays(start, end) + 1;
  return { dates: Array.from({ length: n }, (_, i) => VS.date.addDays(start, i)), rows: n / 7, first, last };
}

const byStart = (a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : a.end < b.end ? -1 : a.end > b.end ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
const byDateStart = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : byStart(a, b);

/* 画面のフィルタ条件に合うか。staffId '__none__' は未割当のみ */
function matchesFilter(v, f) {
  if (f.staffId === '__none__') { if (v.staffIds.length) return false; }
  else if (f.staffId && !v.staffIds.includes(f.staffId)) return false;
  if (f.patientId && v.patientId !== f.patientId) return false;
  if (f.serviceType && v.serviceType !== f.serviceType) return false;
  if (!f.showInactive && !VS.derive.isActiveVisit(v)) return false;
  return true;
}
function visitsBetween(db, from, to, f) { return db.visits.filter(v => v.date >= from && v.date <= to && matchesFilter(v, f)).sort(byDateStart); }
function visitsOn(db, date, f) { return visitsBetween(db, date, date, f); }

/* 同じ列で時間が重なる訪問を横に並べるためのレーン割当。[{ item, lane, laneCount }] */
function layoutLanes(items) {
  const sorted = items.slice().sort(byStart);
  const out = [];
  let cluster = [], clusterEnd = -1, laneEnds = [];
  const flush = () => { const n = laneEnds.length; cluster.forEach(c => { c.laneCount = n; out.push(c); }); cluster = []; laneEnds = []; clusterEnd = -1; };
  for (const item of sorted) {
    const s = VS.time.toMin(item.start), e = VS.time.toMin(item.end);
    if (cluster.length && s >= clusterEnd) flush();
    let lane = laneEnds.findIndex(end => end <= s);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(e); } else laneEnds[lane] = e;
    cluster.push({ item, lane, laneCount: 0 });
    clusterEnd = Math.max(clusterEnd, e);
  }
  if (cluster.length) flush();
  return out;
}
/* 時間軸の範囲（分）。設定の範囲からはみ出す訪問があれば広げ、1時間単位に丸める */
function axisRange(settings, visits) {
  let s = VS.time.toMin(settings.dayStart), e = VS.time.toMin(settings.dayEnd);
  for (const v of visits) { s = Math.min(s, VS.time.toMin(v.start)); e = Math.max(e, VS.time.toMin(v.end)); }
  return { startMin: Math.floor(s / 60) * 60, endMin: Math.min(24 * 60, Math.ceil(e / 60) * 60) };
}
/* 同日で担当または利用者の時間が重なっている訪問の id 集合（キャンセル・振替元は除く） */
function conflictIds(visits) {
  const ids = new Set(), byDate = new Map();
  for (const v of visits) {
    if (!VS.derive.isActiveVisit(v)) continue;
    if (!byDate.has(v.date)) byDate.set(v.date, []);
    byDate.get(v.date).push(v);
  }
  for (const list of byDate.values()) {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (!VS.time.rangesOverlap(a.start, a.end, b.start, b.end)) continue;
      if (a.patientId === b.patientId || a.staffIds.some(id => b.staffIds.includes(id))) { ids.add(a.id); ids.add(b.id); }
    }
  }
  return ids;
}
function summarize(visits) {
  const s = { count: 0, minutes: 0, nursing: 0, rehab: 0, unassigned: 0, inactive: 0 };
  for (const v of visits) {
    if (!VS.derive.isActiveVisit(v)) { s.inactive++; continue; }
    s.count++; s.minutes += VS.derive.visitDurationMin(v); s[v.serviceType]++;
    if (!v.staffIds.length) s.unassigned++;
  }
  return s;
}
function snapMin(min, step) { return Math.floor(min / step) * step; }

/* 訪問一覧の CSV（UTF-8 BOM 付き。Excel でそのまま開ける） */
function csvCell(v) { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function visitsCsv(db, visits) {
  const pById = new Map(db.patients.map(p => [p.id, p])), sById = new Map(db.staff.map(s => [s.id, s]));
  const head = ['日付', '曜日', '開始', '終了', '利用者', '表示名', '保険', '種別', '担当1', '担当2', 'ステータス', '緊急', '研修同行', '実績開始', '実績終了', '備考', '計画ID', '訪問ID'];
  const rows = visits.map(v => {
    const p = pById.get(v.patientId), s1 = sById.get(v.staffIds[0]), s2 = sById.get(v.staffIds[1]);
    return [v.date, DOW_JA[VS.date.dowOf(v.date)], v.start, v.end, p ? p.name : '', p ? VS.derive.patientDisplayName(p) : '', p ? VS.ENUMS.insurance[p.insurance] : '',
      VS.ENUMS.serviceType[v.serviceType], s1 ? s1.name : '', s2 ? s2.name : '', VS.ENUMS.visitStatus[v.status], v.flags.emergency ? '1' : '', v.flags.training ? '1' : '',
      v.actual ? v.actual.start : '', v.actual ? v.actual.end : '', v.note, v.planId || '', v.id];
  });
  return '\uFEFF' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

root.VS_UI = { DOW_JA, fmtDateJa, fmtMD, fmtHours, ym, addMonths, weekRange, monthGrid, byStart, matchesFilter, visitsBetween, visitsOn, layoutLanes, axisRange, conflictIds, summarize, snapMin, csvCell, visitsCsv };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script id="vs-tests">
(function (root) {
'use strict';
const VS = root.VS;
const tests = [];
const t = (name, fn) => tests.push({ name, fn });
const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || ''} 期待:${JSON.stringify(b)} 実際:${JSON.stringify(a)}`); };
const ok = (c, msg) => { if (!c) throw new Error(msg || '条件が偽でした'); };

t('ルール: ステータス遷移', () => {
  const v = VS.create.visit({ date: '2026-10-05', start: '10:00', end: '11:00', patientId: 'p' });
  const c = VS.rules.changeVisitStatus(v, 'confirmed'); eq(c.status, 'confirmed');
  const d = VS.rules.changeVisitStatus(c, 'done'); eq(d.actual, { start: '10:00', end: '11:00' });
  throws(() => VS.rules.changeVisitStatus(d, 'cancelled'), '実施→キャンセルは不可');
  const x = VS.rules.changeVisitStatus(v, 'cancelled', { cancelReason: 'hospital' }); eq(x.cancelReason, 'hospital');
  const back = VS.rules.changeVisitStatus(x, 'planned'); eq(back.cancelReason, null);
  throws(() => VS.rules.changeVisitStatus({ ...v, status: 'transferred' }, 'planned'), '振替元は戻せない');
});
t('ルール: 計画の月展開（毎週・隔週・第N週・休日・入院・既存スキップ）', () => {
  const db = VS.sample.build(2026, 10);
  // 2026-10 の月曜: 5,12,19,26 → pl_sample1 は4件
  eq(db.visits.filter(v => v.planId === 'pl_sample1').map(v => v.date), ['2026-10-05', '2026-10-12', '2026-10-19', '2026-10-26']);
  // 火曜 隔週（基準 10/1 の週）: 10/6 は基準週（10/1〜10/7）→ 対象, 10/13 ×, 10/20 ○ だが入院(15〜21) → スキップ, 10/27 ×
  eq(db.visits.filter(v => v.planId === 'pl_sample3').map(v => v.date), ['2026-10-06']);
  // 水曜 第1・3週: 10/7(第1), 10/21(第3) → 21日は事業所休業日なのでスキップ
  eq(db.visits.filter(v => v.planId === 'pl_sample4').map(v => v.date), ['2026-10-07']);
  const again = VS.rules.expandPlan(db, db.plans[0], 2026, 10);
  eq(again.visits.length, 0, '再展開しても重複しない'); eq(again.skipped.filter(s => s.reason === 'exists').length, 4);
  const nov = VS.rules.expandPlan(db, db.plans.find(p => p.id === 'pl_sample3'), 2026, 11);
  eq(nov.visits.map(v => v.date), ['2026-11-03', '2026-11-17'], '隔週が月をまたいで続く');
  // 基準日 10/1(木) で火曜の計画 → 起点は 10/6。9月は 9/29(火) が基準日より前なので対象外
  const sep = VS.rules.expandPlan(db, db.plans.find(p => p.id === 'pl_sample3'), 2026, 9);
  eq(sep.visits.length, 0, '計画期間前は展開しない');
  const pl = VS.clone(db.plans.find(p => p.id === 'pl_sample3')); pl.id = 'pl_tmp'; pl.period = { from: '2026-09-01', to: null };
  eq(VS.rules.expandPlan(db, pl, 2026, 9).visits.map(v => v.date), ['2026-09-22', '2026-09-08'].sort(), '基準日より前は起点から逆算して隔週');
});

  const db = VS.sample.build(2026, 10);
  const base = { staffId: '', patientId: '', serviceType: '', showInactive: false };
  const v = db.visits.find(x => x.planId === 'pl_sample1');
  ok(UI.matchesFilter(v, base)); ok(UI.matchesFilter(v, { ...base, staffId: 's_sample1' })); ok(!UI.matchesFilter(v, { ...base, staffId: 's_sample2' }));
  ok(!UI.matchesFilter(v, { ...base, staffId: '__none__' })); ok(!UI.matchesFilter(v, { ...base, serviceType: 'rehab' }));
  const c = VS.repo.visits.setStatus(db, v.id, 'cancelled', { cancelReason: 'patient' });
  ok(!UI.matchesFilter(c, base)); ok(UI.matchesFilter(c, { ...base, showInactive: true }));
  const dup = VS.repo.visits.add(db, VS.create.visit({ date: v.date, start: v.start, end: v.end, patientId: 'p_sample2', staffIds: ['s_sample1'] }));
  const w = db.visits.find(x => x.planId === 'pl_sample1' && x.id !== v.id);
  const dup2 = VS.repo.visits.add(db, VS.create.visit({ date: w.date, start: w.start, end: w.end, patientId: 'p_sample2', staffIds: ['s_sample1'] }));
  const ids = UI.conflictIds(db.visits);
  ok(!ids.has(v.id), 'キャンセル済みは重複に数えない'); ok(!ids.has(dup.id)); ok(ids.has(w.id)); ok(ids.has(dup2.id));
  const s = UI.summarize(UI.visitsOn(db, w.date, { ...base, showInactive: true }));
  eq([s.count, s.nursing, s.unassigned], [2, 2, 0]);
  eq(UI.visitsOn(db, v.date, base).map(x => x.id), [dup.id], 'キャンセル済みは既定で隠れる');
  eq(UI.snapMin(617, 15), 615); eq(UI.snapMin(600, 15), 600);
});

t('ルール: 月次チェック', () => {
  const db = VS.sample.build(2026, 10);
  eq(VS.rules.checkMonth(db, 2026, 10), [], 'サンプルは問題なし');
  VS.repo.visits.add(db, VS.create.visit({ date: '2026-10-07', start: '10:00', end: '11:00', patientId: 'p_sample1', staffIds: [] }));
  VS.repo.visits.add(db, VS.create.visit({ date: '2026-10-05', start: '11:05', end: '12:00', patientId: 'p_sample2', staffIds: ['s_sample1'] }));
  VS.repo.shifts.replaceFor(db, [VS.create.shift({ staffId: 's_sample1', date: '2026-10-19', kind: 'off' })]);
  VS.repo.patients.update(db, 'p_sample1', { plannedVisits: { perWeek: 2, perMonth: 8 } });
  const issues = VS.rules.checkMonth(db, 2026, 10);
  const codes = issues.map(i => i.code);

  ok(issues.findIndex(i => i.level === 'block') < issues.findIndex(i => i.level === 'warn'), 'block が先');
  const pc = issues.filter(i => i.code === 'planCount');
  ok(pc.some(i => i.msg.includes('月 8 回') && i.msg.includes('10 回')), '月の回数差: ' + pc.map(i => i.msg).join(' / '));

  const v = db.visits.find(x => x.planId === 'pl_sample1');
  VS.repo.visits.update(db, v.id, { note: '備考に"引用"と,カンマ\n改行' });
  const csv = UI.visitsCsv(db, [VS.repo.visits.get(db, v.id)]);
  ok(csv.startsWith('﻿日付,'), 'BOM付き');
  const lines = csv.split('\r\n').filter(Boolean);
  ok(lines[1].startsWith('2026-10-05,月,10:00,11:00,利用者A,A様,介護保険,看護,看護 太郎,,予定'), lines[1]);
  ok(lines[1].includes('"備考に""引用""と,カンマ\n改行"'), 'エスケープ');
  eq(UI.csvCell('plain'), 'plain'); eq(UI.csvCell('a,b'), '"a,b"');
});

function run() {
  return tests.map(({ name, fn }) => { try { fn(); return { name, ok: true, detail: '' }; } catch (e) { return { name, ok: false, detail: e.message }; } });
}
root.VS_TESTS = { run, count: tests.length };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- =====================================================================
     画面。DOM を扱うのはここだけ。データの変更は必ず VS.repo / VS.store を通す。
     ===================================================================== -->
<script id="vs-app">
(function () {
'use strict';
const VS = window.VS, UI = window.VS_UI;
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const toMin = VS.time.toMin, fromMin = VS.time.fromMin;
const UI_KEY = 'houmon_schedule_ui';
const PX_PER_MIN = 1;
const MONTH_CHIP_MAX = 4;
/* 制約コードの重さはデータ層の RULE_LEVEL に従う（block=保存不可、warn=保存できるが注意） */
const isBlock = code => VS.RULE_LEVEL[code] === 'block';
const FIELD_LABEL = {
  date: '日付', start: '開始', end: '終了', patientId: '利用者', staffIds: '担当', serviceType: '種別', actual: '実績時刻', note: '備考', cancelReason: 'キャンセル理由', flags: 'フラグ', planId: '計画', origin: '作成元', status: 'ステータス', transferredToId: '振替先', transferredFromId: '振替元', id: 'ID',
  name: '氏名', nameKana: 'ふりがな', displayName: '表示名', code: '管理番号', insurance: '保険種別', careLevel: '要介護度', psychiatric: '精神科', publicExpense: '公費', specialFlags: '別表7・8', instructions: '指示書', type: '種別', from: '開始日', to: '終了日',
  careManager: 'ケアマネ', hospital: '医療機関', area: 'エリア', requirements: '要件', allowedRoles: '対応可能職種', needsTwoStaff: '2名訪問', preferences: '希望条件', preferredTimeRanges: '希望時間帯', ngTimeRanges: 'NG時間帯', preferredStaffIds: '希望担当', ngStaffIds: 'NG担当', dow: '曜日', contract: '契約期間', statusPeriods: '状態期間', archived: '無効',
  role: '職種', employment: '雇用形態', skills: '領域', transport: '移動手段', color: '表示色', availability: '勤務可能枠', employmentPeriod: '在籍期間',
  durationMin: '所要時間', recurrence: '繰り返し', kind: '種類', anchorDate: '基準日', weeksOfMonth: '第N週', period: '有効期間',
  patients: '利用者', staff: 'スタッフ', plans: '計画', visits: '訪問', holidays: '休日', settings: '設定', meta: '事業所情報',
  businessDows: '営業曜日', dayStart: '時間軸の開始', dayEnd: '時間軸の終了', slotMin: '時刻入力の刻み', defaultDurationMin: '既定の所要時間', weekStartDow: '週の開始曜日', skipNationalHolidays: '祝日の扱い', stationName: '事業所名',
  travelMin: '移動時間の目安', plannedVisits: '計画回数', perWeek: '週', perMonth: '月', shifts: '勤務データ', staffId: 'スタッフ', source: '取得元'
};
const STATUS_BTN = { confirmed: '確定にする', done: '実施済みにする', cancelled: 'キャンセルする', transferred: '振替する', planned: '予定に戻す' };
const STATUS_BTN_FROM = { 'done>confirmed': '実施を取り消す', 'cancelled>planned': 'キャンセルを取り消す' };
const SKIP_LABEL = { holiday: '休日', patientStatus: '入院・休止・契約外', exists: '展開済み', noPatient: '利用者なし', patientArchived: '利用者が無効' };
const SVC_SHORT = { nursing: '看', rehab: 'リ' };

const state = {
  db: null, load: null,
  view: 'day', date: VS.date.todayStr(), weekMode: 'staff',
  master: 'patients', masterSearch: '', masterArchived: false,
  output: { type: 'patientMonth', month: VS.date.todayStr().slice(0, 7), date: VS.date.todayStr(), target: '', withInactive: false },
  filter: { staffId: '', patientId: '', serviceType: '', showInactive: false }
};
const modal = { id: null, prefill: null };

/* ---------- 設定・状態 ---------- */
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(UI_KEY) || 'null');
    if (!p || typeof p !== 'object') return;
    if (['day', 'week', 'month', 'output', 'master', 'data'].includes(p.view)) state.view = p.view;
    if (['staff', 'patient'].includes(p.weekMode)) state.weekMode = p.weekMode;
    if (['patients', 'staff', 'plans', 'holidays', 'settings'].includes(p.master)) state.master = p.master;
    if (typeof p.showInactive === 'boolean') state.filter.showInactive = p.showInactive;
  } catch (_) { /* 読めなければ既定のまま */ }
}
function savePrefs() {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ view: state.view, weekMode: state.weekMode, master: state.master, showInactive: state.filter.showInactive })); }
  catch (_) { /* 保存できなくても動作には影響しない */ }
}
function loadDb() { state.load = VS.store.load(localStorage); state.db = state.load.db; sanitizeFilter(); }
function sanitizeFilter() {
  const f = state.filter, db = state.db;
  if (f.staffId && f.staffId !== '__none__' && !db.staff.some(s => s.id === f.staffId)) f.staffId = '';
  if (f.patientId && !db.patients.some(p => p.id === f.patientId)) f.patientId = '';
  if (f.serviceType && !VS.ENUMS.serviceType[f.serviceType]) f.serviceType = '';
}
/* 変更を保存する。検証に通らなければ保存済みの状態へ戻す */
function persist() {
  const r = VS.store.save(state.db, localStorage);
  if (!r.ok) {
    alert('保存できませんでした。変更を取り消します。\n' + r.errors.slice(0, 8).map(e => `${e.path} ${e.msg}`).join('\n'));
    loadDb();
    return false;
  }
  if (r.warn) toast(r.warn);
  return true;
}
let toastTimer = null;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

/* ---------- 参照 ---------- */
const patientById = id => state.db.patients.find(p => p.id === id) || null;
const staffById = id => state.db.staff.find(s => s.id === id) || null;
const pName = id => { const p = patientById(id); return p ? VS.derive.patientDisplayName(p) : '（利用者不明）'; };
const sName = id => { const s = staffById(id); return s ? VS.derive.staffDisplayName(s) : '（不明）'; };
const sColor = v => { const s = v.staffIds[0] ? staffById(v.staffIds[0]) : null; return s ? s.color : '#9ca3af'; };
const activePatients = () => state.db.patients.filter(p => !p.archived).slice().sort((a, b) => VS.derive.patientDisplayName(a).localeCompare(VS.derive.patientDisplayName(b), 'ja'));
const activeStaff = () => state.db.staff.filter(s => !s.archived);
const todayStr = () => VS.date.todayStr();
function colCls(d) {
  const hol = state.db.holidays.some(h => h.date === d);
  const off = !state.db.settings.businessDows.includes(VS.date.dowOf(d));
  return [d === todayStr() ? 'col-today' : '', hol ? 'col-holiday' : off ? 'col-off' : ''].join(' ');
}
function tooltip(v) {
  const parts = [`${UI.fmtDateJa(v.date)} ${v.start}–${v.end}`, pName(v.patientId), VS.ENUMS.serviceType[v.serviceType],
    v.staffIds.length ? v.staffIds.map(sName).join('・') : '未割当', VS.ENUMS.visitStatus[v.status]];
  if (v.note) parts.push(v.note);
  return parts.join(' / ');
}
function summaryHtml(visits, conflictCount) {
  const s = UI.summarize(visits);
  return `訪問 <b>${s.count}</b> 件（看護 ${s.nursing}・リハビリ ${s.rehab}）　合計 ${UI.fmtHours(s.minutes)}　未割当 ${s.unassigned ? `<b class="ng">${s.unassigned}</b>` : 0}　重複 ${conflictCount ? `<b class="ng">${conflictCount}</b>` : 0}` + (s.inactive ? `　<span class="muted">キャンセル・振替元 ${s.inactive}</span>` : '');
}

/* ---------- 描画 ---------- */
function render() {
  sanitizeFilter();
  renderToolbar();
  const isData = state.view === 'data';
  $('#view').hidden = isData; $('#data-view').hidden = !isData;
  if (state.view === 'day') $('#view').innerHTML = renderDay();
  else if (state.view === 'week') $('#view').innerHTML = renderWeek();
  else if (state.view === 'month') $('#view').innerHTML = renderMonth();
  else if (state.view === 'master') $('#view').innerHTML = renderMaster();
  else if (state.view === 'output') $('#view').innerHTML = renderOutput();
  else renderData();
  document.body.classList.toggle('print-output', state.view === 'output');
  savePrefs();
}
function fillSelect(sel, options, value) {
  sel.innerHTML = options.map(([v, label]) => `<option value="${esc(v)}">${esc(label)}</option>`).join('');
  sel.value = value;
  if (sel.value !== value) sel.value = '';
}
function renderToolbar() {
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const station = state.db.meta.stationName || '';
  $('#station-name').textContent = station;
  document.title = station ? `${station} 訪問スケジュール` : '訪問スケジュール';
  const isCal = ['day', 'week', 'month'].includes(state.view);
  $('#nav').hidden = !isCal; $('#filters').hidden = !isCal;
  $('#master-bar').hidden = state.view !== 'master';
  $('#btn-expand').hidden = state.view !== 'month';
  $('#btn-check').hidden = state.view !== 'month';
  $('#btn-add').hidden = !isCal;
  $('#week-mode').hidden = state.view !== 'week';
  if (state.view === 'master') renderMasterBar();
  $('#date-input').value = state.date;
  const { y, m } = UI.ym(state.date);
  let title = UI.fmtDateJa(state.date);
  if (state.view === 'month') title = `${y}年${m}月`;
  else if (state.view === 'week') { const w = UI.weekRange(state.date, state.db.settings.weekStartDow); title = `${UI.fmtDateJa(w[0])} 〜 ${UI.fmtDateJa(w[6])}`; }
  $('#nav-title').textContent = title;
  fillSelect($('#f-staff'), [['', 'すべてのスタッフ'], ['__none__', '未割当のみ'], ...activeStaff().map(s => [s.id, VS.derive.staffDisplayName(s)])], state.filter.staffId);
  fillSelect($('#f-patient'), [['', 'すべての利用者'], ...activePatients().map(p => [p.id, VS.derive.patientDisplayName(p)])], state.filter.patientId);
  $('#f-service').value = state.filter.serviceType;
  $('#f-inactive').checked = state.filter.showInactive;
  $$('#week-mode button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.weekMode));
}

/* --- 日 --- */
function tagsHtml(v, full) {
  const svc = `<span class="tag svc-${v.serviceType}">${esc(full ? VS.ENUMS.serviceType[v.serviceType] : SVC_SHORT[v.serviceType])}</span>`;
  const two = v.staffIds.length === 2 ? '<span class="tag">2名</span>' : '';
  const em = v.flags.emergency ? '<span class="tag em">緊急</span>' : '';
  const tr = v.flags.training ? '<span class="tag">研修</span>' : '';
  return svc + two + em + tr;
}
function blockHtml(v, o) {
  const cls = ['vblock', 'st-' + v.status, o.conflict ? 'conflict' : ''].join(' ');
  const style = `top:${o.top}px;height:${o.height}px;left:calc(${o.left}% + 2px);width:calc(${o.width}% - 4px);border-left-color:${esc(sColor(v))}`;
  return `<div class="${cls}" data-id="${esc(v.id)}" style="${style}" title="${esc(tooltip(v))}">` +
    `<div class="vb-time">${v.start}–${v.end}</div><div class="vb-name">${esc(pName(v.patientId))}</div><div class="vb-tags">${tagsHtml(v, true)}</div></div>`;
}
function renderDay() {
  const db = state.db, date = state.date, f = state.filter;
  const visits = UI.visitsOn(db, date, f);
  const conflicts = UI.conflictIds(db.visits.filter(v => v.date === date));
  $('#summary').innerHTML = summaryHtml(visits, visits.filter(v => conflicts.has(v.id)).length);
  const axis = UI.axisRange(db.settings, visits);
  const height = (axis.endMin - axis.startMin) * PX_PER_MIN;
  // 列: 表示対象のスタッフ ＋ その日の訪問に出てくる無効スタッフ ＋ 未割当
  let staffCols = f.staffId === '__none__' ? [] : f.staffId ? [staffById(f.staffId)].filter(Boolean) : activeStaff().slice();
  const seen = new Set(staffCols.map(s => s.id));
  visits.forEach(v => v.staffIds.forEach(id => { if (!seen.has(id)) { const s = staffById(id); if (s) { staffCols.push(s); seen.add(id); } } }));
  const columns = staffCols.map(s => ({ id: s.id, label: VS.derive.staffDisplayName(s) + (s.archived ? '（無効）' : ''), sub: VS.ENUMS.staffRole[s.role], color: s.color, av: VS.derive.availabilityOn(db, s, date), items: visits.filter(v => v.staffIds.includes(s.id)) }));
  if (!f.staffId || f.staffId === '__none__') columns.push({ id: '', label: '未割当', sub: '', color: '#9ca3af', items: visits.filter(v => !v.staffIds.length) });
  if (!columns.length) return '<div class="empty">表示できる列がありません。</div>';
  const availTag = av => !av ? '' : av.source === 'employment' ? '<span class="tag em">在籍外</span>' : av.source === 'daily' ? `<span class="tag svc-nursing">${av.ranges.length ? '勤務表' : '勤務表: 休み'}</span>` : (!av.ranges.length ? '<span class="tag">勤務なし</span>' : '');
  const head = columns.map(c => `<div class="day-head-cell"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.label)}<small>${esc(c.sub)}</small>${availTag(c.av)}<span class="cnt">${c.items.filter(VS.derive.isActiveVisit).length}件</span></div>`).join('');
  let labels = '';
  for (let h = axis.startMin / 60; h <= axis.endMin / 60; h++) {
    const pos = h * 60 === axis.startMin ? ' first' : h * 60 === axis.endMin ? ' last' : '';
    labels += `<div class="hour-label${pos}" style="top:${(h * 60 - axis.startMin) * PX_PER_MIN}px">${pad2(h)}:00</div>`;
  }
  const body = columns.map(c => {
    const blocks = UI.layoutLanes(c.items).map(({ item: v, lane, laneCount }) => blockHtml(v, {
      top: (toMin(v.start) - axis.startMin) * PX_PER_MIN, height: Math.max(22, VS.derive.visitDurationMin(v) * PX_PER_MIN),
      left: lane / laneCount * 100, width: 100 / laneCount, conflict: conflicts.has(v.id)
    })).join('');
    const bands = c.av ? c.av.ranges.map(r => { const a = Math.max(toMin(r.start), axis.startMin), b = Math.min(toMin(r.end), axis.endMin); return b > a ? `<div class="avail-band" style="top:${(a - axis.startMin) * PX_PER_MIN}px;height:${(b - a) * PX_PER_MIN}px"></div>` : ''; }).join('') : '';
    return `<div class="day-col" data-staff="${esc(c.id)}" data-axis-start="${axis.startMin}" style="height:${height}px" title="クリックで訪問を追加">${bands}${blocks}</div>`;
  }).join('');
  return `<div class="day-wrap"><div class="day-grid" style="grid-template-columns:56px repeat(${columns.length}, minmax(150px, 1fr))">` +
    `<div class="day-corner"></div>${head}<div class="time-col" style="height:${height}px">${labels}</div>${body}</div></div>`;
}

/* --- 週 --- */
function chipHtml(v, o) {
  const cls = ['chip', 'st-' + v.status, o.conflict ? 'conflict' : ''].join(' ');
  const who = o.showStaff ? (v.staffIds.length ? v.staffIds.map(sName).join('・') : '未割当') : pName(v.patientId);
  return `<button type="button" class="${cls}" data-id="${esc(v.id)}" style="border-left-color:${esc(sColor(v))}" title="${esc(tooltip(v))}">` +
    `<span class="c-time">${v.start}</span> ${esc(who)}<span class="c-tags">${tagsHtml(v, false)}</span></button>`;
}
function renderWeek() {
  const db = state.db, f = state.filter;
  const dates = UI.weekRange(state.date, db.settings.weekStartDow);
  const visits = UI.visitsBetween(db, dates[0], dates[6], f);
  const conflicts = UI.conflictIds(db.visits.filter(v => v.date >= dates[0] && v.date <= dates[6]));
  $('#summary').innerHTML = summaryHtml(visits, visits.filter(v => conflicts.has(v.id)).length);
  const headCells = dates.map(d => {
    const hol = db.holidays.filter(h => h.date === d);
    return `<th class="${colCls(d)}"><button type="button" class="linkish" data-goto="${d}">${UI.fmtMD(d)}（${UI.DOW_JA[VS.date.dowOf(d)]}）</button>` +
      hol.map(h => `<div class="hol">${esc(h.name || VS.ENUMS.holidayKind[h.kind])}</div>`).join('') + '</th>';
  }).join('');
  let rows;
  if (state.weekMode === 'staff') {
    let list = f.staffId === '__none__' ? [] : f.staffId ? [staffById(f.staffId)].filter(Boolean) : activeStaff().slice();
    const seen = new Set(list.map(s => s.id));
    visits.forEach(v => v.staffIds.forEach(id => { if (!seen.has(id)) { const s = staffById(id); if (s) { list.push(s); seen.add(id); } } }));
    rows = list.map(s => ({ label: VS.derive.staffDisplayName(s) + (s.archived ? '（無効）' : ''), sub: VS.ENUMS.staffRole[s.role], color: s.color, addAttr: `data-staff="${esc(s.id)}"`, pick: v => v.staffIds.includes(s.id) }));
    if (!f.staffId || f.staffId === '__none__') rows.push({ label: '未割当', sub: '', color: '#9ca3af', addAttr: '', pick: v => !v.staffIds.length });
  } else {
    let list = f.patientId ? [patientById(f.patientId)].filter(Boolean) : activePatients();
    const seen = new Set(list.map(p => p.id));
    visits.forEach(v => { if (!seen.has(v.patientId)) { const p = patientById(v.patientId); if (p) { list.push(p); seen.add(p.id); } } });
    rows = list.map(p => ({ label: VS.derive.patientDisplayName(p) + (p.archived ? '（無効）' : ''), sub: VS.ENUMS.insurance[p.insurance] + (p.careLevel !== 'none' ? '・' + VS.ENUMS.careLevel[p.careLevel] : ''), color: '#6b7280', addAttr: `data-patient="${esc(p.id)}"`, pick: v => v.patientId === p.id }));
  }
  if (!rows.length) return '<div class="empty">表示できる行がありません。</div>';
  const body = rows.map(r => {
    const rowVisits = visits.filter(r.pick);
    const sum = UI.summarize(rowVisits);
    const cells = dates.map(d => {
      const chips = rowVisits.filter(v => v.date === d).map(v => chipHtml(v, { conflict: conflicts.has(v.id), showStaff: state.weekMode === 'patient' })).join('');
      return `<td class="cell ${colCls(d)}">${chips}<button type="button" class="add" data-add data-date="${d}" ${r.addAttr} title="この日に追加">＋ 追加</button></td>`;
    }).join('');
    return `<tr><th class="rowhead"><span class="dot" style="background:${esc(r.color)}"></span>${esc(r.label)}<small>${esc(r.sub)}</small><div class="rowsum">${sum.count}件 / ${UI.fmtHours(sum.minutes)}</div></th>${cells}</tr>`;
  }).join('');
  return `<div class="week-wrap"><table class="week"><thead><tr><th class="corner rowhead"></th>${headCells}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* --- 月 --- */
function renderMonth() {
  const db = state.db, f = state.filter;
  const { y, m } = UI.ym(state.date);
  const grid = UI.monthGrid(y, m, db.settings.weekStartDow);
  const visits = UI.visitsBetween(db, grid.dates[0], grid.dates[grid.dates.length - 1], f);
  const conflicts = UI.conflictIds(db.visits.filter(v => v.date >= grid.dates[0] && v.date <= grid.dates[grid.dates.length - 1]));
  const inMonth = visits.filter(v => v.date >= grid.first && v.date <= grid.last);
  $('#summary').innerHTML = summaryHtml(inMonth, inMonth.filter(v => conflicts.has(v.id)).length);
  const head = Array.from({ length: 7 }, (_, i) => `<div>${UI.DOW_JA[(db.settings.weekStartDow + i) % 7]}</div>`).join('');
  const cells = grid.dates.map(d => {
    const items = visits.filter(v => v.date === d);
    const shown = items.slice(0, MONTH_CHIP_MAX), more = items.length - shown.length;
    const hol = db.holidays.filter(h => h.date === d);
    const active = items.filter(VS.derive.isActiveVisit).length;
    return `<div class="mcell ${d >= grid.first && d <= grid.last ? '' : 'other'} ${colCls(d)}">` +
      `<div class="mday"><button type="button" class="daynum" data-goto="${d}" title="日表示へ">${Number(d.slice(8))}</button>` +
      hol.map(h => `<span class="hol">${esc(h.name || VS.ENUMS.holidayKind[h.kind])}</span>`).join('') +
      `<span class="mcount">${active ? active + '件' : ''}</span><button type="button" class="add" data-add data-date="${d}" title="この日に追加">＋</button></div>` +
      shown.map(v => chipHtml(v, { conflict: conflicts.has(v.id), showStaff: false })).join('') +
      (more ? `<button type="button" class="more" data-goto="${d}">他 ${more} 件</button>` : '') + '</div>';
  }).join('');
  return `<div class="month-head">${head}</div><div class="month">${cells}</div>`;
}

/* --- データ --- */
function renderData() {
  const { db, errors, backupKey } = state.load;
  $('#storage-key').textContent = VS.STORAGE_KEY;
  const banner = $('#load-banner');
  banner.hidden = !errors.length;

const tval = s => { if (!s) return ''; s = String(s).slice(0, 5); return VS.time.isTimeStr(s) ? s : ''; };
function wireForm(v) {
  const form = $('#visit-form');
  const startEl = form.elements.start, endEl = form.elements.end, readout = $('#dur-readout');
  let lastDur = state.db.settings.defaultDurationMin;
  if (v) lastDur = VS.derive.visitDurationMin(v);
  else if (modal.prefill && tval(modal.prefill.start) && tval(modal.prefill.end) && toMin(modal.prefill.end) > toMin(modal.prefill.start)) lastDur = toMin(modal.prefill.end) - toMin(modal.prefill.start);
  const updateDur = () => { const s = tval(startEl.value), e = tval(endEl.value); readout.textContent = s && e && toMin(e) > toMin(s) ? `${toMin(e) - toMin(s)} 分` : '—'; };
  startEl.addEventListener('change', () => {
    const s = tval(startEl.value); if (!s) return;
    const e = tval(endEl.value);
    if (!e || toMin(e) <= toMin(s)) endEl.value = fromMin(Math.min(24 * 60 - 1, toMin(s) + lastDur));
    updateDur();
  });
  endEl.addEventListener('change', () => { const s = tval(startEl.value), e = tval(endEl.value); if (s && e && toMin(e) > toMin(s)) lastDur = toMin(e) - toMin(s); updateDur(); });
  updateDur();
  form.addEventListener('submit', ev => { ev.preventDefault(); saveFromForm(v); });
  $('#btn-close-modal').onclick = closeModal;
  const del = $('#btn-delete'); if (del) del.onclick = () => deleteVisit(v.id);
  $$('#modal [data-status]').forEach(b => { b.onclick = () => startStatusAction(v, b.dataset.status); });
  $$('#modal [data-open]').forEach(b => { b.onclick = () => openVisitModal({ id: b.dataset.open }); });
}
function readForm(form) {
  const f = form.elements;
  const patch = {
    date: f.date.value, start: tval(f.start.value), end: tval(f.end.value),
    patientId: f.patientId.value, staffIds: [f.staff1.value, f.staff2.value].filter(Boolean),
    serviceType: f.serviceType.value, flags: { emergency: f.emergency.checked, training: f.training.checked }, note: f.note.value.trim()
  };
  if (f.aStart) patch.actual = { start: tval(f.aStart.value), end: tval(f.aEnd.value) };
  return patch;
}
/* 検証エラーの path（例: preferences.preferredTimeRanges[1].start）を日本語のラベル列にする */
function labelFor(path) {
  if (!path) return '';
  const parts = [];
  String(path).split('.').forEach(seg => {
    const m = seg.match(/^([^\[]+)(?:\[(\d+)\])?$/);
    if (m && FIELD_LABEL[m[1]]) parts.push(FIELD_LABEL[m[1]] + (m[2] !== undefined ? ` ${Number(m[2]) + 1}行目` : ''));
  });
  return parts.join(' › ');
}
function showMsgs(errors, warnings) {
  const el = $('#form-msgs'); if (!el) return;
  const fmt = e => e.text || (labelFor(e.path) ? `${labelFor(e.path)}: ${e.msg}` : e.msg);
  el.innerHTML = (errors.length ? `<ul class="msgs err">${errors.map(e => `<li>${esc(fmt(e))}</li>`).join('')}</ul>` : '') +
    (warnings.length ? `<ul class="msgs warn">${warnings.map(w => `<li>${esc(w.msg)}</li>`).join('')}</ul>` : '');
}
function saveFromForm(v) {
  const patch = readForm($('#visit-form'));
  const candidate = v ? Object.assign(VS.clone(v), patch, { updatedAt: VS.nowIso() }) : VS.create.visit(patch);
  const errs = VS.validate.visit(candidate);
  if (errs.length) { showMsgs(errs, []); return; }
  const rules = VS.rules.checkVisitRules(state.db, candidate);
  const blocking = rules.filter(r => isBlock(r.code)), warnings = rules.filter(r => !isBlock(r.code));
  if (blocking.length) { showMsgs(blocking, warnings); return; }
  try { if (v) VS.repo.visits.update(state.db, v.id, patch); else VS.repo.visits.add(state.db, candidate); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
  if (!persist()) { closeModal(); render(); return; }
  if (!v || candidate.date !== state.date) state.date = candidate.date;
  closeModal(); render();
  toast(warnings.length ? '保存しました（注意: ' + warnings.map(w => w.msg).join(' / ') + '）' : '保存しました');
}

function applyTransfer(id, { date, start, keepStaff }) {
  const src = VS.repo.visits.get(state.db, id);

  let dst;

  const list = sortedPatients(state.db.patients.filter(p => (state.masterArchived || !p.archived) && matchSearch(state.masterSearch, p.name, p.nameKana, p.displayName, p.code)));
  if (!list.length) return `<div class="empty">${state.db.patients.length ? '該当する利用者がいません。' : '利用者が登録されていません。「＋ 利用者を追加」から登録してください。'}</div>`;
  const rows = list.map(p => {
    const st = VS.derive.patientStatusOn(p, today), ins = instructionStatus(p);
    const plans = state.db.plans.filter(pl => !pl.archived && pl.patientId === p.id).length;
    const fut = futureVisits(v => v.patientId === p.id).length;
    return `<tr class="clickable${p.archived ? ' archived-row' : ''}" data-pid="${esc(p.id)}">` +
      `<td><b>${esc(VS.derive.patientDisplayName(p))}</b>${p.displayName ? `<div class="muted">${esc(p.name)}</div>` : ''}${p.archived ? ' <span class="tag">無効</span>' : ''}</td>` +
      `<td>${esc(VS.ENUMS.insurance[p.insurance])}${p.careLevel !== 'none' ? '<br>' + esc(VS.ENUMS.careLevel[p.careLevel]) : ''}${p.psychiatric ? '<br>精神科' : ''}</td>` +
      `<td class="${ins.cls}">${esc(ins.text)}</td>` +
      `<td>${esc(p.contract.start || '—')} 〜 ${esc(p.contract.end || '')}</td>` +
      `<td class="${st !== 'active' ? 'warn-text' : ''}">${esc(VS.ENUMS.patientStatus[st])}</td>` +
      `<td>${plans}</td><td>${fut}</td><td>${esc(p.area)}</td></tr>`;
  }).join('');
  return `<div class="list-wrap"><table class="list"><thead><tr><th>表示名</th><th>保険</th><th>指示書</th><th>契約期間</th><th>今日の状態</th><th>計画</th><th>今後の予定</th><th>エリア</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function availSummary(s) {
  if (!s.availability.length) return '—';
  const groups = new Map();
  s.availability.slice().sort((a, b) => a.dow - b.dow).forEach(a => { const k = `${a.start}〜${a.end}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(UI.DOW_JA[a.dow]); });
  return Array.from(groups, ([k, dows]) => `${dows.join('')} ${k}`).join(' / ');
}
function renderStaffList() {
  const list = sortedStaff(state.db.staff.filter(s => (state.masterArchived || !s.archived) && matchSearch(state.masterSearch, s.name, s.displayName)));
  if (!list.length) return `<div class="list-wrap">${shiftsBarHtml()}<div class="empty">${state.db.staff.length ? '該当するスタッフがいません。' : 'スタッフが登録されていません。「＋ スタッフを追加」から登録してください。'}</div></div>`;
  const rows = list.map(s => {
    const fut = futureVisits(v => v.staffIds.includes(s.id)).length;
    return `<tr class="clickable${s.archived ? ' archived-row' : ''}" data-sid="${esc(s.id)}">` +
      `<td><span class="dot" style="background:${esc(s.color)}"></span><b>${esc(VS.derive.staffDisplayName(s))}</b>${s.displayName ? `<div class="muted">${esc(s.name)}</div>` : ''}${s.archived ? ' <span class="tag">無効</span>' : ''}</td>` +

      `<td>${esc(availSummary(s))}</td>` +

      `<td>${fut}</td><td>${esc(s.skills.map(k => SKILL_TAGS[k] || k).join('・'))}</td></tr>`;

  return `<div class="list-wrap">${shiftsBarHtml()}<table class="list"><thead><tr><th>表示名</th><th>職種</th><th>雇用</th><th>勤務可能枠</th><th>在籍期間</th><th>今後の予定</th><th>領域</th></tr></thead><tbody>${rows}</tbody></table></div>`;

function recurrenceLabel(r) {
  if (r.kind === 'biweekly') return `隔週（基準 ${r.anchorDate ? UI.fmtMD(r.anchorDate) : '—'}）`;
  if (r.kind === 'weeksOfMonth') return `第${(r.weeksOfMonth || []).join('・')}週`;
  return '毎週';
}
function renderPlanList() {
  const list = state.db.plans.filter(pl => state.masterArchived || !pl.archived)
    .filter(pl => { const p = patientById(pl.patientId); return matchSearch(state.masterSearch, p && p.name, p && p.displayName, p && p.nameKana); })
    .sort((a, b) => pName(a.patientId).localeCompare(pName(b.patientId), 'ja') || (a.dow - b.dow) || (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));

  const rows = list.map(pl => {

/* --- 共通: 保存・無効化・復元 --- */
function masterFooterHtml(entity) {
  return `<div id="form-msgs"></div><div class="modal-foot">` +
    (entity ? (entity.archived ? '<button type="button" id="btn-restore">有効に戻す</button>' : '<button type="button" class="danger" id="btn-archive">無効にする</button>') : '') +
    `<span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button><button type="submit" class="primary" id="btn-save">保存</button></div>`;
}
function wireMasterFooter(coll, entity, archiveMsg) {
  $('#btn-close-modal').onclick = closeModal;
  const a = $('#btn-archive'); if (a) a.onclick = () => archiveEntity(coll, entity.id, archiveMsg);
  const r = $('#btn-restore'); if (r) r.onclick = () => restoreEntity(coll, entity.id);
}
/* 項目の検証 → 追加の制約判定 → リポジトリへ反映 → 保存。失敗時はメッセージを出して止まる */
function saveEntity(coll, entity, patch, validator, factory, extraCheck) {
  const candidate = entity ? Object.assign(VS.clone(entity), patch) : factory(patch);
  const errs = validator(candidate);
  if (errs.length) { showMsgs(errs, []); return; }
  let warnings = [];
  if (extraCheck) {
    const r = extraCheck(candidate);
    if (r.blocking.length) { showMsgs(r.blocking, r.warnings); return; }
    warnings = r.warnings;
  }
  try { if (entity) VS.repo[coll].update(state.db, entity.id, patch); else VS.repo[coll].add(state.db, candidate); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
  if (!persist()) { closeModal(); render(); return; }
  closeModal(); render();
  toast(warnings.length ? '保存しました（注意: ' + warnings.map(w => w.msg).join(' / ') + '）' : '保存しました');
}
function archiveEntity(coll, id, message) {
  if (!confirm(message)) return;
  try { VS.repo[coll].archive(state.db, id); } catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); return; }
  if (!persist()) { closeModal(); render(); return; }
  closeModal(); render(); toast('無効にしました');
}
function restoreEntity(coll, id) {
  try { VS.repo[coll].restore(state.db, id); } catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); return; }
  if (!persist()) { closeModal(); render(); return; }
  closeModal(); render(); toast('有効に戻しました');
}

function readPatientForm(form) {

  return {
    name: gv('name').value.trim(), nameKana: gv('nameKana').value.trim(), displayName: gv('displayName').value.trim(), code: gv('code').value.trim(),
    insurance: gv('insurance').value, careLevel: gv('careLevel').value, psychiatric: gv('psychiatric').checked, publicExpense: gv('publicExpense').checked,
    specialFlags: { betsu7: gv('betsu7').checked, betsu8: gv('betsu8').checked },

/* --- 訪問計画 --- */
function planFormHtml(d, isEdit) {
  const patients = withCurrent(activePatients(), d.patientId, patientById);
  const staffSel = (name, value, empty) => `<select name="${name}">${optionList(withCurrent(sortedStaff(activeStaff()), value, staffById), value, s => `${VS.derive.staffDisplayName(s)}（${VS.ENUMS.staffRole[s.role]}）${s.archived ? '・無効' : ''}`, empty)}</select>`;
  const r = d.recurrence;
  const recSub = (kind, inner) => `<span class="rec-sub${r.kind === kind ? ' on' : ''}" data-rec="${kind}">${inner}</span>`;
  return `<form id="master-form" autocomplete="off" novalidate><div class="grid2">` +
    fld('利用者 *', `<select name="patientId">${optionList(patients, d.patientId, p => VS.derive.patientDisplayName(p) + (p.archived ? '（無効）' : ''), '選択してください')}</select>`) +
    fld('種別', selectHtml('serviceType', VS.ENUMS.serviceType, d.serviceType)) +
    fld('曜日', `<select name="dow">${dowOptions(d.dow, false)}</select>`) +
    fld('開始時刻', `<input type="time" name="start" value="${esc(d.start)}" step="300" required>`) +
    fld('所要時間（分）', `<input type="number" name="durationMin" value="${d.durationMin}" min="5" max="600" step="5" required>`) +
    `<label>終了時刻<span class="readout" id="plan-end">—</span></label>` +
    fld('担当1', staffSel('staff1', d.staffIds[0] || '', '未割当')) +
    fld('担当2（複数名訪問）', staffSel('staff2', d.staffIds[1] || '', 'なし')) +
    `<div class="wide"><div class="sub-label">繰り返し</div><div class="rec-opts">` +
    `<label class="chk"><input type="radio" name="recKind" value="weekly" ${r.kind === 'weekly' ? 'checked' : ''}> 毎週</label>` +
    `<label class="chk"><input type="radio" name="recKind" value="biweekly" ${r.kind === 'biweekly' ? 'checked' : ''}> 隔週</label>` +
    recSub('biweekly', `基準日 <input type="date" name="anchorDate" value="${esc(r.anchorDate || '')}"><span class="muted">基準日以降で最初にその曜日になる日から2週おき</span>`) +
    `<label class="chk"><input type="radio" name="recKind" value="weeksOfMonth" ${r.kind === 'weeksOfMonth' ? 'checked' : ''}> 第N週</label>` +
    recSub('weeksOfMonth', [1, 2, 3, 4, 5].map(w => `<label class="chk"><input type="checkbox" name="weeks" value="${w}" ${(r.weeksOfMonth || []).includes(w) ? 'checked' : ''}> 第${w}</label>`).join('')) +
    `</div></div>` +
    fld('有効期間 開始', `<input type="date" name="periodFrom" value="${esc(d.period.from || '')}">`) +
    fld('有効期間 終了（継続中は空欄）', `<input type="date" name="periodTo" value="${esc(d.period.to || '')}">`) +
    fld('備考', `<textarea name="note" rows="2">${esc(d.note)}</textarea>`, 'wide') +
    `</div><div class="btns preview-row"><button type="button" class="small" id="btn-plan-preview">当月の展開日を確認</button><span id="plan-preview" class="muted"></span></div>` +
    masterFooterHtml(isEdit ? d : null) + `</form>`;
}
function readPlanForm(form) {
  const gv = n => form.elements.namedItem(n);
  const kind = gv('recKind').value;
  const dur = gv('durationMin').value === '' ? 0 : Number(gv('durationMin').value);
  return {
    patientId: gv('patientId').value, serviceType: gv('serviceType').value, dow: Number(gv('dow').value), start: tval(gv('start').value),
    durationMin: dur, staffIds: [gv('staff1').value, gv('staff2').value].filter(Boolean),
    recurrence: { kind, anchorDate: kind === 'biweekly' ? (gv('anchorDate').value || null) : null, weeksOfMonth: kind === 'weeksOfMonth' ? checkedVals(form, 'weeks').map(Number) : null },
    period: { from: gv('periodFrom').value || null, to: gv('periodTo').value || null },
    note: gv('note').value.trim()
  };
}
function planCheck(candidate) {
  const rules = VS.rules.checkPlanRules(state.db, candidate);
  return { blocking: rules.filter(x => isBlock(x.code)), warnings: rules.filter(x => !isBlock(x.code)) };
}
function openPlanModal(id) {
  const pl = id ? VS.repo.plans.get(state.db, id) : null;
  if (id && !pl) { toast('計画が見つかりません'); return; }
  const d = pl || VS.create.plan({ period: { from: todayStr(), to: null }, durationMin: state.db.settings.defaultDurationMin });
  openModal(pl ? '訪問計画の編集' : '訪問計画の追加', planFormHtml(d, !!pl), { wide: true });
  const form = $('#master-form');
  const gv = n => form.elements.namedItem(n);
  const updateEnd = () => {
    const s = tval(gv('start').value), n = Number(gv('durationMin').value);
    $('#plan-end').textContent = s && Number.isInteger(n) && n > 0 ? (toMin(s) + n <= 24 * 60 ? fromMin(toMin(s) + n) : '翌日にまたがります') : '—';
  };
  gv('start').addEventListener('change', updateEnd); gv('durationMin').addEventListener('input', updateEnd); updateEnd();
  const syncRec = () => { const k = gv('recKind').value; form.querySelectorAll('.rec-sub').forEach(el => el.classList.toggle('on', el.dataset.rec === k)); };
  form.querySelectorAll('input[name="recKind"]').forEach(x => x.addEventListener('change', syncRec)); syncRec();
  form.addEventListener('submit', ev => { ev.preventDefault(); saveEntity('plans', pl, readPlanForm(form), VS.validate.plan, VS.create.plan, planCheck); });
  $('#btn-plan-preview').onclick = () => {
    const patch = readPlanForm(form);
    const candidate = pl ? Object.assign(VS.clone(pl), patch) : VS.create.plan(patch);
    const errs = VS.validate.plan(candidate);
    if (errs.length) { showMsgs(errs, []); return; }
    const { y, m } = UI.ym(state.date);
    const r = VS.rules.expandPlan(state.db, candidate, y, m);
    const dates = r.visits.map(v => `${UI.fmtMD(v.date)}（${UI.DOW_JA[VS.date.dowOf(v.date)]}）`);
    const skipped = r.skipped.filter(x => x.date).map(x => `${UI.fmtMD(x.date)} ${SKIP_LABEL[x.reason] || x.reason}`);
    $('#plan-preview').textContent = `${y}年${m}月: ` + (dates.length ? dates.join('、') : '展開される日はありません') +
      (skipped.length ? `　見送り: ${skipped.join('、')}` : '') + (r.skipped.some(x => !x.date) ? '　（利用者が無効のため展開されません）' : '');
    const rules = planCheck(candidate); showMsgs(rules.blocking, rules.warnings);
  };
  wireMasterFooter('plans', pl, pl ? 'この訪問計画を無効にします。すでに展開した訪問は残りますが、今後は展開されません。よろしいですか？' : '');
  if (pl) { const rules = planCheck(pl); showMsgs(rules.blocking, rules.warnings); }
}

function addHolidayFromForm(form) {

  catch (err) { $('#holiday-msgs').textContent = [err.message].concat((err.errors || []).map(e => e.msg)).join(' / '); return; }

function removeHoliday(key) {

  render(); toast('削除しました');
}
function setSkipNational(checked) {

/* ---------- 月次チェック ---------- */
const ISSUE_LABEL = { weeklyLimit: '医療保険の週3日制限', planCount: '計画回数との差', staffOverlap: '担当の時間重複', patientOverlap: '利用者の時間重複', patientStatus: '入院・休止・契約外の訪問', noInstruction: '有効な指示書がない', staffOff: '勤務表で勤務外', staffUnavailable: '標準の勤務枠外', staffNotEmployed: '在籍期間外', roleMismatch: '職種不一致', ngStaff: 'NG担当', roleNotAllowed: '対応可能職種外', needsTwoStaff: '2名訪問が必要', travelTight: '移動時間が不足', unassigned: '担当が未割当', staffArchived: '無効化した担当', noStaff: 'スタッフ不明', noPatient: '利用者不明' };
function openMonthCheck() {
  const { y, m } = UI.ym(state.date);
  const issues = VS.rules.checkMonth(state.db, y, m);
  const blocks = issues.filter(i => i.level === 'block').length, warns = issues.length - blocks;
  const groups = new Map();
  issues.forEach(i => { if (!groups.has(i.code)) groups.set(i.code, []); groups.get(i.code).push(i); });
  let html = `<p class="muted">${y}年${m}月の予定（キャンセル・振替元を除く）を制約と照らしました。項目をクリックすると訪問または利用者を開きます。</p>` +
    `<p id="check-summary">${issues.length ? `<span class="badge lvl-block">要対応 ${blocks}</span> <span class="badge lvl-warn">注意 ${warns}</span>` : '<span class="ok">問題はありません</span>'}</p>`;
  for (const [code, list] of groups) {
    html += `<details class="issue-group" open><summary><span class="badge lvl-${list[0].level}">${list[0].level === 'block' ? '要対応' : '注意'}</span> ${esc(ISSUE_LABEL[code] || code)}（${list.length}）</summary><ul class="issue-list">` +
      list.map(i => {
        const v = i.visitIds && i.visitIds.length ? VS.repo.visits.get(state.db, i.visitIds[0]) : null;
        const link = (code === 'planCount' || code === 'weeklyLimit')
          ? `<button type="button" class="linkish" data-open-patient="${esc(i.patientId)}">利用者を開く</button>`
          : (v ? `<button type="button" class="linkish" data-open-visit="${esc(v.id)}">${UI.fmtMD(v.date)}（${UI.DOW_JA[VS.date.dowOf(v.date)]}）${v.start} ${esc(pName(v.patientId))}</button>` : '');
        return `<li>${link} <span>${esc(i.msg)}</span>${i.visitIds && i.visitIds.length > 1 ? `<span class="muted">（${i.visitIds.length} 件）</span>` : ''}</li>`;
      }).join('') + '</ul></details>';
  }
  html += '<div class="modal-foot"><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button></div>';
  openModal(`月次チェック ${y}年${m}月`, html, { wide: true });
  $('#btn-close-modal').onclick = closeModal;
  $$('#modal [data-open-visit]').forEach(b => { b.onclick = () => openVisitModal({ id: b.dataset.openVisit }); });
  $$('#modal [data-open-patient]').forEach(b => { b.onclick = () => openPatientModal(b.dataset.openPatient); });
}

/* ---------- 出力（印刷・CSV） ---------- */
const NO_FILTER = { staffId: '', patientId: '', serviceType: '', showInactive: false };
function monthOptions(selected) {
  const { y, m } = UI.ym(todayStr());
  const opts = [];
  for (let k = -12; k <= 12; k++) { const t = UI.addMonths(y, m, k); const v = `${t.y}-${pad2(t.m)}`; opts.push(`<option value="${v}" ${v === selected ? 'selected' : ''}>${t.y}年${t.m}月</option>`); }
  if (!opts.some(o => o.includes(`value="${selected}"`))) opts.unshift(`<option value="${esc(selected)}" selected>${esc(selected)}</option>`);
  return opts.join('');
}
function monthRange(ym) { const [y, m] = ym.split('-').map(Number); return { y, m, from: `${ym}-01`, to: `${ym}-${pad2(VS.date.daysInMonth(y, m))}` }; }
function printHead(title) {
  return `<div class="print-head"><h2>${esc(title)}</h2><span class="print-station">${esc(state.db.meta.stationName || '')}</span></div>`;
}
function renderOutput() {
  const o = state.output;
  const isDay = o.type === 'staffDay', isCsv = o.type === 'csv';
  const targets = isDay ? sortedStaff(activeStaff()).map(s => [s.id, VS.derive.staffDisplayName(s)]) : activePatients().map(p => [p.id, VS.derive.patientDisplayName(p)]);
  const form = '<form id="output-form" class="output-form" autocomplete="off">' +
    `<label>種類<select name="type"><option value="patientMonth" ${o.type === 'patientMonth' ? 'selected' : ''}>利用者別 月間予定表</option><option value="staffDay" ${isDay ? 'selected' : ''}>スタッフ別 日課表</option><option value="csv" ${isCsv ? 'selected' : ''}>CSV（訪問一覧）</option></select></label>` +
    (isDay ? `<label>日付<input type="date" name="date" value="${esc(o.date)}"></label>` : `<label>対象月<select name="month">${monthOptions(o.month)}</select></label>`) +
    (isCsv ? '' : `<label>対象<select name="target"><option value="">すべて</option>${targets.map(([id, l]) => `<option value="${esc(id)}" ${o.target === id ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`) +
    (isCsv ? `<label class="chk"><input type="checkbox" name="withInactive" ${o.withInactive ? 'checked' : ''}> キャンセル・振替元も含める</label>` : '') +
    (isCsv ? '<button type="button" class="primary" id="btn-csv">CSVを書き出す</button>' : '<button type="button" class="primary" id="btn-print">印刷</button>') +
    `<span class="muted">${isCsv ? 'UTF-8（BOM付き）で保存します。Excel でそのまま開けます。' : '印刷はブラウザの印刷画面が開きます。PDF として保存もできます。'}</span></form>`;
  const body = isCsv ? csvPreview() : isDay ? staffDaySheets() : patientMonthSheets();
  return form + `<div id="print-area">${body}</div>`;
}
function readOutputForm(form) {
  const gv = n => form.elements.namedItem(n);
  const o = state.output, type = gv('type').value;
  if (type !== o.type) { o.type = type; o.target = ''; return; }
  if (gv('month')) o.month = gv('month').value;
  if (gv('date') && VS.date.isDateStr(gv('date').value)) o.date = gv('date').value;
  o.target = gv('target') ? gv('target').value : '';
  if (gv('withInactive')) o.withInactive = gv('withInactive').checked;
}
function patientMonthSheets() {
  const { y, m, from, to } = monthRange(state.output.month);
  const all = UI.visitsBetween(state.db, from, to, NO_FILTER);
  const patients = state.output.target ? [patientById(state.output.target)].filter(Boolean) : sortedPatients(state.db.patients.filter(p => all.some(v => v.patientId === p.id)));
  if (!patients.length) return '<div class="empty">この月に予定のある利用者がいません。</div>';
  return patients.map(p => {
    const visits = all.filter(v => v.patientId === p.id);
    const rows = visits.map(v => `<tr><td class="num">${Number(v.date.slice(8))}</td><td>${UI.DOW_JA[VS.date.dowOf(v.date)]}</td><td>${v.start}〜${v.end}</td>` +
      `<td>${esc(VS.ENUMS.serviceType[v.serviceType])}${v.staffIds.length === 2 ? '（2名）' : ''}</td><td>${v.staffIds.length ? v.staffIds.map(id => esc(sName(id))).join('・') : '未定'}</td><td>${esc(v.note)}</td></tr>`).join('');
    const sub = [VS.ENUMS.insurance[p.insurance], p.careLevel !== 'none' ? VS.ENUMS.careLevel[p.careLevel] : '', p.careManager ? `担当ケアマネ: ${p.careManager}` : ''].filter(Boolean).join('　');
    return `<section class="print-page">${printHead(`訪問予定表　${y}年${m}月`)}<div class="print-meta"><b>${esc(p.name)}</b> 様${p.displayName && p.displayName !== p.name ? `（${esc(p.displayName)}）` : ''}<div class="muted">${esc(sub)}</div></div>` +
      `<table class="print-table"><thead><tr><th>日</th><th>曜</th><th>時間</th><th>内容</th><th>担当</th><th>備考</th></tr></thead><tbody>${rows || '<tr><td colspan="6">予定はありません</td></tr>'}</tbody></table>` +
      `<div class="print-foot"><span>合計 ${visits.length} 回</span><span>発行日 ${UI.fmtDateJa(todayStr())}</span></div></section>`;
  }).join('');
}
function staffDaySheets() {
  const date = state.output.date;
  if (!VS.date.isDateStr(date)) return '<div class="empty">日付を選んでください。</div>';
  const all = UI.visitsOn(state.db, date, NO_FILTER);
  const staffList = state.output.target ? [staffById(state.output.target)].filter(Boolean) : sortedStaff(state.db.staff.filter(s => all.some(v => v.staffIds.includes(s.id))));
  const sheets = staffList.map(s => {
    const visits = all.filter(v => v.staffIds.includes(s.id));
    const av = VS.derive.availabilityOn(state.db, s, date);
    const rows = visits.map(v => {
      const p = patientById(v.patientId), disp = p ? VS.derive.patientDisplayName(p) : '（利用者不明）';
      const pair = v.staffIds.length === 2 ? `（${v.staffIds.filter(id => id !== s.id).map(sName).join('・')}と2名）` : '';
      return `<tr><td>${v.start}〜${v.end}</td><td>${esc(disp)}${p && p.name !== disp ? `<div class="muted">${esc(p.name)}</div>` : ''}</td><td>${esc(VS.ENUMS.serviceType[v.serviceType])}${esc(pair)}</td><td>${esc(p ? p.area : '')}</td><td>${esc(v.note)}</td></tr>`;
    }).join('');
    return `<section class="print-page">${printHead(`日課表　${UI.fmtDateJa(date)}`)}<div class="print-meta"><b>${esc(VS.derive.staffDisplayName(s))}</b>（${esc(VS.ENUMS.staffRole[s.role])}）` +
      `<div class="muted">勤務枠: ${av.ranges.length ? av.ranges.map(r => `${r.start}〜${r.end}`).join('、') : 'なし'}${av.source === 'daily' ? '（勤務表）' : ''}</div></div>` +
      `<table class="print-table"><thead><tr><th>時間</th><th>利用者</th><th>内容</th><th>エリア</th><th>備考</th></tr></thead><tbody>${rows || '<tr><td colspan="5">訪問はありません</td></tr>'}</tbody></table>` +
      `<div class="print-foot"><span>合計 ${visits.length} 件 / ${UI.fmtHours(visits.reduce((a, v) => a + VS.derive.visitDurationMin(v), 0))}</span><span>発行日 ${UI.fmtDateJa(todayStr())}</span></div></section>`;
  });
  const un = all.filter(v => !v.staffIds.length);
  if (!state.output.target && un.length) {
    sheets.push(`<section class="print-page">${printHead(`未割当の訪問　${UI.fmtDateJa(date)}`)}<table class="print-table"><thead><tr><th>時間</th><th>利用者</th><th>内容</th><th>備考</th></tr></thead><tbody>` +
      un.map(v => `<tr><td>${v.start}〜${v.end}</td><td>${esc(pName(v.patientId))}</td><td>${esc(VS.ENUMS.serviceType[v.serviceType])}</td><td>${esc(v.note)}</td></tr>`).join('') + '</tbody></table></section>');
  }
  return sheets.join('') || '<div class="empty">この日に訪問のあるスタッフがいません。</div>';
}
function csvRows() {
  const { from, to } = monthRange(state.output.month);
  return UI.visitsBetween(state.db, from, to, Object.assign({}, NO_FILTER, { showInactive: state.output.withInactive }));
}
function csvPreview() {
  const rows = csvRows(), s = UI.summarize(rows), { y, m } = monthRange(state.output.month);
  return `<div class="csv-preview"><p>${y}年${m}月の訪問 <b>${rows.length}</b> 件（有効 ${s.count}・キャンセル等 ${s.inactive}）を書き出します。</p>` +
    '<p class="muted">列: 日付, 曜日, 開始, 終了, 利用者, 表示名, 保険, 種別, 担当1, 担当2, ステータス, 緊急, 研修同行, 実績開始, 実績終了, 備考, 計画ID, 訪問ID</p>' +
    `<pre class="sample">${esc(UI.visitsCsv(state.db, rows.slice(0, 5)).replace(/^﻿/, ''))}${rows.length > 5 ? '…' : ''}</pre></div>`;
}
function downloadCsv() {
  const rows = csvRows();
  const blob = new Blob([UI.visitsCsv(state.db, rows)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `訪問一覧_${state.output.month}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast(`${rows.length} 件を書き出しました`);
}

/* ---------- 祝日の一括登録 ---------- */
function bulkHolidayFormHtml() {
  const yNow = Number(todayStr().slice(0, 4));
  const years = [yNow - 1, yNow, yNow + 1, yNow + 2].filter(y => y >= 2022 && y <= 2099);
  return `<div class="inline-form"><label>祝日の一括登録<select id="bulk-year">${years.map(y => `<option value="${y}" ${y === yNow ? 'selected' : ''}>${y}年</option>`).join('')}</select></label>` +
    '<button type="button" id="btn-bulk-holidays">この年の祝日を登録</button><span class="muted">振替休日と国民の休日を含めて計算します（2022〜2099年）。登録済みの日付は飛ばします。</span></div>';
}
function bulkHolidays() {
  const year = Number($('#bulk-year').value);
  let list;
  try { list = VS.rules.japaneseHolidays(year); } catch (err) { alert(err.message); return; }
  const existing = new Set(state.db.holidays.map(h => h.date));
  const add = list.filter(h => !existing.has(h.date));
  if (!add.length) { toast(`${year}年の祝日はすべて登録済みです`); return; }
  if (!confirm(`${year}年の祝日 ${add.length} 件を登録します（${list.length - add.length} 件は登録済み）。よろしいですか？`)) return;
  try { add.forEach(h => VS.repo.holidays.add(state.db, VS.create.holiday({ date: h.date, name: h.name, kind: 'national' }))); }
  catch (err) { alert(err.message); loadDb(); render(); return; }
  if (!persist()) { render(); return; }
  render(); toast(`${add.length} 件の祝日を登録しました`);
}

/* ---------- ②勤務表の日別データ（取り込み） ---------- */
function shiftsBarHtml() {
  const list = state.db.shifts;
  const range = list.length ? `${list[0].date} 〜 ${list[list.length - 1].date}` : '';
  return `<div class="inline-form shifts-bar"><span>②勤務表の日別勤務データ: <b id="shift-count">${list.length}</b> 件${range ? `（${esc(range)}）` : ''}</span>` +
    '<button type="button" id="btn-shift-import">取り込む（CSV / JSON）</button><input type="file" id="shift-file" accept=".csv,.json,.txt,text/csv,application/json" hidden>' +
    `<button type="button" class="danger" id="btn-shift-clear" ${list.length ? '' : 'disabled'}>すべて削除</button>` +
    '<button type="button" class="linkish" id="btn-shift-format">取り込み形式</button>' +
    '<span class="muted">日別データがある日はそれを優先し、勤務外の訪問はブロックします。</span></div>';
}
function importShiftsText(text) {
  const r = VS.importers.parseShifts(text, state.db);
  const dates = r.shifts.map(s => s.date).sort();
  const staffCount = new Set(r.shifts.map(s => s.staffId)).size;
  const html = `<p id="import-summary">${r.shifts.length ? `<b>${r.shifts.length}</b> 件を取り込みます（スタッフ ${staffCount} 名、${dates[0]} 〜 ${dates[dates.length - 1]}）。同じスタッフ・日付の既存データは置き換えます。` : '取り込める行がありません。'}</p>` +
    (r.errors.length ? `<p class="warn-text">読み飛ばす行 ${r.errors.length} 件</p><ul class="issue-list">${r.errors.slice(0, 15).map(e => `<li>${e.line ? `${e.line}行目: ` : ''}${esc(e.msg)}</li>`).join('')}${r.errors.length > 15 ? '<li>…</li>' : ''}</ul>` : '') +
    (r.unmatched.length ? `<p class="muted">見つからない名前: ${r.unmatched.map(esc).join('、')}。スタッフの氏名か表示名と完全に一致させてください。</p>` : '') +
    `<div id="form-msgs"></div><div class="modal-foot"><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button>${r.shifts.length ? '<button type="button" class="primary" id="btn-shift-apply">取り込む</button>' : ''}</div>`;
  openModal('勤務データの取り込み', html);
  $('#btn-close-modal').onclick = closeModal;
  const apply = $('#btn-shift-apply');
  if (apply) apply.onclick = () => {
    let res;
    try { res = VS.repo.shifts.replaceFor(state.db, r.shifts); }
    catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
    if (!persist()) { closeModal(); render(); return; }
    closeModal(); render(); toast(`${res.added} 件を取り込みました（置き換え ${res.removed} 件）`);
  };
}
function clearShifts() {
  if (!confirm(`取り込んだ勤務データ ${state.db.shifts.length} 件をすべて削除します。標準の勤務枠に戻ります。よろしいですか？`)) return;
  VS.repo.shifts.clear(state.db);
  if (!persist()) { render(); return; }
  render(); toast('勤務データを削除しました');
}
function shiftFormatHelp() {
  const sample = '日付,スタッフ,開始,終了,区分\n2026-10-05,看護 太郎,08:30,17:30,勤務\n2026-10-06,看護 太郎,,,休み\n2026-10-06,看護(花),09:00,15:00,勤務';
  openModal('勤務データの取り込み形式', '<p>②勤務表から書き出した CSV または JSON を読み込みます。</p>' +
    '<p class="muted">CSV: 1行目が見出し。「日付」「スタッフ」は必須、「開始」「終了」「区分」は任意。スタッフは氏名または表示名と完全一致。区分は「勤務」「休み」など（空欄なら時刻の有無で判定）。同じスタッフ・日付に複数行あれば分割勤務。</p>' +
    `<pre class="sample">${esc(sample)}</pre>` +
    '<p class="muted">JSON: <code>[{"date":"2026-10-05","staff":"看護 太郎","start":"08:30","end":"17:30","kind":"work"}]</code> または <code>{"shifts":[...]}</code>。<code>staffId</code> でも指定できます。</p>' +
    '<div class="modal-foot"><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button></div>');
  $('#btn-close-modal').onclick = closeModal;
}

/* ---------- イベント ---------- */
function step(n) {
  if (state.view === 'day') state.date = VS.date.addDays(state.date, n);
  else if (state.view === 'week') state.date = VS.date.addDays(state.date, 7 * n);
  else {
    const { y, m } = UI.ym(state.date); const t = UI.addMonths(y, m, n);
    state.date = `${t.y}-${pad2(t.m)}-${pad2(Math.min(Number(state.date.slice(8)), VS.date.daysInMonth(t.y, t.m)))}`;
  }
  render();
}
function wireEvents() {
  $$('.tabs button').forEach(b => { b.onclick = () => {
    state.view = b.dataset.view;
    if (state.view === 'output') { state.output.month = state.date.slice(0, 7); state.output.date = state.date; }
    render();
  }; });
  $$('#week-mode button').forEach(b => { b.onclick = () => { state.weekMode = b.dataset.mode; render(); }; });
  $('#nav-prev').onclick = () => step(-1);
  $('#nav-next').onclick = () => step(1);
  $('#nav-today').onclick = () => { state.date = todayStr(); render(); };
  $('#date-input').onchange = e => { if (VS.date.isDateStr(e.target.value)) { state.date = e.target.value; render(); } };
  $('#f-staff').onchange = e => { state.filter.staffId = e.target.value; render(); };
  $('#f-patient').onchange = e => { state.filter.patientId = e.target.value; render(); };
  $('#f-service').onchange = e => { state.filter.serviceType = e.target.value; render(); };
  $('#f-inactive').onchange = e => { state.filter.showInactive = e.target.checked; render(); };
  $('#btn-add').onclick = () => openVisitModal({ prefill: { date: state.date } });
  $('#btn-expand').onclick = expandCurrentMonth;
  $('#btn-check').onclick = openMonthCheck;
  $('#view').addEventListener('click', e => {
    if (state.view === 'output') { if (e.target.closest('#btn-print')) window.print(); else if (e.target.closest('#btn-csv')) downloadCsv(); return; }
    if (state.view === 'master') { onMasterClick(e); return; }
    const open = e.target.closest('[data-id]');
    if (open) { openVisitModal({ id: open.dataset.id }); return; }
    const add = e.target.closest('[data-add]');
    if (add) { openVisitModal({ prefill: { date: add.dataset.date, staffIds: add.dataset.staff ? [add.dataset.staff] : [], patientId: add.dataset.patient || '' } }); return; }
    const go = e.target.closest('[data-goto]');
    if (go) { state.date = go.dataset.goto; state.view = 'day'; render(); return; }
    const col = e.target.closest('.day-col');
    if (col) {
      const rect = col.getBoundingClientRect();
      const slot = state.db.settings.slotMin;
      const min = UI.snapMin(Number(col.dataset.axisStart) + (e.clientY - rect.top) / PX_PER_MIN, slot);
      const startMin = Math.max(0, Math.min(min, 24 * 60 - slot));
      const endMin = Math.min(24 * 60 - 1, startMin + state.db.settings.defaultDurationMin);
      openVisitModal({ prefill: { date: state.date, start: fromMin(startMin), end: fromMin(endMin), staffIds: col.dataset.staff ? [col.dataset.staff] : [] } });
    }
  });
  $('#modal-close').onclick = closeModal;
  $('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

  // マスタ
  $$('#master-tabs button').forEach(b => { b.onclick = () => { state.master = b.dataset.master; state.masterSearch = ''; render(); }; });
  $('#master-search').addEventListener('input', e => { state.masterSearch = e.target.value; $('#view').innerHTML = renderMaster(); });
  $('#master-archived').onchange = e => { state.masterArchived = e.target.checked; render(); };
  $('#btn-master-add').onclick = openMasterAdd;
  $('#view').addEventListener('submit', e => {
    if (e.target.id === 'holiday-form') { e.preventDefault(); addHolidayFromForm(e.target); }
    else if (e.target.id === 'settings-form') { e.preventDefault(); saveSettings(e.target); }
  });
  $('#view').addEventListener('change', e => {
    if (e.target.id === 'skip-national') { setSkipNational(e.target.checked); return; }
    if (e.target.id === 'shift-file') {
      const f = e.target.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importShiftsText(String(reader.result));
      reader.readAsText(f); e.target.value = '';
      return;
    }
    const of = e.target.closest('#output-form');
    if (of) { readOutputForm(of); render(); }
  });
  $('#modal-body').addEventListener('click', e => {
    const add = e.target.closest('[data-rep-add]');
    if (add) { const rep = add.closest('.rep'); rep.insertBefore(htmlToEl(REPEATER_ROWS[rep.dataset.rep]({})), add); return; }
    const del = e.target.closest('[data-rep-del]');
    if (del) del.closest('.rep-row').remove();
  });

  // データタブ
  $('#btn-sample').onclick = () => {
    if (localStorage.getItem(VS.STORAGE_KEY) !== null && !confirm('保存済みデータをサンプルで置き換えます。よろしいですか？')) return;
    const now = new Date();
    const r = VS.store.save(VS.sample.build(now.getFullYear(), now.getMonth() + 1), localStorage);
    if (!r.ok) alert('保存できませんでした:\n' + r.errors.map(e => e.path + ' ' + e.msg).join('\n'));
    loadDb(); render(); toast('サンプルデータを読み込みました');
  };
  $('#btn-export').onclick = () => {
    const blob = new Blob([VS.store.exportJson(state.db)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `訪問スケジュール_${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#btn-import').onclick = () => $('#file-import').click();
  $('#file-import').onchange = ev => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { db, errors } = VS.store.parseDb(String(reader.result));
        if (errors.length) { alert('読み込んだデータに問題があります（保存しません）:\n' + errors.slice(0, 10).map(e => e.path + ' ' + e.msg).join('\n')); return; }
        if (!confirm(`利用者 ${db.patients.length} 名・訪問 ${db.visits.length} 件を読み込み、現在の保存データを置き換えます。よろしいですか？`)) return;
        const r = VS.store.save(db, localStorage);
        if (!r.ok) alert('保存できませんでした');
      } catch (e) { alert(e.message); }
      finally { ev.target.value = ''; loadDb(); render(); }
    };
    reader.readAsText(file);
  };
  $('#btn-clear').onclick = () => {
    if (!confirm('保存データをすべて削除します。先にJSONを書き出していますか？')) return;
    VS.store.clear(localStorage); loadDb(); render();
  };
}
function expandCurrentMonth() {
  const { y, m } = UI.ym(state.date);
  const plans = state.db.plans.filter(p => !p.archived);
  if (!plans.length) { alert('有効な訪問計画がありません。'); return; }
  if (!confirm(`${y}年${m}月に ${plans.length} 件の訪問計画を展開します。すでに展開済みの日は重複しません。よろしいですか？`)) return;
  let r;
  try { r = VS.rules.expandMonth(state.db, y, m); }
  catch (err) { alert('展開できませんでした: ' + err.message); loadDb(); render(); return; }
  if (!persist()) { render(); return; }
  const reasons = {};
  r.skipped.forEach(s => { reasons[s.reason] = (reasons[s.reason] || 0) + 1; });
  const detail = Object.entries(reasons).map(([k, n]) => `${SKIP_LABEL[k] || k} ${n}`).join('、');
  render();
  alert(`${r.added.length} 件の訪問を追加しました。` + (r.skipped.length ? `\n見送り ${r.skipped.length} 件（${detail}）` : ''));
}

/* ---------- 起動 ---------- */
loadPrefs();
loadDb();
wireEvents();
renderStaticData();
render();
if (state.load.errors.length) toast('保存データに問題がありました。「データ」タブで内容を確認してください');
})();
</script>
</body>
</html>
