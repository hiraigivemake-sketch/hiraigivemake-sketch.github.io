<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訪問スケジュール</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --ok:#15803d; --ng:#b91c1c; --warn:#b45309; --accent:#2563eb; --today:#eff6ff; --off:#f9fafb; --hol:#fff1f2; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; font-size:14px; }
  [hidden] { display:none !important; }
  button { font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  button:hover { background:#f3f4f6; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#1d4ed8; }
  button.danger { color:var(--ng); }
  button.small { padding:3px 8px; font-size:12px; }
  button.linkish { border:none; background:none; color:var(--accent); padding:0; font-size:inherit; text-decoration:underline; }
  button.linkish:hover { background:none; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, input[type=date], input[type=time], input[type=text], input[type=search], input[type=number], textarea { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:#f3f4f6; padding:1px 4px; border-radius:4px; }
  .muted { color:var(--sub); font-size:12px; }
  .ok { color:var(--ok); font-weight:600; } .ng { color:var(--ng); font-weight:600; }
  .spacer { flex:1; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  /* ヘッダー */
  .topbar { background:#fff; border-bottom:1px solid var(--line); padding:8px 16px; position:sticky; top:0; z-index:20; }
  .row1, .row2 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row2 { margin-top:6px; }
  .topbar h1 { font-size:17px; margin:0 12px 0 0; }
  .tabs, .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tabs button, .seg button { border:none; border-radius:0; padding:5px 14px; }
  .tabs button.active, .seg button.active { background:var(--accent); color:#fff; }
  .nav { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .nav-title { font-weight:600; margin:0 6px; }
  .actions { margin-left:auto; display:flex; gap:8px; }
  .summary { font-size:12px; color:var(--sub); margin-left:auto; }
  .summary b { color:var(--ink); }
  .chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; }

  main { padding:12px 16px 60px; }
  #view { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .empty { padding:40px 20px; text-align:center; color:var(--sub); }

  /* 共通: 訪問チップ・ブロック */
  .tag { display:inline-block; font-size:10px; line-height:1.3; padding:0 4px; border-radius:3px; background:#e5e7eb; color:#374151; margin-right:2px; vertical-align:middle; }
  .tag.svc-nursing { background:#dbeafe; color:#1e40af; }
  .tag.svc-rehab { background:#fef3c7; color:#92400e; }
  .tag.em { background:#fee2e2; color:#991b1b; }
  .vblock, .chip { background:#eef2ff; }
  .vblock.st-confirmed, .chip.st-confirmed { background:#e0e7ff; font-weight:600; }
  .vblock.st-done, .chip.st-done { background:#dcfce7; }
  .vblock.st-cancelled, .chip.st-cancelled { background:#f3f4f6; color:#9ca3af; text-decoration:line-through; }
  .vblock.st-transferred, .chip.st-transferred { background:#f3f4f6; color:#9ca3af; border-left-style:dashed; }
  .conflict { box-shadow:inset 0 0 0 2px var(--ng); }

  /* 日 */
  .day-wrap { overflow:auto; max-height:calc(100vh - 150px); }
  .day-grid { display:grid; min-width:100%; }
  .day-corner, .day-head-cell { position:sticky; top:0; z-index:5; background:#f9fafb; border-bottom:1px solid var(--line); padding:6px 8px; font-size:13px; }
  .day-head-cell { border-left:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .day-head-cell small { color:var(--sub); margin-left:4px; }
  .day-head-cell .cnt { float:right; color:var(--sub); font-size:12px; }
  .time-col { position:relative; background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 60px; }
  .hour-label { position:absolute; right:6px; font-size:11px; color:var(--sub); transform:translateY(-50%); background:#fff; padding:0 2px; }
  .hour-label.first { transform:translateY(2px); }
  .hour-label.last { transform:translateY(calc(-100% - 2px)); }
  .day-col { position:relative; border-left:1px solid var(--line); cursor:cell; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(#f3f4f6 1px, transparent 1px); background-size:100% 60px, 100% 30px; }
  .day-col:hover { background-color:#fafbff; }
  .vblock { position:absolute; border-left:4px solid; border-radius:5px; padding:2px 5px; font-size:11px; line-height:1.3; overflow:hidden; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .vblock:hover { filter:brightness(.97); z-index:3; }
  .vb-time { color:var(--sub); }
  .vb-name { font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 週 */
  .week-wrap { overflow:auto; max-height:calc(100vh - 150px); }
  table.week { border-collapse:separate; border-spacing:0; width:100%; min-width:960px; font-size:12px; }
  table.week th, table.week td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); vertical-align:top; }
  table.week thead th { position:sticky; top:0; background:#f9fafb; z-index:5; padding:6px; text-align:center; font-weight:600; }
  table.week th.rowhead { text-align:left; padding:6px 8px; min-width:150px; background:#f9fafb; position:sticky; left:0; z-index:4; }
  table.week thead th.corner { z-index:6; left:0; }
  table.week th.rowhead small { display:block; color:var(--sub); font-weight:normal; }
  .rowsum { color:var(--sub); font-weight:normal; font-size:11px; }
  table.week td.cell { padding:3px; min-width:120px; height:56px; }
  .hol { color:var(--ng); font-size:11px; font-weight:normal; }
  .col-off { background:var(--off); } .col-holiday { background:var(--hol); } .col-today { background:var(--today); }
  .chip { display:block; width:100%; text-align:left; border:1px solid transparent; border-left:3px solid; border-radius:4px; padding:2px 5px; margin-bottom:2px; font-size:11px; line-height:1.4; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip:hover { filter:brightness(.97); }
  .c-time { color:var(--sub); }
  .c-tags { margin-left:4px; }
  button.add { border:none; background:none; color:var(--sub); font-size:12px; padding:0 4px; opacity:0; }
  td.cell:hover button.add, .mcell:hover button.add, button.add:focus { opacity:1; }

  /* 月 */
  .month-head { display:grid; grid-template-columns:repeat(7,1fr); background:#f9fafb; border-bottom:1px solid var(--line); font-size:12px; text-align:center; }
  .month-head div { padding:6px; }
  .month { display:grid; grid-template-columns:repeat(7,1fr); }
  .mcell { min-height:110px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; font-size:11px; min-width:0; }
  .mcell:nth-child(7n) { border-right:none; }
  .mcell.other { background:#fafafa; color:#9ca3af; }
  .mday { display:flex; align-items:center; gap:4px; margin-bottom:3px; }
  .daynum { border:none; background:none; font-weight:600; font-size:13px; padding:0 5px; border-radius:50%; }
  .daynum:hover { background:#e5e7eb; }
  .mcell.col-today .daynum { background:var(--accent); color:#fff; }
  .mcount { color:var(--sub); margin-left:auto; }
  .more { border:none; background:none; color:var(--accent); font-size:11px; padding:0 4px; }

  /* データ */
  #data-view section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  #data-view h2 { font-size:16px; margin:0 0 10px; }
  table.plain { border-collapse:collapse; width:100%; font-size:13px; }
  table.plain th, table.plain td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  table.plain th { background:#f9fafb; font-weight:600; white-space:nowrap; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:12px; max-height:360px; }
  .counts span { display:inline-block; margin-right:14px; }
  .banner { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; padding:8px 12px; border-radius:8px; margin-bottom:12px; }

  /* モーダル */
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal { background:#fff; width:min(680px,100%); max-height:92vh; overflow:auto; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); }
  .modal-head h3 { margin:0; font-size:16px; }
  #modal-close { border:none; background:none; font-size:20px; line-height:1; padding:2px 6px; }
  .modal-body { padding:14px 18px 18px; }
  .status-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#e5e7eb; }
  .badge.st-planned { background:#dbeafe; } .badge.st-confirmed { background:#c7d2fe; } .badge.st-done { background:#dcfce7; }
  .panel { background:#f9fafb; border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .panel label, .grid2 label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .grid2 label.chk, .panel label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; }
  .grid2 .wide { grid-column:1 / -1; }
  .readout { font-size:14px; color:var(--ink); padding:5px 0; }
  .hint { font-size:12px; color:var(--warn); margin-bottom:8px; }
  .msgs { margin:10px 0 0; padding:8px 12px 8px 28px; border-radius:8px; font-size:13px; }
  .msgs.err { background:#fee2e2; color:#991b1b; } .msgs.warn { background:#fef3c7; color:#92400e; }
  .modal-foot { display:flex; gap:8px; align-items:center; margin-top:14px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; z-index:60; box-shadow:0 4px 16px rgba(0,0,0,.3); max-width:90vw; }

  /* マスタ */
  input[type=color] { padding:2px; width:48px; height:32px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  #master-search { width:200px; }
  .modal.wide { width:min(920px,100%); }
  .form-sec { border:1px solid var(--line); border-radius:8px; padding:8px 12px 10px; margin-bottom:10px; }
  .form-sec summary { cursor:pointer; font-weight:600; font-size:13px; margin-bottom:6px; }
  .form-sec > p.muted { margin:0 0 8px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 14px; }
  .grid3 label, #master-form > label, .form-sec > label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  #master-form > label, .form-sec > label { margin-top:8px; }
  .grid3 label.chk, .form-sec > label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; }
  .grid3 .wide { grid-column:1 / -1; }
  .sub-label { font-size:12px; color:var(--sub); margin:10px 0 4px; }
  .chips-wrap { display:flex; flex-wrap:wrap; gap:4px 14px; }
  .rep { margin-bottom:4px; }
  .rep-row { display:flex; gap:6px; align-items:center; margin-bottom:4px; flex-wrap:wrap; }
  .rep-row input, .rep-row select { font-size:12px; padding:3px 6px; }
  .rep-row input[type=text] { flex:1; min-width:120px; }
  .rec-opts { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  .rec-sub { display:none; align-items:center; gap:6px; }
  .rec-sub.on { display:inline-flex; }
  .preview-row { align-items:center; margin-top:10px; }
  .list-wrap { overflow:auto; max-height:calc(100vh - 170px); }
  table.list { border-collapse:collapse; width:100%; font-size:13px; }
  table.list th, table.list td { border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  table.list th { background:#f9fafb; font-weight:600; white-space:nowrap; position:sticky; top:0; z-index:2; }
  tr.clickable { cursor:pointer; } tr.clickable:hover { background:#f3f4f6; }
  tr.archived-row { color:#9ca3af; }
  .warn-text { color:var(--warn); } .ng-text { color:var(--ng); font-weight:600; }
  .inline-form { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-end; padding:12px; border-bottom:1px solid var(--line); }
  .inline-form label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  .inline-form label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; width:100%; }
  #holiday-msgs { font-size:12px; width:100%; }
  .station { color:var(--sub); font-size:12px; margin-right:12px; max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 勤務枠の帯（日表示） */
  .avail-band { position:absolute; left:0; right:0; background:rgba(22,163,74,.10); pointer-events:none; }
  .vblock { z-index:2; }
  /* 月次チェック */
  .issue-list { margin:4px 0 10px; padding-left:18px; font-size:13px; }
  .issue-list li { margin-bottom:3px; }
  .badge.lvl-block { background:#fee2e2; color:#991b1b; } .badge.lvl-warn { background:#fef3c7; color:#92400e; }
  details.issue-group { margin-bottom:6px; } details.issue-group summary { cursor:pointer; font-weight:600; }
  /* 出力 */
  .output-form { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:flex-end; padding:12px 16px; border-bottom:1px solid var(--line); background:#fff; }
  .output-form label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  .output-form label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; }
  #print-area { padding:16px; background:#eef0f3; }
  .print-page { background:#fff; padding:24px 28px; margin:0 auto 16px; max-width:210mm; box-shadow:0 1px 4px rgba(0,0,0,.12); font-size:13px; color:#111; }
  .print-head { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid #333; padding-bottom:6px; margin-bottom:10px; }
  .print-head h2 { margin:0; font-size:18px; } .print-station { font-size:13px; color:#333; }
  .print-meta { margin-bottom:8px; } .print-meta b { font-size:15px; }
  table.print-table { width:100%; border-collapse:collapse; }
  table.print-table th, table.print-table td { border:1px solid #777; padding:4px 8px; text-align:left; vertical-align:top; }
  table.print-table th { background:#f3f4f6; } table.print-table td.num { text-align:right; }
  .print-foot { margin-top:10px; display:flex; justify-content:space-between; font-size:12px; color:#333; }
  .csv-preview { padding:16px; font-size:13px; }
  .shifts-bar { background:#f9fafb; } .shifts-bar b { font-size:14px; }
  pre.sample { background:#f3f4f6; color:var(--ink); font-size:12px; padding:10px; border-radius:8px; max-height:220px; overflow:auto; }
  @page { size:A4; margin:12mm; }
  @media print {
    body.print-output .topbar, body.print-output .output-form, body.print-output #toast, body.print-output .modal-bg { display:none !important; }
    body.print-output main { padding:0; } body.print-output #view { border:none; } body.print-output #print-area { padding:0; background:#fff; }
    body.print-output .print-page { box-shadow:none; margin:0; max-width:none; padding:0; page-break-after:always; break-after:page; }
    body.print-output .print-page:last-child { page-break-after:auto; break-after:auto; }
  }
  .settings-form { padding:16px; max-width:820px; }
  .settings-form .form-sec h3 { font-size:13px; margin:0 0 8px; }
  .settings-form .grid2, .settings-form .grid3 { margin-top:6px; }

  @media (max-width:640px) { .grid2, .grid3 { grid-template-columns:1fr; } .topbar h1, .station { display:none; } .actions { margin-left:0; } .summary { margin-left:0; } }
  @media print {
    .tabs, .actions, .row2 select, .row2 .chk, .nav button, #date-input, #week-mode, button.add, .toast, .modal-bg { display:none !important; }
    body { background:#fff; } .topbar { position:static; border:none; } main { padding:0; }
    .day-wrap, .week-wrap { max-height:none; overflow:visible; } #view { border:none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="row1">
    <h1>訪問スケジュール</h1>
    <span class="station" id="station-name"></span>
    <nav class="tabs" aria-label="表示切替">
      <button type="button" data-view="day">日</button>
      <button type="button" data-view="week">週</button>
      <button type="button" data-view="month">月</button>
      <button type="button" data-view="output">出力</button>
      <button type="button" data-view="master">マスタ</button>
      <button type="button" data-view="data">データ</button>
    </nav>
    <div id="nav" class="nav">
      <button type="button" id="nav-prev" title="前へ">‹</button>
      <button type="button" id="nav-today">今日</button>
      <button type="button" id="nav-next" title="次へ">›</button>
      <span id="nav-title" class="nav-title"></span>
      <input type="date" id="date-input" aria-label="日付">
      <div id="week-mode" class="seg" hidden>
        <button type="button" data-mode="staff">スタッフ別</button>
        <button type="button" data-mode="patient">利用者別</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="btn-check" hidden title="この月の予定を制約と照らして確認します">月次チェック</button>
      <button type="button" id="btn-expand" hidden title="有効な訪問計画をこの月の予定として作成します">計画を展開</button>
      <button type="button" id="btn-add" class="primary">＋ 訪問を追加</button>
    </div>
  </div>
  <div id="filters" class="row2">
    <select id="f-staff" aria-label="スタッフで絞り込み"></select>
    <select id="f-patient" aria-label="利用者で絞り込み"></select>
    <select id="f-service" aria-label="種別で絞り込み">
      <option value="">看護・リハビリ</option>
      <option value="nursing">看護のみ</option>
      <option value="rehab">リハビリのみ</option>
    </select>
    <label class="chk"><input type="checkbox" id="f-inactive"> キャンセル・振替元も表示</label>
    <span id="summary" class="summary"></span>
  </div>
  <div id="master-bar" class="row2" hidden>
    <div class="seg" id="master-tabs">
      <button type="button" data-master="patients">利用者</button>
      <button type="button" data-master="staff">スタッフ</button>
      <button type="button" data-master="plans">訪問計画</button>
      <button type="button" data-master="holidays">休日</button>
      <button type="button" data-master="settings">設定</button>
    </div>
    <input type="search" id="master-search" placeholder="名前で検索" aria-label="検索">
    <label class="chk" id="master-archived-label"><input type="checkbox" id="master-archived"> 無効も表示</label>
    <span class="spacer"></span>
    <button type="button" id="btn-master-add" class="primary">＋ 追加</button>
  </div>
</header>
<main>
  <div id="view"></div>
  <section id="data-view" hidden>
    <div id="load-banner" class="banner" hidden></div>
    <section>
      <h2>保存データ</h2>
      <p class="muted">保存先はこのブラウザの localStorage（キー <code id="storage-key"></code>）です。別の端末やブラウザとは共有されません。月に一度はJSONを書き出して保管してください。</p>
      <div class="btns">
        <button type="button" class="primary" id="btn-sample">サンプルデータを読み込む（架空）</button>
        <button type="button" id="btn-export">JSONを書き出す</button>
        <button type="button" id="btn-import">JSONを読み込む</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <button type="button" class="danger" id="btn-clear">保存データを全削除</button>
      </div>
      <div class="counts" id="counts"></div>
      <div id="db-errors"></div>
      <pre id="db-preview"></pre>
    </section>
    <section>
      <h2>データ構造の概要</h2>

/* ------------------------------------------------------------------

const pad2 = n => String(n).padStart(2, '0');

function isDateStr(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  if (m < 1 || m > 12 || d < 1) return false;
  return d <= daysInMonth(y, m);
}
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }   // m: 1-12
function dateToStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function strToDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayStr() { return dateToStr(new Date()); }
function addDays(s, n) { const d = strToDate(s); d.setDate(d.getDate() + n); return dateToStr(d); }

function monthDates(y, m) {
  const n = daysInMonth(y, m), out = [];
  for (let d = 1; d <= n; d++) out.push(`${y}-${pad2(m)}-${pad2(d)}`);
  return out;
}
/* その月で何回目の同じ曜日か（第N週）。1日〜7日=1, 8日〜14日=2 … */
function weekOfMonth(s) { return Math.ceil(Number(s.slice(8, 10)) / 7); }
/* 2日付の差（日数）。b - a */
function diffDays(a, b) { return Math.round((strToDate(b) - strToDate(a)) / 86400000); }
/* from/to は null で開区間 */
function inPeriod(s, from, to) {
  if (from && s < from) return false;
  if (to && s > to) return false;
  return true;
}
function periodsOverlap(aFrom, aTo, bFrom, bTo) {
  const aF = aFrom || '0000-00-00', aT = aTo || '9999-99-99';
  const bF = bFrom || '0000-00-00', bT = bTo || '9999-99-99';
  return aF <= bT && bF <= aT;
}

function isTimeStr(s) {
  if (typeof s !== 'string' || !/^\d{2}:\d{2}$/.test(s)) return false;
  const [h, m] = s.split(':').map(Number);
  return (h >= 0 && h <= 23 && m >= 0 && m <= 59) || (h === 24 && m === 0);
}

function fromMin(n) { return `${pad2(Math.floor(n / 60))}:${pad2(n % 60)}`; }
function addMin(t, n) { return fromMin(toMin(t) + n); }
/* 半開区間 [start, end) の重なり判定 */

/* 訪問開始時刻から時間帯区分を返す（22:00〜06:00=深夜, 06:00〜08:00/18:00〜22:00=夜間・早朝） */

/* ------------------------------------------------------------------

 * ------------------------------------------------------------------ */
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

function checkPeriod(errs, path, p, { required = false } = {}) {
  if (!isObj(p)) { errs.push({ path, msg: '期間がありません' }); return; }
  for (const k of ['from', 'to', 'start', 'end']) {
    if (k in p && p[k] !== null && !isDateStr(p[k])) errs.push({ path: `${path}.${k}`, msg: `日付の形式が不正です（${p[k]}）` });
  }
  const a = p.from ?? p.start ?? null, b = p.to ?? p.end ?? null;
  if (required && !a) errs.push({ path: `${path}.from`, msg: '開始日は必須です' });
  if (a && b && isDateStr(a) && isDateStr(b) && a > b) errs.push({ path, msg: '開始日が終了日より後です' });

function checkTimeRange(errs, path, r, { allowDowNull = true } = {}) {
  if (!isObj(r)) { errs.push({ path, msg: '時間枠がありません' }); return; }
  if (!(allowDowNull && r.dow === null) && !(isInt(r.dow) && r.dow >= 0 && r.dow <= 6)) errs.push({ path: `${path}.dow`, msg: '曜日は0〜6です' });
  if (!isTimeStr(r.start)) errs.push({ path: `${path}.start`, msg: '開始時刻の形式が不正です' });
  if (!isTimeStr(r.end)) errs.push({ path: `${path}.end`, msg: '終了時刻の形式が不正です' });
  if (isTimeStr(r.start) && isTimeStr(r.end) && toMin(r.start) >= toMin(r.end)) errs.push({ path, msg: '開始時刻が終了時刻以降です' });

  if (arr.some(x => !isStr(x) || !x)) errs.push({ path, msg: 'IDが不正です' });
  if (new Set(arr).size !== arr.length) errs.push({ path, msg: 'IDが重複しています' });
  if (max !== undefined && arr.length > max) errs.push({ path, msg: `${max}件までです` });
}

function validatePatient(p) {
  const e = [];
  if (!isObj(p)) return [{ path: '', msg: '利用者がオブジェクトではありません' }];
  if (!isStr(p.id) || !p.id) e.push({ path: 'id', msg: 'IDは必須です' });

  if (!isEnum(p.insurance, ENUMS.insurance)) e.push({ path: 'insurance', msg: '保険種別が不正です' });
  if (!isEnum(p.careLevel, ENUMS.careLevel)) e.push({ path: 'careLevel', msg: '要介護度が不正です' });

  if (!isBool(p.psychiatric)) e.push({ path: 'psychiatric', msg: '真偽値が必要です' });
  if (!isBool(p.publicExpense)) e.push({ path: 'publicExpense', msg: '真偽値が必要です' });
  if (!isObj(p.specialFlags) || !isBool(p.specialFlags.betsu7) || !isBool(p.specialFlags.betsu8)) e.push({ path: 'specialFlags', msg: '別表7・8のフラグが不正です' });
  if (!Array.isArray(p.instructions)) e.push({ path: 'instructions', msg: '配列ではありません' });
  else p.instructions.forEach((ins, i) => {
    if (!isObj(ins) || !isStr(ins.id)) { e.push({ path: `instructions[${i}]`, msg: '指示書が不正です' }); return; }
    if (!isEnum(ins.type, ENUMS.instructionType)) e.push({ path: `instructions[${i}].type`, msg: '指示書種別が不正です' });
    checkPeriod(e, `instructions[${i}]`, ins, { required: true });
    if (!ins.to) e.push({ path: `instructions[${i}].to`, msg: '指示書には終了日が必要です' });
  });
  if (!isObj(p.requirements) || !isBool(p.requirements.needsTwoStaff) || !Array.isArray(p.requirements.allowedRoles)
      || p.requirements.allowedRoles.some(r => !isEnum(r, ENUMS.staffRole))) e.push({ path: 'requirements', msg: '要件が不正です' });
  if (!isObj(p.plannedVisits)) e.push({ path: 'plannedVisits', msg: '計画回数がありません' });
  else {
    const pv = p.plannedVisits;
    if (pv.perWeek !== null && (!isInt(pv.perWeek) || pv.perWeek < 0 || pv.perWeek > 50)) e.push({ path: 'plannedVisits.perWeek', msg: '週の計画回数は0〜50の整数です' });
    if (pv.perMonth !== null && (!isInt(pv.perMonth) || pv.perMonth < 0 || pv.perMonth > 200)) e.push({ path: 'plannedVisits.perMonth', msg: '月の計画回数は0〜200の整数です' });
  }
  if (!isObj(p.preferences)) e.push({ path: 'preferences', msg: '希望条件がありません' });
  else {

    (p.preferences.ngTimeRanges || []).forEach((r, i) => checkTimeRange(e, `preferences.ngTimeRanges[${i}]`, r));
    checkIdArray(e, 'preferences.preferredStaffIds', p.preferences.preferredStaffIds);
    checkIdArray(e, 'preferences.ngStaffIds', p.preferences.ngStaffIds);
    const both = (p.preferences.preferredStaffIds || []).filter(x => (p.preferences.ngStaffIds || []).includes(x));
    if (both.length) e.push({ path: 'preferences', msg: '希望担当とNG担当に同じスタッフがいます' });
  }
  checkPeriod(e, 'contract', p.contract || null);
  if (!Array.isArray(p.statusPeriods)) e.push({ path: 'statusPeriods', msg: '配列ではありません' });
  else {
    p.statusPeriods.forEach((sp, i) => {
      if (!isObj(sp)) { e.push({ path: `statusPeriods[${i}]`, msg: '不正です' }); return; }
      if (!isEnum(sp.status, ENUMS.patientStatus) || sp.status === 'active') e.push({ path: `statusPeriods[${i}].status`, msg: '状態は入院中・休止・終了のいずれかです' });
      checkPeriod(e, `statusPeriods[${i}]`, sp, { required: true });

    const valid = p.statusPeriods.filter(sp => isObj(sp) && isDateStr(sp.from) && (sp.to === null || isDateStr(sp.to)));
    for (let i = 0; i < valid.length; i++) for (let j = i + 1; j < valid.length; j++) {
      if (periodsOverlap(valid[i].from, valid[i].to, valid[j].from, valid[j].to)) e.push({ path: 'statusPeriods', msg: '状態期間が重なっています' });
    }
  }

  return e;
}

  if (!isEnum(s.role, ENUMS.staffRole)) e.push({ path: 'role', msg: '職種が不正です' });
  if (!isEnum(s.employment, ENUMS.employment)) e.push({ path: 'employment', msg: '雇用形態が不正です' });

  if (!Array.isArray(s.skills) || s.skills.some(x => !isStr(x))) e.push({ path: 'skills', msg: '文字列の配列が必要です' });
  if (!isStr(s.color) || !/^#[0-9a-fA-F]{6}$/.test(s.color)) e.push({ path: 'color', msg: '色は #rrggbb 形式です' });
  if (!Array.isArray(s.availability)) e.push({ path: 'availability', msg: '配列ではありません' });
  else s.availability.forEach((r, i) => checkTimeRange(e, `availability[${i}]`, r, { allowDowNull: false }));
  checkPeriod(e, 'employmentPeriod', s.employmentPeriod || null);
  if (!isBool(s.archived)) e.push({ path: 'archived', msg: '真偽値が必要です' });
  return e;
}

function validatePlan(pl) {
  const e = [];
  if (!isObj(pl)) return [{ path: '', msg: '計画がオブジェクトではありません' }];
  if (!isStr(pl.id) || !pl.id) e.push({ path: 'id', msg: 'IDは必須です' });
  if (!isStr(pl.patientId) || !pl.patientId) e.push({ path: 'patientId', msg: '利用者は必須です' });
  if (!isEnum(pl.serviceType, ENUMS.serviceType)) e.push({ path: 'serviceType', msg: 'サービス種別が不正です' });
  if (!isInt(pl.durationMin) || pl.durationMin <= 0 || pl.durationMin > 600) e.push({ path: 'durationMin', msg: '所要時間は1〜600分です' });
  if (!isInt(pl.dow) || pl.dow < 0 || pl.dow > 6) e.push({ path: 'dow', msg: '曜日は0〜6です' });
  if (!isTimeStr(pl.start) || pl.start === '24:00') e.push({ path: 'start', msg: '開始時刻が不正です' });
  else if (isInt(pl.durationMin) && toMin(pl.start) + pl.durationMin > 24 * 60) e.push({ path: 'durationMin', msg: '終了が翌日にまたがります' });
  checkIdArray(e, 'staffIds', pl.staffIds, MAX_STAFF_PER_VISIT);
  const r = pl.recurrence;
  if (!isObj(r) || !isEnum(r.kind, ENUMS.recurrence)) e.push({ path: 'recurrence.kind', msg: '繰り返し種別が不正です' });
  else {
    if (r.kind === 'biweekly' && !isDateStr(r.anchorDate)) e.push({ path: 'recurrence.anchorDate', msg: '隔週には基準日が必要です' });
    if (r.kind === 'weeksOfMonth' && !(Array.isArray(r.weeksOfMonth) && r.weeksOfMonth.length && r.weeksOfMonth.every(w => isInt(w) && w >= 1 && w <= 5)))
      e.push({ path: 'recurrence.weeksOfMonth', msg: '第N週は1〜5の配列です' });
    if (r.anchorDate !== null && r.anchorDate !== undefined && !isDateStr(r.anchorDate)) e.push({ path: 'recurrence.anchorDate', msg: '基準日の形式が不正です' });
  }
  checkPeriod(e, 'period', pl.period || null);
  if (!isBool(pl.archived)) e.push({ path: 'archived', msg: '真偽値が必要です' });
  return e;
}

function validateVisit(v) {
  const e = [];
  if (!isObj(v)) return [{ path: '', msg: '訪問がオブジェクトではありません' }];
  if (!isStr(v.id) || !v.id) e.push({ path: 'id', msg: 'IDは必須です' });
  if (!isDateStr(v.date)) e.push({ path: 'date', msg: '日付の形式が不正です' });
  if (!isTimeStr(v.start) || v.start === '24:00') e.push({ path: 'start', msg: '開始時刻が不正です' });
  if (!isTimeStr(v.end)) e.push({ path: 'end', msg: '終了時刻が不正です' });
  if (isTimeStr(v.start) && isTimeStr(v.end) && toMin(v.start) >= toMin(v.end)) e.push({ path: 'end', msg: '終了時刻は開始時刻より後にしてください' });
  if (!isStr(v.patientId) || !v.patientId) e.push({ path: 'patientId', msg: '利用者は必須です' });
  checkIdArray(e, 'staffIds', v.staffIds, MAX_STAFF_PER_VISIT);
  if (!isEnum(v.serviceType, ENUMS.serviceType)) e.push({ path: 'serviceType', msg: 'サービス種別が不正です' });
  if (v.planId !== null && (!isStr(v.planId) || !v.planId)) e.push({ path: 'planId', msg: '計画IDが不正です' });
  if (!isEnum(v.origin, ENUMS.visitOrigin)) e.push({ path: 'origin', msg: '作成元が不正です' });
  if (!isEnum(v.status, ENUMS.visitStatus)) e.push({ path: 'status', msg: 'ステータスが不正です' });
  if (v.status === 'cancelled' && !isEnum(v.cancelReason, ENUMS.cancelReason)) e.push({ path: 'cancelReason', msg: 'キャンセル理由は必須です' });
  if (v.status !== 'cancelled' && v.cancelReason !== null) e.push({ path: 'cancelReason', msg: 'キャンセル以外では理由を空にしてください' });
  if (v.status === 'transferred' && (!isStr(v.transferredToId) || !v.transferredToId)) e.push({ path: 'transferredToId', msg: '振替先は必須です' });
  if (v.status !== 'transferred' && v.transferredToId !== null) e.push({ path: 'transferredToId', msg: '振替元以外では振替先を空にしてください' });
  if (v.origin === 'transfer' && (!isStr(v.transferredFromId) || !v.transferredFromId)) e.push({ path: 'transferredFromId', msg: '振替元は必須です' });
  if (v.origin !== 'transfer' && v.transferredFromId !== null) e.push({ path: 'transferredFromId', msg: '振替以外では振替元を空にしてください' });
  if (v.origin === 'plan' && (!isStr(v.planId) || !v.planId)) e.push({ path: 'planId', msg: '計画から展開した訪問には計画IDが必要です' });
  if (!isObj(v.flags) || !isBool(v.flags.emergency) || !isBool(v.flags.training)) e.push({ path: 'flags', msg: 'フラグが不正です' });
  if (v.actual !== null) {
    if (!isObj(v.actual) || !isTimeStr(v.actual.start) || !isTimeStr(v.actual.end)) e.push({ path: 'actual', msg: '実績時刻の形式が不正です' });
    else if (toMin(v.actual.start) >= toMin(v.actual.end)) e.push({ path: 'actual', msg: '実績の終了時刻は開始時刻より後にしてください' });
  }
  if (v.status === 'done' && v.actual === null) e.push({ path: 'actual', msg: '実施済みには実績時刻が必要です' });
  return e;
}

function validateHoliday(h) {
  const e = [];
  if (!isObj(h)) return [{ path: '', msg: '休日がオブジェクトではありません' }];
  if (!isDateStr(h.date)) e.push({ path: 'date', msg: '日付の形式が不正です' });
  if (!isEnum(h.kind, ENUMS.holidayKind)) e.push({ path: 'kind', msg: '休日種別が不正です' });
  if (!isStr(h.name)) e.push({ path: 'name', msg: '名称は文字列です' });
  return e;
}

const SLOT_OPTIONS = [5, 10, 15, 30, 60];
function validateSettings(s) {
  const e = [];
  if (!isObj(s)) return [{ path: '', msg: '設定がありません' }];
  if (!Array.isArray(s.businessDows) || s.businessDows.some(d => !isInt(d) || d < 0 || d > 6)) e.push({ path: 'businessDows', msg: '営業曜日が不正です' });
  else if (!s.businessDows.length) e.push({ path: 'businessDows', msg: '営業曜日を1つ以上選んでください' });
  else if (new Set(s.businessDows).size !== s.businessDows.length) e.push({ path: 'businessDows', msg: '営業曜日が重複しています' });
  if (!isTimeStr(s.dayStart) || s.dayStart === '24:00') e.push({ path: 'dayStart', msg: '時間軸の開始が不正です' });
  if (!isTimeStr(s.dayEnd)) e.push({ path: 'dayEnd', msg: '時間軸の終了が不正です' });
  if (isTimeStr(s.dayStart) && isTimeStr(s.dayEnd) && toMin(s.dayStart) >= toMin(s.dayEnd)) e.push({ path: 'dayEnd', msg: '時間軸の終了は開始より後にしてください' });
  if (!SLOT_OPTIONS.includes(s.slotMin)) e.push({ path: 'slotMin', msg: '刻みは 5/10/15/30/60 分です' });
  if (!isInt(s.defaultDurationMin) || s.defaultDurationMin <= 0 || s.defaultDurationMin > 600) e.push({ path: 'defaultDurationMin', msg: '既定の所要時間は1〜600分です' });
  if (!isInt(s.weekStartDow) || s.weekStartDow < 0 || s.weekStartDow > 6) e.push({ path: 'weekStartDow', msg: '週の開始曜日は0〜6です' });
  if (!isInt(s.travelMin) || s.travelMin < 0 || s.travelMin > 180) e.push({ path: 'travelMin', msg: '移動時間の目安は0〜180分です' });
  if (!isBool(s.skipNationalHolidays)) e.push({ path: 'skipNationalHolidays', msg: '祝日の扱いは真偽値です' });
  return e;
}
function validateMeta(m) {
  const e = [];
  if (!isObj(m)) return [{ path: '', msg: 'メタ情報がありません' }];
  if (!isStr(m.stationName)) e.push({ path: 'stationName', msg: '事業所名は文字列です' });
  else if (m.stationName.length > 100) e.push({ path: 'stationName', msg: '事業所名は100文字以内です' });

function validateShift(sh) {
  const e = [];
  if (!isObj(sh)) return [{ path: '', msg: '勤務データがオブジェクトではありません' }];
  if (!isStr(sh.id) || !sh.id) e.push({ path: 'id', msg: 'IDは必須です' });
  if (!isStr(sh.staffId) || !sh.staffId) e.push({ path: 'staffId', msg: 'スタッフは必須です' });
  if (!isDateStr(sh.date)) e.push({ path: 'date', msg: '日付の形式が不正です' });
  if (!isEnum(sh.kind, ENUMS.shiftKind)) e.push({ path: 'kind', msg: '区分が不正です' });
  if (sh.kind === 'work') {
    if (!isTimeStr(sh.start) || sh.start === '24:00') e.push({ path: 'start', msg: '開始時刻が不正です' });
    if (!isTimeStr(sh.end)) e.push({ path: 'end', msg: '終了時刻が不正です' });
    if (isTimeStr(sh.start) && isTimeStr(sh.end) && toMin(sh.start) >= toMin(sh.end)) e.push({ path: 'end', msg: '終了時刻は開始時刻より後にしてください' });
  } else if (sh.start !== null || sh.end !== null) e.push({ path: 'start', msg: '勤務なしの行に時刻は入れません' });
  if (!isEnum(sh.source, ENUMS.shiftSource)) e.push({ path: 'source', msg: '取得元が不正です' });
  if (!isStr(sh.note)) e.push({ path: 'note', msg: '備考は文字列です' });
  return e;
}

/* DB 全体: 各エンティティ + ID一意性 + 参照整合性 */
function validateDb(db) {
  const e = [];
  if (!isObj(db)) return [{ path: '', msg: 'データがオブジェクトではありません' }];
  if (db.schemaVersion !== SCHEMA_VERSION) e.push({ path: 'schemaVersion', msg: `スキーマ版が ${SCHEMA_VERSION} ではありません` });
  for (const k of ['holidays', 'patients', 'staff', 'shifts', 'plans', 'visits', 'history']) {
    if (!Array.isArray(db[k])) e.push({ path: k, msg: '配列ではありません' });
  }
  validateSettings(db.settings).forEach(err => e.push({ path: err.path ? `settings.${err.path}` : 'settings', msg: err.msg }));
  validateMeta(db.meta).forEach(err => e.push({ path: err.path ? `meta.${err.path}` : 'meta', msg: err.msg }));
  if (e.length) return e;   // 骨格が壊れていれば以降は見ない

  const collect = (arr, fn, label) => {
    const ids = new Set();
    arr.forEach((x, i) => {
      fn(x).forEach(err => e.push({ path: `${label}[${i}].${err.path}`, msg: err.msg }));
      if (x && x.id) { if (ids.has(x.id)) e.push({ path: `${label}[${i}].id`, msg: `IDが重複しています（${x.id}）` }); ids.add(x.id); }
    });
    return ids;
  };
  const patientIds = collect(db.patients, validatePatient, 'patients');
  const staffIds = collect(db.staff, validateStaff, 'staff');
  const planIds = collect(db.plans, validatePlan, 'plans');
  const visitIds = collect(db.visits, validateVisit, 'visits');
  collect(db.shifts, validateShift, 'shifts');
  const hol = new Set();
  db.holidays.forEach((h, i) => {
    validateHoliday(h).forEach(err => e.push({ path: `holidays[${i}].${err.path}`, msg: err.msg }));
    const key = `${h && h.date}|${h && h.kind}`;
    if (hol.has(key)) e.push({ path: `holidays[${i}]`, msg: '同じ日付・種別の休日が重複しています' });
    hol.add(key);
  });

  // 参照整合性
  db.patients.forEach((p, i) => {
    const pref = p.preferences || {};
    (pref.preferredStaffIds || []).concat(pref.ngStaffIds || []).forEach(id => {
      if (!staffIds.has(id)) e.push({ path: `patients[${i}].preferences`, msg: `存在しないスタッフを参照しています（${id}）` });
    });
  });
  db.plans.forEach((pl, i) => {
    if (!patientIds.has(pl.patientId)) e.push({ path: `plans[${i}].patientId`, msg: `存在しない利用者を参照しています（${pl.patientId}）` });
    (pl.staffIds || []).forEach(id => { if (!staffIds.has(id)) e.push({ path: `plans[${i}].staffIds`, msg: `存在しないスタッフを参照しています（${id}）` }); });
  });
  db.shifts.forEach((sh, i) => { if (!staffIds.has(sh.staffId)) e.push({ path: `shifts[${i}].staffId`, msg: `存在しないスタッフを参照しています（${sh.staffId}）` }); });
  const visitById = new Map(db.visits.map(v => [v.id, v]));
  db.visits.forEach((v, i) => {
    if (!patientIds.has(v.patientId)) e.push({ path: `visits[${i}].patientId`, msg: `存在しない利用者を参照しています（${v.patientId}）` });
    (v.staffIds || []).forEach(id => { if (!staffIds.has(id)) e.push({ path: `visits[${i}].staffIds`, msg: `存在しないスタッフを参照しています（${id}）` }); });
    if (v.planId && !planIds.has(v.planId)) e.push({ path: `visits[${i}].planId`, msg: `存在しない計画を参照しています（${v.planId}）` });
    if (v.transferredToId) {
      const t = visitById.get(v.transferredToId);
      if (!t) e.push({ path: `visits[${i}].transferredToId`, msg: '振替先の訪問が存在しません' });
      else if (t.transferredFromId !== v.id) e.push({ path: `visits[${i}].transferredToId`, msg: '振替先から振替元への参照が一致しません' });
    }
    if (v.transferredFromId) {
      const f = visitById.get(v.transferredFromId);
      if (!f) e.push({ path: `visits[${i}].transferredFromId`, msg: '振替元の訪問が存在しません' });
      else if (f.transferredToId !== v.id) e.push({ path: `visits[${i}].transferredFromId`, msg: '振替元から振替先への参照が一致しません' });
    }
  });
  return e;
}

/* ------------------------------------------------------------------
 * 5. 派生値（保存しない。必要なときに計算する）
 * ------------------------------------------------------------------ */
function visitDurationMin(v) { return toMin(v.end) - toMin(v.start); }
function visitTimeBand(v) { return timeBandOf(v.start); }
function isLongVisit(v) { return visitDurationMin(v) > LONG_VISIT_MIN; }
function isTwoStaffVisit(v) { return v.staffIds.length === 2 && !v.flags.training; }
function isActiveVisit(v) { return v.status !== 'cancelled' && v.status !== 'transferred'; }
function patientDisplayName(p) { return p.displayName || p.name; }
function staffDisplayName(s) { return s.displayName || s.name; }

/* 利用者のある日の状態。契約外=ended、statusPeriods に該当があればその状態、なければ active */
function patientStatusOn(p, date) {
  const c = p.contract || {};
  if (!inPeriod(date, c.start, c.end)) return 'ended';
  const sp = (p.statusPeriods || []).find(x => inPeriod(date, x.from, x.to));
  return sp ? sp.status : 'active';
}
/* 有効な指示書があるか */
function hasValidInstruction(p, date) {
  return (p.instructions || []).some(ins => inPeriod(date, ins.from, ins.to));
}
function isHoliday(db, date) { return db.holidays.some(h => h.date === date); }
/* 計画展開で見送る日か。事業所休業日は常に、祝日は設定により見送る */
function isClosedDay(db, date) { return db.holidays.some(h => h.date === date && (h.kind === 'office' || db.settings.skipNationalHolidays)); }
function isBusinessDay(db, date) { return db.settings.businessDows.includes(dowOf(date)) && !isHoliday(db, date); }
/* スタッフがその日時に勤務可能か（標準枠ベース） */
/* スタッフのその日の勤務可能枠。日別データ（②勤務表）があればそれを優先し、なければ標準の勤務枠
 * 戻り値 { source: 'employment' | 'daily' | 'weekly', ranges: [{ start, end }] } */
function availabilityOn(db, s, date) {
  const ep = s.employmentPeriod || {};
  if (!inPeriod(date, ep.start, ep.end)) return { source: 'employment', ranges: [] };
  const daily = (db.shifts || []).filter(x => x.staffId === s.id && x.date === date);
  if (daily.length) return { source: 'daily', ranges: daily.filter(x => x.kind === 'work').map(x => ({ start: x.start, end: x.end })) };
  const dow = dowOf(date);
  return { source: 'weekly', ranges: s.availability.filter(a => a.dow === dow).map(a => ({ start: a.start, end: a.end })) };
}
function staffAvailable(db, s, date, start, end) {
  return availabilityOn(db, s, date).ranges.some(r => toMin(r.start) <= toMin(start) && toMin(end) <= toMin(r.end));
}

/* ------------------------------------------------------------------
 * 6. ルール（純粋関数。DB は変更しない）
 * ------------------------------------------------------------------ */
/* 同じスタッフが同日同時刻に別の訪問を持っていないか */
function findStaffConflicts(db, visit) {
  if (!visit.staffIds.length) return [];
  return db.visits.filter(o => o.id !== visit.id && o.date === visit.date && isActiveVisit(o)
    && o.staffIds.some(id => visit.staffIds.includes(id))
    && rangesOverlap(visit.start, visit.end, o.start, o.end));
}
/* 同じ利用者が同日同時刻に別の訪問を持っていないか */
function findPatientConflicts(db, visit) {
  return db.visits.filter(o => o.id !== visit.id && o.date === visit.date && isActiveVisit(o)
    && o.patientId === visit.patientId && rangesOverlap(visit.start, visit.end, o.start, o.end));
}
/* ハード制約をまとめて判定。戻り値 [{ code, msg }]。空=問題なし */
function checkVisitRules(db, visit) {
  const out = [];
  const p = db.patients.find(x => x.id === visit.patientId);
  if (!p) return [{ code: 'noPatient', msg: '利用者が見つかりません' }];
  const st = patientStatusOn(p, visit.date);
  if (st !== 'active') out.push({ code: 'patientStatus', msg: `利用者はこの日「${ENUMS.patientStatus[st]}」です` });
  if (!hasValidInstruction(p, visit.date)) out.push({ code: 'noInstruction', msg: 'この日に有効な指示書がありません' });
  const allowed = ROLE_SERVICE[visit.serviceType] || [];
  visit.staffIds.forEach(id => {
    const s = db.staff.find(x => x.id === id);
    if (!s) { out.push({ code: 'noStaff', msg: `スタッフが見つかりません（${id}）` }); return; }
    if (s.archived) out.push({ code: 'staffArchived', msg: `${staffDisplayName(s)} は無効化されています` });
    if (!allowed.includes(s.role) && !(visit.staffIds.length === 2 && visit.staffIds[0] !== id))
      out.push({ code: 'roleMismatch', msg: `${staffDisplayName(s)}（${ENUMS.staffRole[s.role]}）は「${ENUMS.serviceType[visit.serviceType]}」を担当できません` });
    const av = availabilityOn(db, s, visit.date);
    if (av.source === 'employment') out.push({ code: 'staffNotEmployed', msg: `${staffDisplayName(s)} はこの日は在籍期間外です` });
    else if (!av.ranges.some(r => toMin(r.start) <= toMin(visit.start) && toMin(visit.end) <= toMin(r.end))) {
      out.push(av.source === 'daily'
        ? { code: 'staffOff', msg: `${staffDisplayName(s)} は勤務表ではこの時間帯は勤務外です` }
        : { code: 'staffUnavailable', msg: `${staffDisplayName(s)} はこの時間帯に勤務予定がありません（標準の勤務枠）` });
    }
    if ((p.preferences.ngStaffIds || []).includes(id)) out.push({ code: 'ngStaff', msg: `${staffDisplayName(s)} はこの利用者のNG担当です` });
    if (p.requirements.allowedRoles.length && !p.requirements.allowedRoles.includes(s.role))
      out.push({ code: 'roleNotAllowed', msg: `${staffDisplayName(s)} の職種はこの利用者の対応可能職種に含まれていません` });
  });
  if (p.requirements.needsTwoStaff && visit.staffIds.length < 2) out.push({ code: 'needsTwoStaff', msg: 'この利用者は2名訪問が必要です' });
  if (findStaffConflicts(db, visit).length) out.push({ code: 'staffOverlap', msg: '担当スタッフの時間が別の訪問と重なっています' });
  if (findPatientConflicts(db, visit).length) out.push({ code: 'patientOverlap', msg: '利用者の時間が別の訪問と重なっています' });
  const wl = medicalWeeklyLimit(db, p, visit);
  if (wl) out.push(wl);
  findTightTravel(db, visit).forEach(t => out.push({ code: 'travelTight', msg: `${staffDisplayName(t.staff)}: ${t.before ? '前' : '後'}の訪問（${t.other.start}〜${t.other.end}）との間隔が ${t.gapMin} 分です（目安 ${db.settings.travelMin} 分）` }));
  return out;
}

/* 制約コードの重さ。block は保存不可、warn は保存できるが注意表示 */
const RULE_LEVEL = {
  noPatient: 'block', noStaff: 'block', staffArchived: 'block', staffNotEmployed: 'block', patientStatus: 'block',
  roleMismatch: 'block', ngStaff: 'block', roleNotAllowed: 'block', needsTwoStaff: 'block',
  staffOverlap: 'block', patientOverlap: 'block', weeklyLimit: 'block', staffOff: 'block',
  noInstruction: 'warn', staffUnavailable: 'warn', travelTight: 'warn', planCount: 'warn', patientArchived: 'warn', unassigned: 'warn'
};
const MEDICAL_WEEKLY_LIMIT = 3;   // 医療保険の訪問看護は原則週3日まで

/* 暦週（日曜〜土曜）。週3日制限と計画回数の週集計に使う（画面の週開始曜日とは独立） */
function calendarWeekOf(date) { const start = addDays(date, -dowOf(date)); return { start, end: addDays(start, 6) }; }
/* 週3日制限の対象外か: 医療保険以外、別表7・8、特別指示書（精神科含む）の期間中 */
function medicalLimitExempt(p, date) {
  return p.insurance !== 'iryo' || !!(p.specialFlags && (p.specialFlags.betsu7 || p.specialFlags.betsu8))
    || (p.instructions || []).some(i => (i.type === 'special' || i.type === 'psychiatricSpecial') && inPeriod(date, i.from, i.to));
}
function medicalWeeklyLimit(db, p, visit) {
  if (!isActiveVisit(visit) || medicalLimitExempt(p, visit.date)) return null;
  const { start, end } = calendarWeekOf(visit.date);
  const days = new Set(db.visits.filter(v => v.id !== visit.id && v.patientId === p.id && isActiveVisit(v) && v.date >= start && v.date <= end).map(v => v.date));
  days.add(visit.date);
  if (days.size <= MEDICAL_WEEKLY_LIMIT) return null;
  return { code: 'weeklyLimit', msg: `医療保険の訪問は週${MEDICAL_WEEKLY_LIMIT}日までです（この週は ${days.size} 日目。別表7・8と特別指示書の期間は対象外）` };
}
/* 同じ担当の前後の訪問との間隔が設定の目安を下回るものを返す。同じ利用者への連続訪問は移動がないので除く */
function findTightTravel(db, visit) {
  const out = [];
  const limit = db.settings.travelMin || 0;
  if (!limit || !isActiveVisit(visit)) return out;
  for (const id of visit.staffIds) {
    const s = db.staff.find(x => x.id === id);
    if (!s) continue;
    db.visits.filter(o => o.id !== visit.id && o.date === visit.date && isActiveVisit(o) && o.patientId !== visit.patientId && o.staffIds.includes(id)).forEach(o => {
      let gapMin = null, before = false;
      if (toMin(o.end) <= toMin(visit.start)) { gapMin = toMin(visit.start) - toMin(o.end); before = true; }
      else if (toMin(visit.end) <= toMin(o.start)) gapMin = toMin(o.start) - toMin(visit.end);
      if (gapMin !== null && gapMin < limit) out.push({ staff: s, other: o, gapMin, before });
    });
  }
  return out;
}

/* 月単位のチェック。訪問ごとの制約に加えて、週3日制限と計画回数を利用者ごとに集計する
 * 戻り値 [{ level, code, msg, date, visitIds, patientId }]（block → warn、コード、日付の順） */
function checkMonth(db, year, month) {
  const from = `${year}-${pad2(month)}-01`, to = `${year}-${pad2(month)}-${pad2(daysInMonth(year, month))}`;
  const issues = [];
  const push = (code, msg, extra) => issues.push(Object.assign({ level: RULE_LEVEL[code] || 'warn', code, msg }, extra));
  const visits = db.visits.filter(v => v.date >= from && v.date <= to && isActiveVisit(v));
  for (const v of visits) {
    checkVisitRules(db, v).filter(r => r.code !== 'weeklyLimit').forEach(r => push(r.code, r.msg, { date: v.date, visitIds: [v.id], patientId: v.patientId }));
    if (!v.staffIds.length) push('unassigned', '担当が未割当です', { date: v.date, visitIds: [v.id], patientId: v.patientId });
  }
  const md = d => d.slice(5).replace('-', '/');
  for (const p of db.patients) {
    const pv = visits.filter(v => v.patientId === p.id);
    if (!pv.length) continue;
    const name = patientDisplayName(p);
    if (p.insurance === 'iryo') {
      for (const ws of new Set(pv.map(v => calendarWeekOf(v.date).start))) {
        const we = addDays(ws, 6);
        const weekVisits = db.visits.filter(v => v.patientId === p.id && isActiveVisit(v) && v.date >= ws && v.date <= we);
        const days = [...new Set(weekVisits.map(v => v.date))].sort();
        if (days.length > MEDICAL_WEEKLY_LIMIT && !days.every(d => medicalLimitExempt(p, d)))
          push('weeklyLimit', `${name}: ${md(ws)}〜の週に ${days.length} 日の訪問があります（医療保険は週${MEDICAL_WEEKLY_LIMIT}日まで）`, { date: ws, visitIds: weekVisits.map(v => v.id), patientId: p.id });
      }
    }
    const pl = p.plannedVisits || {};
    if (isInt(pl.perMonth) && pv.length !== pl.perMonth)
      push('planCount', `${name}: 計画は月 ${pl.perMonth} 回ですが、この月は ${pv.length} 回です`, { date: from, visitIds: pv.map(v => v.id), patientId: p.id });
    if (isInt(pl.perWeek)) {
      const byWeek = new Map();
      pv.forEach(v => { const ws = calendarWeekOf(v.date).start; if (!byWeek.has(ws)) byWeek.set(ws, []); byWeek.get(ws).push(v); });
      for (const [ws, list] of byWeek) {
        if (list.length > pl.perWeek) push('planCount', `${name}: ${md(ws)}〜の週は計画の週 ${pl.perWeek} 回を超えています（${list.length} 回）`, { date: ws, visitIds: list.map(v => v.id), patientId: p.id });
      }
    }
  }
  const rank = l => (l === 'block' ? 0 : 1);
  issues.sort((a, b) => (rank(a.level) - rank(b.level)) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return issues;
}

/* 日本の祝日（2022〜2099年）。振替休日と国民の休日を含む。戻り値 [{ date, name }] */
function nthMonday(y, m, n) {
  const first = `${y}-${pad2(m)}-01`;
  const day = 1 + ((1 - dowOf(first) + 7) % 7) + 7 * (n - 1);
  return `${y}-${pad2(m)}-${pad2(day)}`;
}
function japaneseHolidays(year) {
  if (!isInt(year) || year < 2022 || year > 2099) throw new Error('祝日の自動計算は2022〜2099年に対応しています');
  const d = (m, day) => `${year}-${pad2(m)}-${pad2(day)}`;
  const yy = year - 1980;
  const base = [
    [d(1, 1), '元日'], [nthMonday(year, 1, 2), '成人の日'], [d(2, 11), '建国記念の日'], [d(2, 23), '天皇誕生日'],
    [d(3, Math.floor(20.8431 + 0.242194 * yy - Math.floor(yy / 4))), '春分の日'],
    [d(4, 29), '昭和の日'], [d(5, 3), '憲法記念日'], [d(5, 4), 'みどりの日'], [d(5, 5), 'こどもの日'],
    [nthMonday(year, 7, 3), '海の日'], [d(8, 11), '山の日'], [nthMonday(year, 9, 3), '敬老の日'],
    [d(9, Math.floor(23.2488 + 0.242194 * yy - Math.floor(yy / 4))), '秋分の日'],
    [nthMonday(year, 10, 2), 'スポーツの日'], [d(11, 3), '文化の日'], [d(11, 23), '勤労感謝の日']
  ];
  const map = new Map(base), baseSet = new Set(base.map(b => b[0]));
  for (const [date] of base) {            // 振替休日: 日曜の祝日は、その後の最初の祝日でない日
    if (dowOf(date) !== 0) continue;
    let n = addDays(date, 1);
    while (map.has(n)) n = addDays(n, 1);
    map.set(n, '振替休日');
  }
  for (const [date] of base) {            // 国民の休日: 前日と翌日が祝日の平日
    const mid = addDays(date, 1);
    if (baseSet.has(addDays(date, 2)) && !map.has(mid) && dowOf(mid) !== 0) map.set(mid, '国民の休日');
  }
  return Array.from(map, ([date, name]) => ({ date, name })).sort((a, b) => (a.date < b.date ? -1 : 1));
}

/* 訪問計画の制約をまとめて判定。戻り値 [{ code, msg }]。日付に依存する判定（入院・指示書・重複）は展開後の訪問側で行う */
function checkPlanRules(db, plan) {
  const out = [];
  const p = db.patients.find(x => x.id === plan.patientId);
  if (!p) return [{ code: 'noPatient', msg: '利用者が見つかりません' }];
  if (p.archived) out.push({ code: 'patientArchived', msg: '利用者が無効化されているため展開されません' });
  const allowed = ROLE_SERVICE[plan.serviceType] || [];
  const end = isTimeStr(plan.start) && isInt(plan.durationMin) ? fromMin(Math.min(24 * 60, toMin(plan.start) + plan.durationMin)) : null;
  (plan.staffIds || []).forEach((id, i) => {
    const s = db.staff.find(x => x.id === id);
    if (!s) { out.push({ code: 'noStaff', msg: `スタッフが見つかりません（${id}）` }); return; }
    if (s.archived) out.push({ code: 'staffArchived', msg: `${staffDisplayName(s)} は無効化されています` });
    if (i === 0 && !allowed.includes(s.role))
      out.push({ code: 'roleMismatch', msg: `${staffDisplayName(s)}（${ENUMS.staffRole[s.role]}）は「${ENUMS.serviceType[plan.serviceType]}」を担当できません` });
    if ((p.preferences.ngStaffIds || []).includes(id)) out.push({ code: 'ngStaff', msg: `${staffDisplayName(s)} はこの利用者のNG担当です` });
    if (p.requirements.allowedRoles.length && !p.requirements.allowedRoles.includes(s.role))
      out.push({ code: 'roleNotAllowed', msg: `${staffDisplayName(s)} の職種はこの利用者の対応可能職種に含まれていません` });
    if (end && !s.availability.some(a => a.dow === plan.dow && toMin(a.start) <= toMin(plan.start) && toMin(end) <= toMin(a.end)))
      out.push({ code: 'staffUnavailable', msg: `${staffDisplayName(s)} は${DOW_JA[plan.dow]}曜のこの時間帯に勤務予定がありません` });
  });
  if (p.requirements.needsTwoStaff && (plan.staffIds || []).length < 2) out.push({ code: 'needsTwoStaff', msg: 'この利用者は2名訪問が必要です' });
  return out;
}

/* ステータス遷移。許可されない遷移は例外を投げる。戻り値は更新後の新オブジェクト */
function changeVisitStatus(visit, next, extra = {}) {
  const allowed = STATUS_TRANSITIONS[visit.status] || [];
  if (!allowed.includes(next)) throw new Error(`「${ENUMS.visitStatus[visit.status]}」から「${ENUMS.visitStatus[next]}」へは変更できません`);
  const v = clone(visit);
  v.status = next;
  v.cancelReason = next === 'cancelled' ? (extra.cancelReason || 'other') : null;
  v.transferredToId = next === 'transferred' ? (extra.transferredToId || null) : null;
  if (next === 'done') v.actual = extra.actual || { start: v.start, end: v.end };
  if (next === 'planned' || next === 'confirmed') v.actual = null;
  v.updatedAt = nowIso();
  return v;
}

/* 計画を指定月に展開して、未保存の Visit 配列と、見送った日の一覧を返す */
function expandPlan(db, plan, year, month) {
  const patient = db.patients.find(p => p.id === plan.patientId);
  const visits = [], skipped = [];
  if (!patient) return { visits, skipped: [{ date: null, reason: 'noPatient' }] };
  if (patient.archived) return { visits, skipped: [{ date: null, reason: 'patientArchived' }] };
  const r = plan.recurrence;
  for (const date of monthDates(year, month)) {
    if (dowOf(date) !== plan.dow) continue;
    if (!inPeriod(date, plan.period.from, plan.period.to)) continue;
    if (r.kind === 'biweekly') {
      // 基準日以降で最初に計画の曜日になる日を起点にし、そこから2週おきに該当させる
      let origin = r.anchorDate;
      while (dowOf(origin) !== plan.dow) origin = addDays(origin, 1);
      const weeks = diffDays(origin, date) / 7;
      if (((weeks % 2) + 2) % 2 !== 0) continue;
    }
    if (r.kind === 'weeksOfMonth' && !r.weeksOfMonth.includes(weekOfMonth(date))) continue;
    const st = patientStatusOn(patient, date);
    if (st !== 'active') { skipped.push({ date, reason: 'patientStatus', detail: st }); continue; }
    if (isClosedDay(db, date)) { skipped.push({ date, reason: 'holiday' }); continue; }
    if (db.visits.some(v => v.planId === plan.id && v.date === date)) { skipped.push({ date, reason: 'exists' }); continue; }
    visits.push(createVisit({
      date, start: plan.start, end: addMin(plan.start, plan.durationMin),
      patientId: plan.patientId, staffIds: plan.staffIds.filter(id => { const s = db.staff.find(x => x.id === id); return s && !s.archived; }),
      serviceType: plan.serviceType, planId: plan.id, origin: 'plan'
    }));
  }
  return { visits, skipped };
}

/* ------------------------------------------------------------------
 * 7. リポジトリ（DB 配列への追加・更新・無効化。履歴も残す）
 * ------------------------------------------------------------------ */
function pushHistory(db, entry) {
  db.history.push(Object.assign({ at: nowIso() }, entry));
  if (db.history.length > HISTORY_MAX) db.history.splice(0, db.history.length - HISTORY_MAX);
}
function makeRepo(collection, validator, label) {
  return {
    get(db, id) { return db[collection].find(x => x.id === id) || null; },
    list(db, { includeArchived = false } = {}) {
      return db[collection].filter(x => includeArchived || !x.archived);
    },
    add(db, obj) {
      const errs = validator(obj);
      if (errs.length) throw new ValidationError(`${label}の内容に誤りがあります`, errs);
      if (db[collection].some(x => x.id === obj.id)) throw new ValidationError(`${label}のIDが重複しています`, [{ path: 'id', msg: obj.id }]);
      db[collection].push(obj);
      pushHistory(db, { action: 'add', entity: collection, entityId: obj.id, after: clone(obj) });
      return obj;
    },
    update(db, id, patch) {
      const i = db[collection].findIndex(x => x.id === id);
      if (i < 0) throw new ValidationError(`${label}が見つかりません`, [{ path: 'id', msg: id }]);
      const before = db[collection][i];
      const after = Object.assign(clone(before), patch, { id, updatedAt: nowIso() });
      const errs = validator(after);
      if (errs.length) throw new ValidationError(`${label}の内容に誤りがあります`, errs);
      db[collection][i] = after;
      pushHistory(db, { action: 'update', entity: collection, entityId: id, before: clone(before), after: clone(after) });
      return after;
    },
    /* 物理削除はしない。archived=true にして画面から隠す */
    archive(db, id) { return this.update(db, id, { archived: true }); },
    restore(db, id) { return this.update(db, id, { archived: false }); }
  };
}
class ValidationError extends Error {
  constructor(message, errors) { super(message); this.name = 'ValidationError'; this.errors = errors || []; }
}
const patients = makeRepo('patients', validatePatient, '利用者');
const staff = makeRepo('staff', validateStaff, 'スタッフ');
const plans = makeRepo('plans', validatePlan, '訪問計画');
const visits = Object.assign(makeRepo('visits', validateVisit, '訪問'), {
  /* 訪問は物理削除できる。ただし振替で参照されているものは不可 */
  remove(db, id) {
    const i = db.visits.findIndex(x => x.id === id);
    if (i < 0) throw new ValidationError('訪問が見つかりません', [{ path: 'id', msg: id }]);
    if (db.visits.some(v => v.transferredFromId === id || v.transferredToId === id))
      throw new ValidationError('振替で参照されている訪問は削除できません', [{ path: 'id', msg: id }]);
    const [removed] = db.visits.splice(i, 1);
    pushHistory(db, { action: 'remove', entity: 'visits', entityId: id, before: clone(removed) });
    return removed;
  },
  /* 振替: 元を transferred にし、新しい日時の訪問を追加する。双方向参照を同時に作る */
  transfer(db, id, { date, start, end, staffIds }) {
    const src = this.get(db, id);
    if (!src) throw new ValidationError('訪問が見つかりません', [{ path: 'id', msg: id }]);
    const dst = createVisit({
      date, start, end: end || addMin(start, visitDurationMin(src)),
      patientId: src.patientId, staffIds: staffIds || src.staffIds.slice(),
      serviceType: src.serviceType, planId: src.planId, origin: 'transfer', transferredFromId: src.id
    });
    const errs = validateVisit(dst);
    if (errs.length) throw new ValidationError('振替先の内容に誤りがあります', errs);
    const updated = changeVisitStatus(src, 'transferred', { transferredToId: dst.id });
    db.visits[db.visits.findIndex(x => x.id === id)] = updated;
    db.visits.push(dst);
    pushHistory(db, { action: 'transfer', entity: 'visits', entityId: id, before: clone(src), after: clone(dst) });
    return dst;
  },
  setStatus(db, id, next, extra) {
    const i = db.visits.findIndex(x => x.id === id);
    if (i < 0) throw new ValidationError('訪問が見つかりません', [{ path: 'id', msg: id }]);
    const before = db.visits[i];
    const after = changeVisitStatus(before, next, extra);
    const errs = validateVisit(after);
    if (errs.length) throw new ValidationError('訪問の内容に誤りがあります', errs);
    db.visits[i] = after;
    pushHistory(db, { action: 'status', entity: 'visits', entityId: id, before: clone(before), after: clone(after) });
    return after;
  }
});
/* 有効な全計画を指定月に展開して DB に追加する。{ added, skipped } を返す（skipped には planId 付き） */
function expandMonth(db, year, month) {
  const added = [], skipped = [];
  for (const plan of db.plans) {
    if (plan.archived) continue;
    const r = expandPlan(db, plan, year, month);
    r.visits.forEach(v => { visits.add(db, v); added.push(v); });
    r.skipped.forEach(s => skipped.push(Object.assign({ planId: plan.id }, s)));
  }
  return { added, skipped };
}
const holidays = {
  add(db, h) {
    const errs = validateHoliday(h);
    if (errs.length) throw new ValidationError('休日の内容に誤りがあります', errs);
    if (db.holidays.some(x => x.date === h.date && x.kind === h.kind)) throw new ValidationError('同じ休日が登録済みです', [{ path: 'date', msg: h.date }]);
    db.holidays.push(h);
    db.holidays.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    pushHistory(db, { action: 'add', entity: 'holidays', entityId: `${h.date}|${h.kind}`, after: clone(h) });
    return h;
  },
  remove(db, date, kind) {
    const i = db.holidays.findIndex(x => x.date === date && x.kind === kind);
    if (i < 0) return null;
    const [removed] = db.holidays.splice(i, 1);
    pushHistory(db, { action: 'remove', entity: 'holidays', entityId: `${date}|${kind}`, before: clone(removed) });
    return removed;
  }
};

/* 勤務データ（②勤務表の日別データ）。取り込み単位で置き換える */
const byShiftOrder = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.staffId < b.staffId ? -1 : a.staffId > b.staffId ? 1 : (a.start || '') < (b.start || '') ? -1 : (a.start || '') > (b.start || '') ? 1 : 0);
const shiftsRepo = {
  list(db, { staffId = null, from = null, to = null } = {}) {
    return db.shifts.filter(x => (!staffId || x.staffId === staffId) && inPeriod(x.date, from, to)).sort(byShiftOrder);
  },
  /* 同じスタッフ・日付の既存データを消してから追加する。全件の検証に通らなければ何も変えない */
  replaceFor(db, list) {
    list.forEach((sh, i) => {
      const errs = validateShift(sh);
      if (errs.length) throw new ValidationError(`勤務データ ${i + 1} 件目に誤りがあります`, errs);
      if (!db.staff.some(s => s.id === sh.staffId)) throw new ValidationError('存在しないスタッフです', [{ path: `shifts[${i}].staffId`, msg: sh.staffId }]);
    });
    const keys = new Set(list.map(sh => `${sh.staffId}|${sh.date}`));
    const kept = db.shifts.filter(sh => !keys.has(`${sh.staffId}|${sh.date}`));
    const removed = db.shifts.length - kept.length;
    db.shifts = kept.concat(list).sort(byShiftOrder);
    pushHistory(db, { action: 'import', entity: 'shifts', entityId: 'shifts', before: { removed }, after: { added: list.length } });
    return { added: list.length, removed };
  },
  clear(db, { from = null, to = null } = {}) {
    const before = db.shifts.length;
    db.shifts = db.shifts.filter(sh => !inPeriod(sh.date, from, to));
    const removed = before - db.shifts.length;
    if (removed) pushHistory(db, { action: 'remove', entity: 'shifts', entityId: 'shifts', before: { removed } });
    return removed;
  }
};

/* ---- 取り込み（②勤務表の日別データ） ---- */
function parseCsv(text) {
  const rows = [], len = text.length;
  let row = [], cell = '', q = false, i = 0;
  while (i < len) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i += 2; continue; } q = false; i++; continue; }
      cell += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(cell); cell = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += c; i++;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function normalizeDate(v) {
  const s = String(v ?? '').trim().replace(/[年月]/g, '-').replace(/日/g, '').replace(/[./]/g, '-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  const d = `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
  return isDateStr(d) ? d : null;
}
function normalizeTime(v) {
  const s = String(v ?? '').trim();
  if (!s) return null;
  const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if (!m) return null;
  const t = `${pad2(Number(m[1]))}:${m[2]}`;
  return isTimeStr(t) ? t : null;
}
const SHIFT_HEADERS = {
  date: ['日付', 'date', '年月日'], staff: ['スタッフ', '氏名', '名前', 'staff', 'name', 'staffname'], staffId: ['staffid', 'スタッフid', 'id'],
  start: ['開始', 'start', '出勤', '開始時刻'], end: ['終了', 'end', '退勤', '終了時刻'], kind: ['区分', 'kind', '種別', 'シフト']
};
const SHIFT_KINDS = { work: ['work', '勤務', '出勤', '日勤', '早番', '遅番', '半日', '○'], off: ['off', '休', '休み', '公休', '有給', '休日', '欠勤', '×', '－', '-'] };

  return 'unknown';
}
/* CSV または JSON の文章を勤務データに変換する。{ shifts, errors: [{ line, msg }], unmatched: [名前] } */
function parseShifts(text, db) {
  const errors = [], shifts = [], unmatched = new Set();
  const t = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!t) return { shifts, errors: [{ line: 0, msg: '内容が空です' }], unmatched: [] };
  let records = [];
  if (t[0] === '{' || t[0] === '[') {
    let j;
    try { j = JSON.parse(t); } catch (err) { return { shifts, errors: [{ line: 0, msg: 'JSONとして読み取れません: ' + err.message }], unmatched: [] }; }
    const arr = Array.isArray(j) ? j : (isObj(j) && Array.isArray(j.shifts) ? j.shifts : null);
    if (!arr) return { shifts, errors: [{ line: 0, msg: 'JSONは配列か { "shifts": [...] } の形にしてください' }], unmatched: [] };
    records = arr.map((o, i) => ({ line: i + 1, date: o.date ?? o['日付'], staff: o.staff ?? o.staffName ?? o.name ?? o['スタッフ'] ?? o['氏名'], staffId: o.staffId, start: o.start ?? o['開始'], end: o.end ?? o['終了'], kind: o.kind ?? o['区分'] }));
  } else {
    const rows = parseCsv(t).filter(r => r.some(c => String(c).trim() !== ''));
    if (rows.length < 2) return { shifts, errors: [{ line: 0, msg: '見出し行とデータ行が必要です' }], unmatched: [] };
    const header = rows[0].map(h => String(h).trim().toLowerCase());
    const col = key => header.findIndex(h => SHIFT_HEADERS[key].includes(h));
    const ix = { date: col('date'), staff: col('staff'), staffId: col('staffId'), start: col('start'), end: col('end'), kind: col('kind') };
    if (ix.date < 0 || (ix.staff < 0 && ix.staffId < 0)) return { shifts, errors: [{ line: 1, msg: '見出しに「日付」と「スタッフ」が必要です' }], unmatched: [] };
    const at = (r, i) => (i >= 0 && i < r.length ? r[i] : '');
    records = rows.slice(1).map((r, i) => ({ line: i + 2, date: at(r, ix.date), staff: at(r, ix.staff), staffId: at(r, ix.staffId), start: at(r, ix.start), end: at(r, ix.end), kind: at(r, ix.kind) }));
  }
  const active = db.staff.filter(s => !s.archived);
  const findStaff = (id, name) => {
    if (id) { const s = db.staff.find(x => x.id === String(id).trim()); if (s) return s; }
    const n = String(name ?? '').trim();
    if (!n) return null;
    const hits = active.filter(s => s.name.trim() === n || (s.displayName && s.displayName.trim() === n));
    return hits.length === 1 ? hits[0] : null;
  };
  for (const rec of records) {
    const date = normalizeDate(rec.date);
    if (!date) { errors.push({ line: rec.line, msg: `日付が不正です（${rec.date ?? ''}）` }); continue; }
    const s = findStaff(rec.staffId, rec.staff);
    if (!s) { const label = String(rec.staff || rec.staffId || '').trim(); unmatched.add(label); errors.push({ line: rec.line, msg: `スタッフが見つかりません（${label}）` }); continue; }
    const kind = kindOf(rec.kind), start = normalizeTime(rec.start), end = normalizeTime(rec.end);
    if (kind === 'unknown') { errors.push({ line: rec.line, msg: `区分が不明です（${rec.kind}）` }); continue; }
    const k = kind || (start && end ? 'work' : 'off');
    if (k === 'work') {
      if (!start || !end || toMin(start) >= toMin(end)) { errors.push({ line: rec.line, msg: '勤務の開始・終了時刻が不正です' }); continue; }
      shifts.push(createShift({ staffId: s.id, date, start, end, kind: 'work', source: 'import' }));
    } else shifts.push(createShift({ staffId: s.id, date, start: null, end: null, kind: 'off', source: 'import' }));
  }
  return { shifts, errors, unmatched: [...unmatched] };
}

/* 設定とメタ情報。部分更新を検証してから反映し、履歴に残す */
const settingsRepo = {
  update(db, patch) {
    const before = db.settings;
    const after = Object.assign({}, before, patch);
    const errs = validateSettings(after);
    if (errs.length) throw new ValidationError('設定の内容に誤りがあります', errs);
    db.settings = after;
    pushHistory(db, { action: 'update', entity: 'settings', entityId: 'settings', before: clone(before), after: clone(after) });
    return after;
  }
};
const metaRepo = {
  /* 変更できるのは事業所名だけ。作成日時・更新日時は保存処理が管理する */
  update(db, patch) {
    const before = db.meta;
    const after = Object.assign({}, before, { stationName: patch.stationName === undefined ? before.stationName : patch.stationName });
    const errs = validateMeta(after);
    if (errs.length) throw new ValidationError('事業所情報の内容に誤りがあります', errs);
    db.meta = after;
    pushHistory(db, { action: 'update', entity: 'meta', entityId: 'meta', before: { stationName: before.stationName }, after: { stationName: after.stationName } });
    return after;
  }
};

/* ------------------------------------------------------------------
 * 8. 保存・読込・移行
 * ------------------------------------------------------------------ */
/* 将来 schemaVersion を上げたら、ここに (旧→新) の変換を追加する */
const MIGRATIONS = {
  /* v2: 利用者に計画回数、勤務データ（shifts）、設定に移動時間の目安を追加 */
  2: db => {
    (Array.isArray(db.patients) ? db.patients : []).forEach(p => { if (isObj(p) && !isObj(p.plannedVisits)) p.plannedVisits = { perWeek: null, perMonth: null }; });
    if (!Array.isArray(db.shifts)) db.shifts = [];
    db.schemaVersion = 2;
    return db;
  }
};
function migrate(raw) {
  if (!isObj(raw)) throw new Error('データの形式が不正です');
  let db = raw;
  let v = Number.isInteger(db.schemaVersion) ? db.schemaVersion : 1;
  if (v > SCHEMA_VERSION) throw new Error(`このデータは新しい版（v${v}）で保存されています。アプリを更新してください`);
  while (v < SCHEMA_VERSION) {
    const step = MIGRATIONS[v + 1];
    if (!step) throw new Error(`v${v} から v${v + 1} への移行手順がありません`);
    db = step(db);
    v = db.schemaVersion;
  }
  // 欠けている配列や設定は既定値で補う（旧データ・手編集データへの耐性）
  const empty = createEmptyDb();
  for (const k of ['holidays', 'patients', 'staff', 'shifts', 'plans', 'visits', 'history']) if (!Array.isArray(db[k])) db[k] = [];
  db.settings = Object.assign({}, empty.settings, isObj(db.settings) ? db.settings : {});
  db.meta = Object.assign({}, empty.meta, isObj(db.meta) ? db.meta : {});
  db.schemaVersion = SCHEMA_VERSION;
  return db;
}

function serialize(db) { return JSON.stringify(db); }
function exportJson(db) { return JSON.stringify(db, null, 2); }

/* テキスト → DB。{ db, errors } を返す。errors が空でなければ保存前に修正が必要 */
function parseDb(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (err) { throw new Error('JSONとして読み取れません: ' + err.message); }
  const db = migrate(raw);
  return { db, errors: validateDb(db) };
}

/* storage は localStorage 互換（getItem/setItem/removeItem）。テストでは差し替える */
function load(storage) {
  const text = storage.getItem(STORAGE_KEY);
  if (text === null) return { db: createEmptyDb(), errors: [], fresh: true };
  try {
    const { db, errors } = parseDb(text);
    return { db, errors, fresh: false };
  } catch (err) {
    // 壊れたデータは消さずに別キーへ退避し、空のDBで起動する
    let backupKey = `${STORAGE_KEY}_broken_${Date.now()}`;
    try { storage.setItem(backupKey, text); } catch (_) { backupKey = null; }
    return { db: createEmptyDb(), errors: [{ path: '', msg: err.message }], fresh: true, backupKey };
  }
}
function save(db, storage) {
  const errors = validateDb(db);
  if (errors.length) return { ok: false, errors };
  db.meta.updatedAt = nowIso();
  const text = serialize(db);
  const bytes = new TextEncoder().encode(text).length;
  try { storage.setItem(STORAGE_KEY, text); }
  catch (err) { return { ok: false, errors: [{ path: '', msg: '保存できませんでした（容量超過の可能性）: ' + err.message }], bytes }; }
  return { ok: true, errors: [], bytes, warn: bytes > STORAGE_WARN_BYTES ? '保存容量が上限に近づいています。古い月の訪問を書き出して整理してください' : null };
}
function clear(storage) { storage.removeItem(STORAGE_KEY); }

/* ------------------------------------------------------------------
 * 9. サンプルデータ（すべて架空。実名・実番号は入れない）
 * ------------------------------------------------------------------ */
function buildSampleDb(year, month) {
  const db = createEmptyDb();
  db.meta.stationName = 'サンプル訪問看護ステーション';
  const first = `${year}-${pad2(month)}-01`;

  const nextYearEnd = `${year + 1}-${pad2(month)}-${pad2(daysInMonth(year + 1, month))}`;

  const s1 = staff.add(db, createStaff({ id: 's_sample1', name: '看護 太郎', displayName: '看護(太)', role: 'NS', color: '#2563eb' }));
  const s2 = staff.add(db, createStaff({ id: 's_sample2', name: '看護 花子', displayName: '看護(花)', role: 'NS', employment: 'parttime', color: '#16a34a',
    availability: [{ dow: 1, start: '09:00', end: '15:00' }, { dow: 3, start: '09:00', end: '15:00' }, { dow: 4, start: '09:00', end: '15:00' }, { dow: 5, start: '09:00', end: '15:00' }] }));
  const s3 = staff.add(db, createStaff({ id: 's_sample3', name: '理学 一郎', displayName: '理学(一)', role: 'PT', color: '#d97706' }));

  const p1 = patients.add(db, createPatient({ id: 'p_sample1', name: '利用者A', displayName: 'A様', insurance: 'kaigo', careLevel: 'yokaigo2',
    contract: { start: lastYear, end: null },
    instructions: [createInstruction({ id: 'ins_sample1', type: 'normal', from: first, to: addDays(first, 180) })],
    preferences: { preferredTimeRanges: [{ dow: null, start: '09:00', end: '12:00' }], ngTimeRanges: [], preferredStaffIds: [s1.id], ngStaffIds: [], note: '' } }));
  const p2 = patients.add(db, createPatient({ id: 'p_sample2', name: '利用者B', displayName: 'B様', insurance: 'iryo', careLevel: 'none',
    specialFlags: { betsu7: true, betsu8: false },

  const p3 = patients.add(db, createPatient({ id: 'p_sample3', name: '利用者C', displayName: 'C様', insurance: 'kaigo', careLevel: 'yoshien2',
    contract: { start: lastYear, end: null },

    requirements: { needsTwoStaff: false, allowedRoles: ['PT', 'OT'] } }));

  plans.add(db, createPlan({ id: 'pl_sample1', patientId: p1.id, serviceType: 'nursing', durationMin: 60, dow: 1, start: '10:00', staffIds: [s1.id], period: { from: first, to: null } }));
  plans.add(db, createPlan({ id: 'pl_sample2', patientId: p1.id, serviceType: 'nursing', durationMin: 60, dow: 4, start: '10:00', staffIds: [s2.id], period: { from: first, to: null } }));
  plans.add(db, createPlan({ id: 'pl_sample3', patientId: p2.id, serviceType: 'nursing', durationMin: 90, dow: 2, start: '14:00', staffIds: [s1.id],
    recurrence: { kind: 'biweekly', anchorDate: first, weeksOfMonth: null }, period: { from: first, to: null } }));
  plans.add(db, createPlan({ id: 'pl_sample4', patientId: p3.id, serviceType: 'rehab', durationMin: 40, dow: 3, start: '13:00', staffIds: [s3.id],
    recurrence: { kind: 'weeksOfMonth', anchorDate: null, weeksOfMonth: [1, 3] }, period: { from: first, to: null } }));

  const thirdWed = monthDates(year, month).filter(d => dowOf(d) === 3)[2];
  if (thirdWed) holidays.add(db, createHoliday({ date: thirdWed, name: '事業所研修日（架空）', kind: 'office' }));

  // ②勤務表から取り込んだ日別データの例: 花子が第2火曜に臨時勤務（標準の勤務枠は月水木金）
  const secondTue = monthDates(year, month).filter(d => dowOf(d) === 2)[1];
  if (secondTue) shiftsRepo.replaceFor(db, [createShift({ staffId: s2.id, date: secondTue, start: '09:00', end: '15:00', kind: 'work', source: 'import', note: '臨時勤務（架空）' })]);

  expandMonth(db, year, month);

/* ------------------------------------------------------------------
 * 10. 公開 API
 * ------------------------------------------------------------------ */
const VS = {
  SCHEMA_VERSION, STORAGE_KEY, HISTORY_MAX, MAX_STAFF_PER_VISIT, LONG_VISIT_MIN,
  ENUMS, ROLE_SERVICE, STATUS_TRANSITIONS, DOW_JA, SLOT_OPTIONS, RULE_LEVEL, MEDICAL_WEEKLY_LIMIT,

  time: { isTimeStr, toMin, fromMin, addMin, rangesOverlap, timeBandOf },

  create: { db: createEmptyDb, patient: createPatient, instruction: createInstruction, staff: createStaff, plan: createPlan, visit: createVisit, holiday: createHoliday, shift: createShift },
  validate: { patient: validatePatient, staff: validateStaff, plan: validatePlan, visit: validateVisit, holiday: validateHoliday, shift: validateShift, settings: validateSettings, meta: validateMeta, db: validateDb },
  derive: { visitDurationMin, visitTimeBand, isLongVisit, isTwoStaffVisit, isActiveVisit, patientDisplayName, staffDisplayName,

  rules: { findStaffConflicts, findPatientConflicts, checkVisitRules, checkPlanRules, changeVisitStatus, expandPlan, expandMonth,

  repo: { patients, staff, plans, visits, holidays, shifts: shiftsRepo, settings: settingsRepo, meta: metaRepo, pushHistory },
