/* ---------- 訪問の編集モーダル ---------- */
function openVisitModal({ id = null, prefill = null } = {}) {
  const v = id ? VS.repo.visits.get(state.db, id) : null;
  if (id && !v) { toast('訪問が見つかりません'); return; }
  modal.id = id; modal.prefill = prefill;
  $('#modal-title').textContent = v ? '訪問の編集' : '訪問の追加';
  $('#modal-body').innerHTML = visitFormHtml(v, prefill || {});
  $('#modal').hidden = false;
  wireForm(v);
  if (v && VS.derive.isActiveVisit(v)) {
    const rules = VS.rules.checkVisitRules(state.db, v);
    showMsgs(rules.filter(r => BLOCKING.has(r.code)), rules.filter(r => !BLOCKING.has(r.code)));
  }
  const first = $('#visit-form [name=date]'); if (first && !first.disabled) first.focus();
}
function closeModal() { $('#modal').hidden = true; modal.id = null; modal.prefill = null; }
function optionList(items, value, labelFn, emptyLabel) {
  return `<option value="">${esc(emptyLabel)}</option>` + items.map(x => `<option value="${esc(x.id)}" ${x.id === value ? 'selected' : ''}>${esc(labelFn(x))}</option>`).join('');
}
function withCurrent(list, value, byId) { if (value && !list.some(x => x.id === value)) { const cur = byId(value); if (cur) list = list.concat([cur]); } return list; }
function visitFormHtml(v, pre) {
  const d = v || Object.assign({ date: state.date, start: '', end: '', patientId: '', staffIds: [], serviceType: 'nursing', flags: { emergency: false, training: false }, note: '' }, pre);
  const locked = !!v && v.status === 'transferred';
  const dis = locked ? 'disabled' : '';
  let statusLine = '';
  if (v) {
    const btns = (VS.STATUS_TRANSITIONS[v.status] || []).map(n => `<button type="button" class="small" data-status="${n}">${esc(STATUS_BTN_FROM[v.status + '>' + n] || STATUS_BTN[n])}</button>`).join('');
    statusLine = `<div class="status-line"><span class="badge st-${v.status}">${esc(VS.ENUMS.visitStatus[v.status])}</span>` +
      (v.cancelReason ? `<span class="muted">理由: ${esc(VS.ENUMS.cancelReason[v.cancelReason])}</span>` : '') +
      (v.planId ? '<span class="muted">計画から展開</span>' : '') +
      (v.transferredFromId ? `<button type="button" class="linkish" data-open="${esc(v.transferredFromId)}">振替元を開く</button>` : '') +
      (v.transferredToId ? `<button type="button" class="linkish" data-open="${esc(v.transferredToId)}">振替先を開く</button>` : '') +
      `<span class="spacer"></span>${btns}</div><div id="action-panel"></div>`;
  }
  const staffSel = (name, value, empty) => `<select name="${name}" ${dis}>${optionList(withCurrent(activeStaff(), value, staffById), value, s => `${VS.derive.staffDisplayName(s)}（${VS.ENUMS.staffRole[s.role]}）${s.archived ? '・無効' : ''}`, empty)}</select>`;
  const patients = withCurrent(activePatients(), d.patientId, patientById);
  const hint = patients.length ? '' : '<div class="hint">利用者が登録されていません。「データ」タブからサンプルを読み込むか、利用者登録画面（次の段階）で登録してください。</div>';
  return `${statusLine}${hint}<form id="visit-form" autocomplete="off"><div class="grid2">` +
    `<label>日付<input type="date" name="date" value="${esc(d.date || '')}" required ${dis}></label>` +
    `<label>利用者<select name="patientId" ${dis}>${optionList(patients, d.patientId, p => VS.derive.patientDisplayName(p) + (p.archived ? '（無効）' : ''), '選択してください')}</select></label>` +
    `<label>開始<input type="time" name="start" value="${esc(d.start || '')}" step="300" required ${dis}></label>` +
    `<label>終了<input type="time" name="end" value="${esc(d.end || '')}" step="300" required ${dis}></label>` +
    `<label>種別<select name="serviceType" ${dis}>${Object.entries(VS.ENUMS.serviceType).map(([k, l]) => `<option value="${k}" ${k === d.serviceType ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` +
    `<label>所要時間<span class="readout" id="dur-readout">—</span></label>` +
    `<label>担当1${staffSel('staff1', d.staffIds[0] || '', '未割当')}</label>` +
    `<label>担当2（複数名訪問）${staffSel('staff2', d.staffIds[1] || '', 'なし')}</label>` +
    `<label class="chk"><input type="checkbox" name="emergency" ${d.flags.emergency ? 'checked' : ''} ${dis}> 緊急訪問</label>` +
    `<label class="chk"><input type="checkbox" name="training" ${d.flags.training ? 'checked' : ''} ${dis}> 研修同行（複数名加算の対象外）</label>` +
    (v && v.status === 'done' ? `<label>実績 開始<input type="time" name="aStart" value="${esc(v.actual.start)}" step="300"></label><label>実績 終了<input type="time" name="aEnd" value="${esc(v.actual.end)}" step="300"></label>` : '') +
    `<label class="wide">備考<textarea name="note" rows="2" ${dis}>${esc(d.note)}</textarea></label></div>` +
    `<div id="form-msgs"></div><div class="modal-foot">` +
    (v ? `<button type="button" class="danger" id="btn-delete" ${locked ? 'disabled' : ''}>削除</button>` : '') +
    `<span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button>` +
    (locked ? '' : '<button type="submit" class="primary" id="btn-save">保存</button>') + '</div></form>';
}
const tval = s => { if (!s) return ''; s = String(s).slice(0, 5); return VS.time.isTimeStr(s) ? s : ''; };
function wireForm(v) {
  const form = $('#visit-form');
  const startEl = form.elements.start, endEl = form.elements.end, readout = $('#dur-readout');
  let lastDur = state.db.settings.defaultDurationMin;
  if (v) lastDur = VS.derive.visitDurationMin(v);
  else if (modal.prefill && tval(modal.prefill.start) && tval(modal.prefill.end) && toMin(modal.prefill.end) > toMin(modal.prefill.start)) lastDur = toMin(modal.prefill.end) - toMin(modal.prefill.start);
  const updateDur = () => { const s = tval(startEl.value), e = tval(endEl.value); readout.textContent = s && e && toMin(e) > toMin(s) ? `${toMin(e) - toMin(s)} 分` : '—'; };
  startEl.addEventListener('change', () => {
    const s = tval(startEl.value); if (!s) return;
    const e = tval(endEl.value);
    if (!e || toMin(e) <= toMin(s)) endEl.value = fromMin(Math.min(24 * 60 - 1, toMin(s) + lastDur));
    updateDur();
  });
  endEl.addEventListener('change', () => { const s = tval(startEl.value), e = tval(endEl.value); if (s && e && toMin(e) > toMin(s)) lastDur = toMin(e) - toMin(s); updateDur(); });
  updateDur();
  form.addEventListener('submit', ev => { ev.preventDefault(); saveFromForm(v); });
  $('#btn-close-modal').onclick = closeModal;
  const del = $('#btn-delete'); if (del) del.onclick = () => deleteVisit(v.id);
  $$('#modal [data-status]').forEach(b => { b.onclick = () => startStatusAction(v, b.dataset.status); });
  $$('#modal [data-open]').forEach(b => { b.onclick = () => openVisitModal({ id: b.dataset.open }); });
}
function readForm(form) {
  const f = form.elements;
  const patch = {
    date: f.date.value, start: tval(f.start.value), end: tval(f.end.value),
    patientId: f.patientId.value, staffIds: [f.staff1.value, f.staff2.value].filter(Boolean),
    serviceType: f.serviceType.value, flags: { emergency: f.emergency.checked, training: f.training.checked }, note: f.note.value.trim()
  };
  if (f.aStart) patch.actual = { start: tval(f.aStart.value), end: tval(f.aEnd.value) };
  return patch;
}
function showMsgs(errors, warnings) {
  const el = $('#form-msgs'); if (!el) return;
  const fmt = e => e.text || (e.path && FIELD_LABEL[e.path.split(/[.\[]/)[0]] ? `${FIELD_LABEL[e.path.split(/[.\[]/)[0]]}: ${e.msg}` : e.msg);
  el.innerHTML = (errors.length ? `<ul class="msgs err">${errors.map(e => `<li>${esc(fmt(e))}</li>`).join('')}</ul>` : '') +
    (warnings.length ? `<ul class="msgs warn">${warnings.map(w => `<li>${esc(w.msg)}</li>`).join('')}</ul>` : '');
}
function saveFromForm(v) {
  const patch = readForm($('#visit-form'));
  const candidate = v ? Object.assign(VS.clone(v), patch, { updatedAt: VS.nowIso() }) : VS.create.visit(patch);
  const errs = VS.validate.visit(candidate);
  if (errs.length) { showMsgs(errs, []); return; }
  const rules = VS.rules.checkVisitRules(state.db, candidate);
  const blocking = rules.filter(r => BLOCKING.has(r.code)), warnings = rules.filter(r => !BLOCKING.has(r.code));
  if (blocking.length) { showMsgs(blocking, warnings); return; }
  try { if (v) VS.repo.visits.update(state.db, v.id, patch); else VS.repo.visits.add(state.db, candidate); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
  if (!persist()) { closeModal(); render(); return; }
  if (!v || candidate.date !== state.date) state.date = candidate.date;
  closeModal(); render();
  toast(warnings.length ? '保存しました（注意: ' + warnings.map(w => w.msg).join(' / ') + '）' : '保存しました');
}
function deleteVisit(id) {
  if (!confirm('この訪問を削除します。よろしいですか？\n（記録を残す場合は「キャンセルする」を使ってください）')) return;
  try { VS.repo.visits.remove(state.db, id); }
  catch (err) { showMsgs([{ msg: err.message }], []); return; }

}
function actionPanel(html, onOk) {
  const p = $('#action-panel'); p.innerHTML = html;
  $('#act-ok').onclick = onOk;
  $('#act-no').onclick = () => { p.innerHTML = ''; };
}
function startStatusAction(v, next) {
  if (next === 'cancelled') {
    actionPanel(`<label>キャンセル理由<select id="act-reason">${Object.entries(VS.ENUMS.cancelReason).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select></label>` +
      `<button type="button" class="primary" id="act-ok">キャンセルを確定</button><button type="button" id="act-no">やめる</button>`,
      () => applyStatus(v.id, 'cancelled', { cancelReason: $('#act-reason').value }));
  } else if (next === 'done') {
    actionPanel(`<label>実績 開始<input type="time" id="act-start" value="${esc(v.start)}" step="300"></label><label>実績 終了<input type="time" id="act-end" value="${esc(v.end)}" step="300"></label>` +
      `<button type="button" class="primary" id="act-ok">実施済みにする</button><button type="button" id="act-no">やめる</button>`,
      () => applyStatus(v.id, 'done', { actual: { start: tval($('#act-start').value), end: tval($('#act-end').value) } }));
  } else if (next === 'transferred') {
    actionPanel(`<label>振替先の日付<input type="date" id="act-date" value="${esc(v.date)}"></label><label>開始<input type="time" id="act-start" value="${esc(v.start)}" step="300"></label>` +
      `<label class="chk"><input type="checkbox" id="act-keep" checked> 担当も引き継ぐ</label>` +
      `<button type="button" class="primary" id="act-ok">振替を確定</button><button type="button" id="act-no">やめる</button>`,
      () => applyTransfer(v.id, { date: $('#act-date').value, start: tval($('#act-start').value), keepStaff: $('#act-keep').checked }));
  } else applyStatus(v.id, next, {});
}
function applyStatus(id, next, extra) {
  try { VS.repo.visits.setStatus(state.db, id, next, extra); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); return; }
  if (!persist()) { closeModal(); render(); return; }
  render(); openVisitModal({ id }); toast(`「${VS.ENUMS.visitStatus[next]}」にしました`);
}
function applyTransfer(id, { date, start, keepStaff }) {
  const src = VS.repo.visits.get(state.db, id);
  if (!VS.date.isDateStr(date) || !start) { showMsgs([{ msg: '振替先の日付と開始時刻を入力してください' }], []); return; }
  let dst;
  try { dst = VS.repo.visits.transfer(state.db, id, { date, start, staffIds: keepStaff ? src.staffIds.slice() : [] }); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
  const blocking = VS.rules.checkVisitRules(state.db, dst).filter(r => BLOCKING.has(r.code));
  if (blocking.length) { loadDb(); showMsgs(blocking.map(b => ({ msg: '振替先: ' + b.msg })), []); return; }
  if (!persist()) { closeModal(); render(); return; }
  state.date = date; render(); openVisitModal({ id: dst.id }); toast('振替しました');
}

/* ---------- イベント ---------- */
function step(n) {
  if (state.view === 'day') state.date = VS.date.addDays(state.date, n);
  else if (state.view === 'week') state.date = VS.date.addDays(state.date, 7 * n);
  else {
    const { y, m } = UI.ym(state.date); const t = UI.addMonths(y, m, n);
    state.date = `${t.y}-${pad2(t.m)}-${pad2(Math.min(Number(state.date.slice(8)), VS.date.daysInMonth(t.y, t.m)))}`;
  }
  render();
}
function wireEvents() {
  $$('.tabs button').forEach(b => { b.onclick = () => { state.view = b.dataset.view; render(); }; });
  $$('#week-mode button').forEach(b => { b.onclick = () => { state.weekMode = b.dataset.mode; render(); }; });
  $('#nav-prev').onclick = () => step(-1);
  $('#nav-next').onclick = () => step(1);
  $('#nav-today').onclick = () => { state.date = todayStr(); render(); };
  $('#date-input').onchange = e => { if (VS.date.isDateStr(e.target.value)) { state.date = e.target.value; render(); } };
  $('#f-staff').onchange = e => { state.filter.staffId = e.target.value; render(); };
  $('#f-patient').onchange = e => { state.filter.patientId = e.target.value; render(); };
  $('#f-service').onchange = e => { state.filter.serviceType = e.target.value; render(); };
  $('#f-inactive').onchange = e => { state.filter.showInactive = e.target.checked; render(); };
  $('#btn-add').onclick = () => openVisitModal({ prefill: { date: state.date } });
  $('#btn-expand').onclick = expandCurrentMonth;
  $('#view').addEventListener('click', e => {
    const open = e.target.closest('[data-id]');
    if (open) { openVisitModal({ id: open.dataset.id }); return; }
    const add = e.target.closest('[data-add]');
    if (add) { openVisitModal({ prefill: { date: add.dataset.date, staffIds: add.dataset.staff ? [add.dataset.staff] : [], patientId: add.dataset.patient || '' } }); return; }
    const go = e.target.closest('[data-goto]');
    if (go) { state.date = go.dataset.goto; state.view = 'day'; render(); return; }
    const col = e.target.closest('.day-col');
    if (col) {
      const rect = col.getBoundingClientRect();
      const slot = state.db.settings.slotMin;
      const min = UI.snapMin(Number(col.dataset.axisStart) + (e.clientY - rect.top) / PX_PER_MIN, slot);
      const startMin = Math.max(0, Math.min(min, 24 * 60 - slot));
      const endMin = Math.min(24 * 60 - 1, startMin + state.db.settings.defaultDurationMin);
      openVisitModal({ prefill: { date: state.date, start: fromMin(startMin), end: fromMin(endMin), staffIds: col.dataset.staff ? [col.dataset.staff] : [] } });
    }
  });
  $('#modal-close').onclick = closeModal;
  $('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

  // データタブ
  $('#btn-sample').onclick = () => {
    if (localStorage.getItem(VS.STORAGE_KEY) !== null && !confirm('保存済みデータをサンプルで置き換えます。よろしいですか？')) return;
    const now = new Date();
    const r = VS.store.save(VS.sample.build(now.getFullYear(), now.getMonth() + 1), localStorage);
    if (!r.ok) alert('保存できませんでした:\n' + r.errors.map(e => e.path + ' ' + e.msg).join('\n'));
    loadDb(); render(); toast('サンプルデータを読み込みました');
  };
  $('#btn-export').onclick = () => {
    const blob = new Blob([VS.store.exportJson(state.db)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `訪問スケジュール_${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#btn-import').onclick = () => $('#file-import').click();
  $('#file-import').onchange = ev => {
    const file = ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { db, errors } = VS.store.parseDb(String(reader.result));
        if (errors.length) { alert('読み込んだデータに問題があります（保存しません）:\n' + errors.slice(0, 10).map(e => e.path + ' ' + e.msg).join('\n')); return; }
        if (!confirm(`利用者 ${db.patients.length} 名・訪問 ${db.visits.length} 件を読み込み、現在の保存データを置き換えます。よろしいですか？`)) return;
        const r = VS.store.save(db, localStorage);
        if (!r.ok) alert('保存できませんでした');
      } catch (e) { alert(e.message); }
      finally { ev.target.value = ''; loadDb(); render(); }
    };
    reader.readAsText(file);
  };
  $('#btn-clear').onclick = () => {
    if (!confirm('保存データをすべて削除します。先にJSONを書き出していますか？')) return;
    VS.store.clear(localStorage); loadDb(); render();
  };
}
function expandCurrentMonth() {
  const { y, m } = UI.ym(state.date);
  const plans = state.db.plans.filter(p => !p.archived);
  if (!plans.length) { alert('有効な訪問計画がありません。'); return; }
  if (!confirm(`${y}年${m}月に ${plans.length} 件の訪問計画を展開します。すでに展開済みの日は重複しません。よろしいですか？`)) return;
  let r;
  try { r = VS.rules.expandMonth(state.db, y, m); }
  catch (err) { alert('展開できませんでした: ' + err.message); loadDb(); render(); return; }
  if (!persist()) { render(); return; }
  const reasons = {};
  r.skipped.forEach(s => { reasons[s.reason] = (reasons[s.reason] || 0) + 1; });
  const detail = Object.entries(reasons).map(([k, n]) => `${SKIP_LABEL[k] || k} ${n}`).join('、');
  render();
  alert(`${r.added.length} 件の訪問を追加しました。` + (r.skipped.length ? `\n見送り ${r.skipped.length} 件（${detail}）` : ''));
}

/* ---------- 起動 ---------- */
loadPrefs();
loadDb();
wireEvents();
renderStaticData();
render();
if (state.load.errors.length) toast('保存データに問題がありました。「データ」タブで内容を確認してください');
})();
</script>
</body>
</html>
