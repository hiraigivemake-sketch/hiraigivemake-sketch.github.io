<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.seo_title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#ed7300">
<link rel="canonical" href="{{ site.base_url }}{{ page.url }}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.seo_title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.base_url }}{{ page.url }}">
<meta property="og:image" content="{{ site.base_url }}{{ site.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{ site.favicon }}">
<link rel="apple-touch-icon" href="{{ site.favicon }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/css/style.css?v={{ site.asset_version }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MedicalBusiness",
  "name": "{{ site.company.office }}",
  "url": "{{ site.base_url }}",
  "telephone": "{{ site.company.tel }}",
  "address": {
    "@type": "PostalAddress",
    "postalCode": "{{ site.company.postal }}",
    "addressCountry": "JP",
    "streetAddress": "{{ site.company.address }}"
  },
  "openingHours": "Mo-Fr {{ site.company.hours }}",
  "areaServed": "{{ site.company.area }}"
}
</script>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
{{> header }}

<main id="main">
