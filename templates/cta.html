<section class="cta">
  <div class="container cta__grid">
    <div>
      <h2 class="cta__title">{{ site.cta.contact.title }}</h2>
      <p class="cta__text">{{ site.cta.contact.text }}</p>
      <div class="cta__actions">
        <a class="btn" href="/contact/">{{ site.cta.contact.button }}</a>
      </div>
    </div>
    <div>
      <h2 class="cta__title">{{ site.cta.entry.title }}</h2>
      <p class="cta__text">{{ site.cta.entry.text }}</p>
      <div class="cta__actions">
        <a class="btn" href="/entry/">{{ site.cta.entry.button }}</a>
        <a class="btn btn--line" href="{{ site.social.line }}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true"><path d="M12 2C6.5 2 2 5.7 2 10.2c0 4 3.6 7.4 8.4 8.1.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1.1 1 .6s6.3-3.7 8.6-6.4c1.5-1.7 2.2-3.4 2.2-4.7C23 5.7 18.5 2 12 2z"/></svg>
          {{ site.cta.entry.line_button }}
        </a>
      </div>
    </div>
  </div>
</section>
