<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤務表</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb; --ok:#15803d; --ng:#b91c1c; --warn:#b45309; --accent:#0f766e; --today:#ecfeff; --closed:#f3f4f6; --hol:#fff1f2; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; font-size:14px; }
  [hidden] { display:none !important; }
  button { font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); }
  button:hover { background:#f3f4f6; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.primary:hover { background:#0d5f58; }
  button.danger { color:var(--ng); } button.small { padding:3px 8px; font-size:12px; }
  button.linkish { border:none; background:none; color:var(--accent); padding:0; font-size:inherit; text-decoration:underline; } button.linkish:hover { background:none; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, input[type=date], input[type=time], input[type=text], input[type=search], input[type=number], input[type=month], textarea { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  input[type=color] { padding:2px; width:48px; height:32px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:#f3f4f6; padding:1px 4px; border-radius:4px; }
  .muted { color:var(--sub); font-size:12px; } .ok { color:var(--ok); font-weight:600; } .ng { color:var(--ng); font-weight:600; } .warn-text { color:var(--warn); } .ng-text { color:var(--ng); font-weight:600; }
  .spacer { flex:1; } .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .topbar { background:#fff; border-bottom:1px solid var(--line); padding:8px 16px; position:sticky; top:0; z-index:20; }
  .row1, .row2 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .row2 { margin-top:6px; }
  .topbar h1 { font-size:17px; margin:0 12px 0 0; }
  .station { color:var(--sub); font-size:12px; margin-right:12px; max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs, .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .tabs button, .seg button { border:none; border-radius:0; padding:5px 14px; } .tabs button.active, .seg button.active { background:var(--accent); color:#fff; }
  .nav { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .nav-title { font-weight:600; margin:0 6px; }
  .actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#e5e7eb; }
  .badge.draft { background:#fef3c7; color:#92400e; } .badge.confirmed { background:#dcfce7; color:#166534; } .badge.locked { background:#e0e7ff; color:#3730a3; }
  .badge.lvl-block { background:#fee2e2; color:#991b1b; } .badge.lvl-warn { background:#fef3c7; color:#92400e; }
  .chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; }
  main { padding:12px 16px 60px; }
  #view { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .empty { padding:40px 20px; text-align:center; color:var(--sub); }
  .banner { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; padding:8px 12px; border-radius:8px; margin:12px; }
  .banner.info { background:#ecfeff; border-color:#06b6d4; color:#155e75; }
  /* 勤務表グリッド */
  .grid-wrap { overflow:auto; max-height:calc(100vh - 170px); }
  table.roster { border-collapse:separate; border-spacing:0; font-size:12px; min-width:100%; }
  table.roster th, table.roster td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center; padding:0; }
  table.roster thead th { position:sticky; top:0; background:#f9fafb; z-index:5; padding:4px 2px; min-width:34px; font-weight:600; line-height:1.2; }
  table.roster thead th small { display:block; color:var(--sub); font-weight:normal; }
  table.roster th.sticky-col { position:sticky; left:0; background:#f9fafb; z-index:4; text-align:left; padding:4px 8px; min-width:150px; white-space:nowrap; }
  table.roster thead th.sticky-col { z-index:6; }
  table.roster th.sticky-col small { display:block; color:var(--sub); font-weight:normal; font-size:11px; }
  table.roster th.closed, table.roster td.closed { background:var(--closed); } table.roster th.hol, table.roster td.hol { background:var(--hol); } table.roster th.today { box-shadow:inset 0 -3px 0 var(--accent); }
  table.roster th.hol small { color:var(--ng); }
  td.cell { height:34px; min-width:34px; cursor:pointer; position:relative; font-weight:600; }
  td.cell:hover { outline:2px solid var(--accent); outline-offset:-2px; z-index:3; }
  td.cell .code { display:inline-block; min-width:22px; line-height:22px; border-radius:4px; }
  td.cell .oc { position:absolute; right:1px; top:0; font-size:10px; color:#b45309; }
  td.cell .wish { position:absolute; left:2px; top:0; font-size:9px; color:var(--sub); font-weight:normal; } td.cell .wish.must { color:var(--ng); font-weight:700; }
  td.cell .mark { position:absolute; right:2px; bottom:1px; width:6px; height:6px; border-radius:50%; } td.cell .mark.block { background:var(--ng); } td.cell .mark.warn { background:#f59e0b; }
  td.cell.blank { color:#d1d5db; }
  td.cell.hl { animation:hl 2s; }
  body.mode-actual td.cell.changed { outline:2px dashed #b45309; outline-offset:-2px; }
  body.mode-actual td.cell .act { position:absolute; left:2px; bottom:0; font-size:9px; color:#b45309; font-weight:700; } @keyframes hl { 0% { box-shadow:inset 0 0 0 3px var(--accent); } 100% { box-shadow:none; } }
  td.stat { padding:2px 6px; white-space:nowrap; } td.stat.ng { background:#fee2e2; }
  table.roster tfoot th { position:sticky; left:0; background:#f9fafb; text-align:left; padding:3px 8px; } table.roster tfoot td { padding:3px 2px; background:#fafafa; } table.roster tfoot td.ng { background:#fee2e2; color:var(--ng); font-weight:700; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding:8px 12px; font-size:12px; border-top:1px solid var(--line); background:#fafafa; }
  .legend .code { display:inline-block; min-width:20px; text-align:center; border-radius:4px; font-weight:600; margin-right:3px; }
  /* ポップオーバー */
  .popover { position:fixed; z-index:60; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.18); padding:10px; width:280px; font-size:13px; }
  .popover h4 { margin:0 0 6px; font-size:13px; } .popover .opts { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .popover .opts button { text-align:left; padding:4px 6px; } .popover .opts button .code { display:inline-block; min-width:20px; text-align:center; border-radius:4px; margin-right:4px; font-weight:600; }
  .popover .opts button.on { outline:2px solid var(--accent); }
  .popover .msgs { margin:6px 0 0; padding:6px 8px 6px 22px; border-radius:6px; font-size:12px; } .popover .msgs.err { background:#fee2e2; color:#991b1b; } .popover .msgs.warn { background:#fef3c7; color:#92400e; }
  .popover .foot { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  /* 集計・一覧 */
  .list-wrap { overflow:auto; max-height:calc(100vh - 170px); }
  table.list { border-collapse:collapse; width:100%; font-size:13px; } table.list th, table.list td { border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  table.list th { background:#f9fafb; font-weight:600; white-space:nowrap; position:sticky; top:0; z-index:2; } table.list td.num { text-align:right; }
  tr.clickable { cursor:pointer; } tr.clickable:hover { background:#f3f4f6; } tr.archived-row { color:#9ca3af; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; padding:12px 16px; } .card { background:#f9fafb; border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:160px; }
  .card .big { font-size:22px; font-weight:700; } .card .big.ng { color:var(--ng); }
  .inline-form { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:flex-end; padding:12px; border-bottom:1px solid var(--line); }
  .inline-form label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; } .inline-form label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; width:100%; }
  #master-search { width:200px; }
  /* モーダル・フォーム */
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal { background:#fff; width:min(720px,100%); max-height:92vh; overflow:auto; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.25); } .modal.wide { width:min(920px,100%); }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); } .modal-head h3 { margin:0; font-size:16px; }
  #modal-close { border:none; background:none; font-size:20px; line-height:1; padding:2px 6px; } .modal-body { padding:14px 18px 18px; }
  .form-sec { border:1px solid var(--line); border-radius:8px; padding:8px 12px 10px; margin-bottom:10px; } .form-sec h4 { margin:0 0 8px; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; } .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 14px; }
  .grid2 label, .grid3 label, .form-sec > label, #master-form > label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  .grid2 label.chk, .grid3 label.chk, .form-sec label.chk { flex-direction:row; align-items:center; color:var(--ink); font-size:13px; }
  .grid2 .wide, .grid3 .wide { grid-column:1 / -1; } .chips-wrap { display:flex; flex-wrap:wrap; gap:4px 14px; } .sub-label { font-size:12px; color:var(--sub); margin:8px 0 4px; }
  .msgs { margin:10px 0 0; padding:8px 12px 8px 28px; border-radius:8px; font-size:13px; } .msgs.err { background:#fee2e2; color:#991b1b; } .msgs.warn { background:#fef3c7; color:#92400e; }
  .modal-foot { display:flex; gap:8px; align-items:center; margin-top:14px; }
  .issue-list { margin:4px 0 10px; padding-left:18px; font-size:13px; } details.issue-group { margin-bottom:6px; } details.issue-group summary { cursor:pointer; font-weight:600; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f2937; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; z-index:70; box-shadow:0 4px 16px rgba(0,0,0,.3); max-width:90vw; }
  table.cands { border-collapse:collapse; width:100%; font-size:13px; } table.cands th, table.cands td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:right; } table.cands th:first-child, table.cands td:first-child { text-align:left; } table.cands td.best { background:#dcfce7; font-weight:600; }
  textarea.code { width:100%; min-height:140px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  .stepper { display:inline-flex; align-items:center; gap:4px; } .stepper input { width:56px; text-align:center; }
  pre.sample { background:#f3f4f6; color:var(--ink); font-size:12px; padding:10px; border-radius:8px; max-height:220px; overflow:auto; }
  pre.json { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:12px; max-height:360px; }
  #data-view section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; } #data-view h2 { font-size:16px; margin:0 0 10px; }
  table.plain { border-collapse:collapse; width:100%; font-size:13px; } table.plain th, table.plain td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; } table.plain th { background:#f9fafb; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; } .counts span { display:inline-block; margin-right:14px; }
  /* 出力 */
  .output-form { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:flex-end; padding:12px 16px; border-bottom:1px solid var(--line); background:#fff; }
  .output-form label { display:flex; flex-direction:column; font-size:12px; color:var(--sub); gap:3px; }
  #print-area { padding:16px; background:#eef0f3; }
  .print-page { background:#fff; padding:20px 24px; margin:0 auto 16px; max-width:297mm; box-shadow:0 1px 4px rgba(0,0,0,.12); font-size:12px; color:#111; }
  .print-head { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid #333; padding-bottom:6px; margin-bottom:10px; } .print-head h2 { margin:0; font-size:17px; }
  table.print-roster { border-collapse:collapse; width:100%; font-size:11px; } table.print-roster th, table.print-roster td { border:1px solid #777; padding:2px 3px; text-align:center; } table.print-roster th.name, table.print-roster td.name { text-align:left; white-space:nowrap; }
  table.print-roster th.closed, table.print-roster td.closed { background:#eee; }
  table.print-table { width:100%; border-collapse:collapse; } table.print-table th, table.print-table td { border:1px solid #777; padding:4px 8px; text-align:left; } table.print-table th { background:#f3f4f6; }
  .print-foot { margin-top:8px; display:flex; flex-direction:column; gap:2px; font-size:11px; color:#333; } .print-foot span:last-child { text-align:right; }
  @page { size:A4 landscape; margin:10mm; }
  @media print {
    body.print-output .topbar, body.print-output .output-form, body.print-output #toast, body.print-output .modal-bg, body.print-output .popover { display:none !important; }
    body.print-output main { padding:0; } body.print-output #view { border:none; } body.print-output #print-area { padding:0; background:#fff; }
    body.print-output .print-page { box-shadow:none; margin:0; max-width:none; padding:0; page-break-after:always; break-after:page; } body.print-output .print-page:last-child { page-break-after:auto; }
  }
  @media (max-width:640px) { .grid2, .grid3 { grid-template-columns:1fr; } .topbar h1, .station { display:none; } .actions { margin-left:0; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="row1">
    <h1>勤務表</h1>
    <span class="station" id="station-name"></span>
    <nav class="tabs" aria-label="表示切替">
      <button type="button" data-view="roster">勤務表</button>
      <button type="button" data-view="wishes">希望</button>
      <button type="button" data-view="summary">集計</button>
      <button type="button" data-view="output">出力</button>
      <button type="button" data-view="master">マスタ</button>
      <button type="button" data-view="data">データ</button>
    </nav>
    <div id="nav" class="nav">
      <button type="button" id="nav-prev" title="前月">‹</button>
      <button type="button" id="nav-today">今月</button>
      <button type="button" id="nav-next" title="翌月">›</button>
      <span id="nav-title" class="nav-title"></span>
      <span id="month-status"></span>
      <div class="seg" id="mode-seg" title="実績モードでは、実際に勤務した種別を入れます。未入力の日は予定どおりです"><button type="button" data-mode="plan">予定</button><button type="button" data-mode="actual">実績</button></div>
    </div>
    <div class="actions" id="actions">
      <button type="button" id="btn-fill" class="primary" title="空欄を自動で埋めます">自動作成</button>
      <button type="button" id="btn-compare" title="方針の違う3案を作って比べます">案を比較</button>
      <button type="button" id="btn-refill" title="この月をすべて作り直します">やり直す</button>
      <button type="button" id="btn-copy" title="前月の曜日ごとの型を空欄に写します">前月の型をコピー</button>
      <button type="button" id="btn-check">月次チェック</button>
      <button type="button" id="btn-confirm">確定</button>
      <button type="button" id="btn-wish-packet" title="スタッフ本人の端末に渡す提出用セット（勤務表は含みません）">提出用セットを書き出す</button>
      <button type="button" id="btn-wish-import" title="本人が書き出した提出コードを取り込みます">提出を取り込む</button>
      <button type="button" id="btn-wish-submit" class="primary" title="選んだ人の希望を提出コードにします">希望を提出する</button>
      <button type="button" id="btn-lock">希望を締め切る</button>
    </div>
  </div>
  <div id="master-bar" class="row2" hidden>
    <div class="seg" id="master-tabs">
      <button type="button" data-master="staff">スタッフ</button>
      <button type="button" data-master="shiftTypes">シフト種別</button>
      <button type="button" data-master="holidays">休日</button>
      <button type="button" data-master="settings">設定</button>
    </div>
    <input type="search" id="master-search" placeholder="名前で検索" aria-label="検索">
    <label class="chk" id="master-archived-label"><input type="checkbox" id="master-archived"> 無効も表示</label>
    <span class="spacer"></span>
    <button type="button" id="btn-master-add" class="primary">＋ 追加</button>
  </div>
</header>
<main>
  <div id="view"></div>
  <section id="data-view" hidden>
    <div id="load-banner" class="banner" hidden></div>
    <section>
      <h2>保存データ</h2>
      <p class="muted">保存先はこのブラウザの localStorage（キー <code id="storage-key"></code>）です。別の端末やブラウザとは共有されません。月に一度はJSONを書き出して保管してください。</p>
      <div class="btns">
        <button type="button" class="primary" id="btn-sample">サンプルデータを読み込む（架空）</button>
        <button type="button" id="btn-export">JSONを書き出す</button>
        <button type="button" id="btn-import">JSONを読み込む</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
        <button type="button" id="btn-import-staff">①訪問スケジュールのJSONからスタッフを取り込む</button>
        <input type="file" id="file-import-staff" accept="application/json,.json" hidden>
        <button type="button" id="btn-load-packet" title="管理者から受け取った提出用セットを読み込みます（この端末のデータは置き換わります）">希望の提出用セットを読み込む（スタッフ本人の端末）</button>
        <input type="file" id="file-load-packet" accept="application/json,.json" hidden>
        <button type="button" class="danger" id="btn-clear">保存データを全削除</button>
      </div>
      <div class="counts" id="counts"></div>
      <div id="db-errors"></div>
      <pre class="json" id="db-preview"></pre>
    </section>
    <section>
      <h2>セルフテスト</h2>
      <p class="muted">日付計算・検証・ルール・自動作成・書き出し・保存をこのブラウザで検査します。</p>
      <div id="test-summary"></div>
      <table class="plain" id="test-table"><thead><tr><th>結果</th><th>テスト</th><th>詳細</th></tr></thead><tbody></tbody></table>
    </section>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<div id="popover" class="popover" hidden></div>
<div id="modal" class="modal-bg" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h3 id="modal-title"></h3><button type="button" id="modal-close" aria-label="閉じる">×</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- =====================================================================
     データ層。DOM には触れない（Node でもテストできる）。
     ===================================================================== -->
<script id="rs-data">
(function (root) {
'use strict';

/* ------------------------------------------------------------------
 * 0. 定数
 * ------------------------------------------------------------------ */
const SCHEMA_VERSION = 2;
const STORAGE_KEY = 'kinmu_hyo_db';
const HISTORY_MAX = 300;
const STORAGE_WARN_BYTES = 4 * 1024 * 1024;
const DOW_JA = ['日', '月', '火', '水', '木', '金', '土'];
const NURSE_ROLES = ['NS', 'LPN'];
const REQUIRED_NURSE_FTE = 2.5;        // 訪問看護ステーションの看護職員 常勤換算

const ENUMS = {
  staffRole: { NS: '看護師', LPN: '准看護師', PT: '理学療法士', OT: '作業療法士', ST: '言語聴覚士', OTHER: 'その他' },
  employment: { fulltime: '常勤', parttime: '非常勤' },
  wishKind: { off: '休み希望', pto: '有給希望', work: '出勤希望', shift: 'シフト指定', noOncall: 'オンコール不可' },
  wishStrength: { must: '必須', prefer: '希望' },
  monthStatus: { draft: '作成中', confirmed: '確定' },
  holidayKind: { national: '祝日', office: '事業所休業日' }
};

/* 制約コードの重さ。block は保存不可（セル操作・自動作成で避ける）、warn は注意表示 */

 * 1. 日付・時刻
 * ------------------------------------------------------------------ */

function validateShiftType(st) {

function validateDb(db) {
  const e = [];
  if (!isObj(db)) return [{ path: '', msg: 'データがオブジェクトではありません' }];
  if (db.schemaVersion !== SCHEMA_VERSION) e.push({ path: 'schemaVersion', msg: `スキーマ版が ${SCHEMA_VERSION} ではありません` });
  for (const k of ['shiftTypes', 'staff', 'wishes', 'months', 'roster', 'holidays', 'history']) if (!Array.isArray(db[k])) e.push({ path: k, msg: '配列ではありません' });
  validateSettings(db.settings).forEach(x => e.push({ path: x.path ? `settings.${x.path}` : 'settings', msg: x.msg }));
  validateMeta(db.meta).forEach(x => e.push({ path: x.path ? `meta.${x.path}` : 'meta', msg: x.msg }));
  if (e.length) return e;
  const collect = (arr, fn, label, key = 'id') => {
    const ids = new Set();
    arr.forEach((x, i) => {
      fn(x).forEach(err => e.push({ path: `${label}[${i}].${err.path}`, msg: err.msg }));
      const k = x && x[key];
      if (k !== undefined) { if (ids.has(k)) e.push({ path: `${label}[${i}].${key}`, msg: `重複しています（${k}）` }); ids.add(k); }
    });

  collect(db.roster, validateEntry, 'roster');

  db.holidays.forEach((h, i) => { validateHoliday(h).forEach(err => e.push({ path: `holidays[${i}].${err.path}`, msg: err.msg })); const k = `${h && h.date}|${h && h.kind}`; if (hol.has(k)) e.push({ path: `holidays[${i}]`, msg: '同じ休日が重複しています' }); hol.add(k); });
  db.staff.forEach((s, i) => { if (!stIds.has(s.defaultShiftTypeId)) e.push({ path: `staff[${i}].defaultShiftTypeId`, msg: '存在しないシフト種別です' }); });
  const wk = new Set();
  db.wishes.forEach((w, i) => {
    if (!staffIds.has(w.staffId)) e.push({ path: `wishes[${i}].staffId`, msg: '存在しないスタッフです' });
    if (w.shiftTypeId && !stIds.has(w.shiftTypeId)) e.push({ path: `wishes[${i}].shiftTypeId`, msg: '存在しないシフト種別です' });
    const k = `${w.staffId}|${w.date}`; if (wk.has(k)) e.push({ path: `wishes[${i}]`, msg: '同じスタッフ・日付の希望が重複しています' }); wk.add(k);
  });
  const rk = new Set();
  db.roster.forEach((r, i) => {
    if (!staffIds.has(r.staffId)) e.push({ path: `roster[${i}].staffId`, msg: '存在しないスタッフです' });
    if (!stIds.has(r.shiftTypeId)) e.push({ path: `roster[${i}].shiftTypeId`, msg: '存在しないシフト種別です' });
    if (r.actualShiftTypeId && !stIds.has(r.actualShiftTypeId)) e.push({ path: `roster[${i}].actualShiftTypeId`, msg: '存在しないシフト種別です' });
    const k = `${r.staffId}|${r.date}`; if (rk.has(k)) e.push({ path: `roster[${i}]`, msg: '同じスタッフ・日付の勤務が重複しています（1日1種別）' }); rk.add(k);
  });
  return e;
}

/* 休業日: 営業曜日以外、事業所休業日、（設定により）祝日 */

/* ------------------------------------------------------------------
 * 7. 自動作成・型コピー
 * ------------------------------------------------------------------ */
/* 月の勤務表を埋める。overwrite=false なら空欄だけ。手順:
 *  1) 必須の休み・有給・シフト指定・出勤希望を先に置く
 *  2) 日ごとに、必要人数（看護職員→全体）を満たすまで出勤を割り当てる。候補は在籍中・勤務曜日・連続上限・休み希望なしで絞り、
 *     所定時間に対する不足が大きい人、出勤希望のある人を優先する。営業日は、所定時間に満たない人も出勤にする
 *  3) 残りは公休。週に休みがない人は、配置に余裕のある日を公休に戻す
 *  4) オンコールを毎日、担当可能で連日にならず回数が少ない人へ
 *  戻り値 { filled, oncallAssigned, unmet: [{ date, msg }] } */
const FILL_STRATEGIES = { balanced: 'バランス', wishes: '希望優先', fair: '公平性優先' };
function autoFill(db, ym, { overwrite = false, strategy = 'balanced' } = {}) {
  assertEditable(db, ym);
  if (!FILL_STRATEGIES[strategy]) throw new ValidationError('作成方針が不正です', [{ path: 'strategy', msg: String(strategy) }]);
  const dates = monthDates(ym), S = db.settings;
  const list = staffInMonth(db, ym);
  const order = id => list.findIndex(x => x.id === id);
  /* 希望優先: シフト指定の希望（必須でなくても）を既定シフトの代わりに使う */
  const typeFor = (s, d) => { const w = wishFor(db, s.id, d); const wt = strategy === 'wishes' && w && w.kind === 'shift' ? shiftTypeById(db, w.shiftTypeId) : null; return (wt && wt.isWork) ? wt : shiftTypeById(db, s.defaultShiftTypeId); };
  const offType = db.shiftTypes.find(t => !t.isWork && !t.usesPto && !t.archived) || db.shiftTypes.find(t => !t.isWork);
  const ptoType = db.shiftTypes.find(t => t.usesPto && !t.archived);
  if (!offType) throw new ValidationError('公休のシフト種別がありません', []);
  if (overwrite) roster.clearMonth(db, ym);
  const fixed = new Set(db.roster.filter(r => ymOf(r.date) === ym).map(r => `${r.staffId}|${r.date}`));
  const place = (s, date, st, oncall = false) => { roster.set(db, { date, staffId: s.id, shiftTypeId: st.id, oncall }); };
  const isFree = (s, date) => !fixed.has(`${s.id}|${date}`) && !entryFor(db, s.id, date);
  let filled = 0;
  // 1) 必須希望
  for (const s of list) for (const d of dates) {
    if (!staffEmployedOn(s, d) || !isFree(s, d)) continue;
    const w = wishFor(db, s.id, d);
    if (!w || w.strength !== 'must') continue;
    if (w.kind === 'off') { place(s, d, offType); filled++; }
    else if (w.kind === 'pto' && ptoType && s.ptoBalance > 0) { if (!checkEntry(db, createEntry({ date: d, staffId: s.id, shiftTypeId: ptoType.id })).some(x => x.code === 'ptoExceeded')) { place(s, d, ptoType); filled++; } }
    else if (w.kind === 'shift' && shiftTypeById(db, w.shiftTypeId)) { place(s, d, shiftTypeById(db, w.shiftTypeId)); filled++; }
    else if (w.kind === 'work') { place(s, d, shiftTypeById(db, s.defaultShiftTypeId) || offType); filled++; }
  }
  // 2) 日ごとの配置
  const need = date => { const c = isClosedDay(db, date); return { nurses: c ? S.minNursesClosed : S.minNurses, total: c ? S.minTotalClosed : S.minTotal }; };
  const deficit = s => { const st = staffMonthStats(db, s.id, ym); return st.target - st.hours; };
  for (const d of dates) {
    const n = need(d);
    const candidates = () => list.filter(s => staffEmployedOn(s, d) && isFree(s, d) && s.workDows.includes(dowOf(d)))
      .filter(s => { const w = wishFor(db, s.id, d); return !(w && (w.kind === 'off' || w.kind === 'pto')); })
      .filter(s => { const st = typeFor(s, d); return st && st.isWork && consecutiveWorkDays(db, s.id, d, true) <= S.maxConsecutiveDays; })
      .filter(s => deficit(s) > 0.5)
      .sort((a, b) => {
        const wa = wishFor(db, a.id, d), wb = wishFor(db, b.id, d); const pa = wa && wa.kind === 'work' ? 1 : 0, pb = wb && wb.kind === 'work' ? 1 : 0;
        if (pb !== pa) return pb - pa;

        return (deficit(b) - deficit(a)) || (order(a.id) - order(b.id));
      });
    const stats = () => dayStats(db, d);
    let guard = 0;
    while (stats().nurses < n.nurses && guard++ < 50) { const c = candidates().find(isNurse); if (!c) break; place(c, d, typeFor(c, d)); filled++; }
    guard = 0;
    while (stats().working < n.total && guard++ < 50) { const c = candidates()[0]; if (!c) break; place(c, d, typeFor(c, d)); filled++; }
    // 所定時間に満たない人は、営業日なら人数を満たしていても出す（出勤希望は休業日でも出す）
    for (const c of candidates()) {
      const w = wishFor(db, c.id, d), st = typeFor(c, d);
      if ((w && w.kind === 'work') || (!isClosedDay(db, d) && deficit(c) >= shiftHours(st) / 2)) { place(c, d, st); filled++; }
    }
  }
  // 3) 残りを公休
  for (const s of list) for (const d of dates) if (staffEmployedOn(s, d) && isFree(s, d)) { place(s, d, offType); filled++; }
  // 週の休みを確保（全日出勤の週は、配置に余裕がある日を公休へ）
  for (const s of list) for (const ws of weeksWithoutRest(db, s.id, ym)) {
    for (let i = 6; i >= 0; i--) {
      const d = addDays(ws, i);
      if (ymOf(d) !== ym || fixed.has(`${s.id}|${d}`)) continue;
      const cur = entryFor(db, s.id, d);
      if (!cur || !isWorkEntry(db, cur)) continue;
      const n = need(d), st = dayStats(db, d);
      if (st.working - 1 >= n.total && (!isNurse(s) || st.nurses - 1 >= n.nurses)) { roster.set(db, { date: d, staffId: s.id, shiftTypeId: offType.id, oncall: false }); break; }
    }
  }
  // 4) オンコール
  let oncallAssigned = 0;
  for (const d of dates) {
    let guard = 0;
    while (dayStats(db, d).oncall < S.oncallPerDay && guard++ < 50) {
      const pool = list.filter(s => s.canOncall && staffEmployedOn(s, d)).filter(s => { const r = entryFor(db, s.id, d); return r && !r.oncall && !fixed.has(`${s.id}|${d}`) && !(wishFor(db, s.id, d) || {}).kind?.startsWith('noOncall'); })
        .filter(s => { const p = entryFor(db, s.id, addDays(d, -1)), nx = entryFor(db, s.id, addDays(d, 1)); return !(p && p.oncall) && !(nx && nx.oncall); })
        .sort((a, b) => {
          const ra = entryFor(db, a.id, d), rb = entryFor(db, b.id, d);
          const wa = isWorkEntry(db, ra) ? 0 : 1, wb = isWorkEntry(db, rb) ? 0 : 1;   // 出勤している人を優先（公平性優先では回数を先に見る）
          const oa = staffMonthStats(db, a.id, ym).oncall, ob = staffMonthStats(db, b.id, ym).oncall;
          return strategy === 'fair' ? ((oa - ob) || (wa - wb) || (order(a.id) - order(b.id))) : ((wa - wb) || (oa - ob) || (order(a.id) - order(b.id)));
        });
      const c = pool[0];
      if (!c) break;
      const r = entryFor(db, c.id, d);
      roster.set(db, { date: d, staffId: c.id, shiftTypeId: r.shiftTypeId, oncall: true, note: r.note });
      oncallAssigned++;
    }
  }
  const unmet = [];
  for (const d of dates) checkDay(db, d).filter(x => RULE_LEVEL[x.code] === 'block').forEach(x => unmet.push({ date: d, msg: x.msg }));
  pushHistory(db, { action: 'autofill', entity: 'roster', entityId: ym, after: { filled, oncallAssigned, unmet: unmet.length, strategy } });
  return { filled, oncallAssigned, unmet, strategy };
}
/* 月の出来栄えを数える。複数案の比較に使う */
function scoreMonth(db, ym) {

  const oncalls = stats.filter(x => x.s.canOncall).map(x => x.st.oncall), closed = stats.filter(x => x.s.employment === 'fulltime').map(x => x.st.closedWork);

function copyPattern(db, fromYm, toYm) {

  for (const s of staffInMonth(db, toYm)) {
    const byDow = new Map();
    for (const r of db.roster.filter(x => x.staffId === s.id && ymOf(x.date) === fromYm)) {
      const dow = dowOf(r.date); if (!byDow.has(dow)) byDow.set(dow, new Map());
      const m = byDow.get(dow); m.set(r.shiftTypeId, (m.get(r.shiftTypeId) || 0) + 1);
    }

/* 提出用セットを本人用のデータにする（既存データは置き換える前提） */

function staffFromVisitApp(json) {

    out.push(createStaff({

      role: isEnum(s.role, ENUMS.staffRole) ? s.role : 'OTHER', employment: isEnum(s.employment, ENUMS.employment) ? s.employment : 'fulltime',
      weeklyHours: Math.min(80, Math.round(hours * 10) / 10), workDows: dows.length ? dows : [1, 2, 3, 4, 5],

/* ------------------------------------------------------------------
 * 9. 保存・読込

const MIGRATIONS = {
  /* v2: 勤務に実績のオンコール（待機・呼び出し回数）、設定に手当単価、メタに提出モード */
  2: db => {
    (Array.isArray(db.roster) ? db.roster : []).forEach(r => { if (isObj(r)) { if (r.actualOncall === undefined) r.actualOncall = null; if (!isInt(r.oncallCalls)) r.oncallCalls = 0; } });
    if (isObj(db.meta) && db.meta.submitMode === undefined) db.meta.submitMode = null;
    db.schemaVersion = 2;
    return db;
  }
};
function migrate(raw) {
  if (!isObj(raw)) throw new Error('データの形式が不正です');
  let db = raw, v = Number.isInteger(db.schemaVersion) ? db.schemaVersion : 1;
  if (v > SCHEMA_VERSION) throw new Error(`このデータは新しい版（v${v}）で保存されています。アプリを更新してください`);
  while (v < SCHEMA_VERSION) { const step = MIGRATIONS[v + 1]; if (!step) throw new Error(`v${v} から v${v + 1} への移行手順がありません`); db = step(db); v = db.schemaVersion; }
  const empty = createEmptyDb();
  for (const k of ['staff', 'wishes', 'months', 'roster', 'holidays', 'history']) if (!Array.isArray(db[k])) db[k] = [];
  if (!Array.isArray(db.shiftTypes) || !db.shiftTypes.length) db.shiftTypes = empty.shiftTypes;
  db.settings = Object.assign({}, empty.settings, isObj(db.settings) ? db.settings : {});
  db.meta = Object.assign({}, empty.meta, isObj(db.meta) ? db.meta : {});
  db.schemaVersion = SCHEMA_VERSION;
  return db;
}
function exportJson(db) { return JSON.stringify(db, null, 2); }
function parseDb(text) {
  let raw; try { raw = JSON.parse(text); } catch (err) { throw new Error('JSONとして読み取れません: ' + err.message); }
  const db = migrate(raw); return { db, errors: validateDb(db) };
}
function load(storage) {
  const text = storage.getItem(STORAGE_KEY);
  if (text === null) return { db: createEmptyDb(), errors: [], fresh: true };
  try { const { db, errors } = parseDb(text); return { db, errors, fresh: false }; }
  catch (err) { let backupKey = `${STORAGE_KEY}_broken_${Date.now()}`; try { storage.setItem(backupKey, text); } catch (_) { backupKey = null; } return { db: createEmptyDb(), errors: [{ path: '', msg: err.message }], fresh: true, backupKey }; }
}
function save(db, storage) {
  const errors = validateDb(db);
  if (errors.length) return { ok: false, errors };
  db.meta.updatedAt = nowIso();
  const text = JSON.stringify(db), bytes = new TextEncoder().encode(text).length;
  try { storage.setItem(STORAGE_KEY, text); } catch (err) { return { ok: false, errors: [{ path: '', msg: '保存できませんでした（容量超過の可能性）: ' + err.message }], bytes }; }
  return { ok: true, errors: [], bytes, warn: bytes > STORAGE_WARN_BYTES ? '保存容量が上限に近づいています。古い月を書き出して整理してください' : null };
}
function clear(storage) { storage.removeItem(STORAGE_KEY); }

/* ---------- 基盤 ---------- */
function loadPrefs() { try { const p = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); if (p && ['roster', 'wishes', 'summary', 'output', 'master', 'data'].includes(p.view)) state.view = p.view; if (p && ['staff', 'shiftTypes', 'holidays', 'settings'].includes(p.master)) state.master = p.master; if (p && ['plan', 'actual'].includes(p.mode)) state.mode = p.mode; } catch (_) { /* 既定のまま */ } }
function savePrefs() { try { localStorage.setItem(UI_KEY, JSON.stringify({ view: state.view, master: state.master, mode: state.mode })); } catch (_) { /* 無視 */ } }
function loadDb() { state.load = RS.store.load(localStorage); state.db = state.load.db; }
function persist() {
  const r = RS.store.save(state.db, localStorage);
  if (!r.ok) { alert('保存できませんでした。変更を取り消します。\n' + r.errors.slice(0, 8).map(e => `${e.path} ${e.msg}`).join('\n')); loadDb(); return false; }
  if (r.warn) toast(r.warn);
  return true;
}
let toastTimer = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 4000); }
/* リポジトリ操作を保存までまとめて行う。失敗時はメッセージを出して元に戻す */
function commit(fn, okMsg) {
  try { fn(); } catch (err) { toast(err.message + (err.errors && err.errors.length ? '：' + err.errors.map(e => e.msg).join(' / ') : '')); loadDb(); return false; }
  if (!persist()) { render(); return false; }
  render(); if (okMsg) toast(okMsg);
  return true;
}
const db = () => state.db;
const sName = s => RS.derive.staffDisplayName(s);
const stById = id => RS.derive.shiftTypeById(db(), id);
const sortedStaff = list => list.slice().sort((a, b) => (ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role)) || sName(a).localeCompare(sName(b), 'ja'));
const activeShiftTypes = () => db().shiftTypes.filter(t => !t.archived).sort((a, b) => a.order - b.order);
const ymTitle = ym => { const { y, m } = RS.date.ymParts(ym); return `${y}年${m}月`; };
function labelFor(path) {
  if (!path) return '';
  const parts = [];
  String(path).split('.').forEach(seg => { const m = seg.match(/^([^\[]+)(?:\[(\d+)\])?$/); if (m && FIELD_LABEL[m[1]]) parts.push(FIELD_LABEL[m[1]] + (m[2] !== undefined ? ` ${Number(m[2]) + 1}行目` : '')); });
  return parts.join(' › ');
}
function showMsgs(errors, warnings) {
  const el = $('#form-msgs'); if (!el) return;
  const fmt = e => e.text || (labelFor(e.path) ? `${labelFor(e.path)}: ${e.msg}` : e.msg);
  el.innerHTML = (errors.length ? `<ul class="msgs err">${errors.map(e => `<li>${esc(fmt(e))}</li>`).join('')}</ul>` : '') + (warnings.length ? `<ul class="msgs warn">${warnings.map(w => `<li>${esc(w.msg)}</li>`).join('')}</ul>` : '');
}
function openModal(title, html, { wide = false } = {}) { $('#modal-title').textContent = title; $('#modal-body').innerHTML = html; $('#modal .modal').classList.toggle('wide', wide); $('#modal').hidden = false; closePopover(); }
function closeModal() { $('#modal').hidden = true; $('#modal-body').innerHTML = ''; }
function openPopover(x, y, html) {
  const el = $('#popover'); el.innerHTML = html; el.hidden = false;
  const w = el.offsetWidth || 280, h = el.offsetHeight || 200;
  el.style.left = Math.max(8, Math.min(x, window.innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + 'px';
}
function closePopover() { const el = $('#popover'); el.hidden = true; el.innerHTML = ''; }

/* ---------- 描画 ---------- */
function render() {
  renderToolbar();
  const isData = state.view === 'data';
  $('#view').hidden = isData; $('#data-view').hidden = !isData;
  document.body.classList.toggle('print-output', state.view === 'output');
  if (state.view === 'roster') $('#view').innerHTML = renderRoster();
  else if (state.view === 'wishes') $('#view').innerHTML = renderWishes();
  else if (state.view === 'summary') $('#view').innerHTML = renderSummary();
  else if (state.view === 'output') $('#view').innerHTML = renderOutput();
  else if (state.view === 'master') $('#view').innerHTML = renderMaster();
  else renderData();
  savePrefs();
}
function renderToolbar() {
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const station = db().meta.stationName || '';
  $('#station-name').textContent = station; document.title = station ? `${station} 勤務表` : '勤務表';
  const monthly = ['roster', 'wishes', 'summary'].includes(state.view);
  const submit = !!db().meta.submitMode;
  $$('.tabs button').forEach(b => { b.hidden = submit && !['wishes', 'data'].includes(b.dataset.view); });
  $('#nav').hidden = !monthly; $('#actions').hidden = !monthly; $('#master-bar').hidden = state.view !== 'master';
  $('#nav-title').textContent = ymTitle(state.ym);
  const m = RS.derive.monthOf(db(), state.ym);
  $('#month-status').innerHTML = `<span class="badge ${m.status}">${esc(RS.ENUMS.monthStatus[m.status])}</span>` + (m.wishesLocked ? ' <span class="badge locked">希望締切</span>' : '');
  const confirmed = m.status === 'confirmed', actual = state.mode === 'actual';
  document.body.classList.toggle('mode-actual', actual);
  $('#mode-seg').hidden = !['roster', 'summary'].includes(state.view);
  $$('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  for (const id of ['btn-fill', 'btn-refill', 'btn-copy']) { $('#' + id).hidden = state.view !== 'roster' || actual; $('#' + id).disabled = confirmed; }
  $('#btn-check').hidden = state.view === 'wishes';
  $('#btn-confirm').hidden = state.view === 'wishes'; $('#btn-confirm').textContent = confirmed ? '確定を解除' : '確定';
  $('#btn-lock').hidden = state.view !== 'wishes' || submit; $('#btn-lock').textContent = m.wishesLocked ? '希望の受付を再開' : '希望を締め切る';
  $('#btn-wish-packet').hidden = state.view !== 'wishes' || submit; $('#btn-wish-import').hidden = state.view !== 'wishes' || submit;
  $('#btn-wish-submit').hidden = state.view !== 'wishes' || !state.wishStaff;
  $('#btn-compare').hidden = state.view !== 'roster' || actual; $('#btn-compare').disabled = confirmed;
  $('#nav-prev').disabled = submit; $('#nav-next').disabled = submit; $('#nav-today').disabled = submit;
  if (state.view === 'master') {
    $$('#master-tabs button').forEach(b => b.classList.toggle('active', b.dataset.master === state.master));
    const noList = ['holidays', 'settings'].includes(state.master);
    $('#master-search').hidden = noList; $('#master-archived-label').hidden = noList; $('#btn-master-add').hidden = noList;
    if ($('#master-search').value !== state.masterSearch) $('#master-search').value = state.masterSearch;
    $('#master-archived').checked = state.masterArchived;
    $('#btn-master-add').textContent = state.master === 'staff' ? '＋ スタッフを追加' : '＋ シフト種別を追加';
  }
}
function dayHeaderCls(d) {
  const cls = [];
  if (RS.derive.isHoliday(db(), d)) cls.push('hol'); else if (RS.derive.isClosedDay(db(), d)) cls.push('closed');
  if (d === RS.date.todayStr()) cls.push('today');
  return cls.join(' ');
}
function codeSpan(st) { return st ? `<span class="code" style="background:${esc(st.color)}">${esc(st.code)}</span>` : '<span class="code">?</span>'; }
function legendHtml() { return `<div class="legend">${activeShiftTypes().map(t => `<span>${codeSpan(t)}${esc(t.name)}${t.isWork ? `<span class="muted"> ${t.start}〜${t.end}</span>` : ''}</span>`).join('')}<span><b style="color:#b45309">◎</b> オンコール</span><span><span class="wish must" style="position:static;font-size:11px">休/有/出</span> 希望（赤は必須）</span></div>`; }

/* --- 勤務表 --- */
function renderRoster() {
  const d = db(), ym = state.ym, dates = RS.date.monthDates(ym);
  const staffList = sortedStaff(RS.derive.staffInMonth(d, ym));
  if (!staffList.length) return `<div class="empty">この月に在籍するスタッフがいません。「マスタ」でスタッフを登録するか、「データ」からサンプルを読み込んでください。</div>`;
  const m = RS.derive.monthOf(d, ym);
  const mode = state.mode, actual = mode === 'actual';
  const banner = actual ? `<div class="banner info">実績モード: セルをクリックして実際に勤務した種別を入れます。未入力の日は予定どおりとして集計します。予定と異なる日は点線で囲みます（${RS.derive.actualChanges(d, ym).length} 日）。</div>`
    : (m.status === 'confirmed' ? `<div class="banner info">この月は確定済みです。変更するには「確定を解除」を押してください。</div>` : '');
  const S = d.settings;
  const head = `<tr><th class="sticky-col">スタッフ</th>${dates.map(day => `<th class="${dayHeaderCls(day)}" data-date="${day}" title="${esc((d.holidays.find(h => h.date === day) || {}).name || '')}">${Number(day.slice(8))}<small>${DOW[RS.date.dowOf(day)]}</small></th>`).join('')}<th>出勤</th><th>休</th><th>有</th><th>OC</th><th>時間</th><th>所定</th></tr>`;
  const rows = staffList.map(s => {
    const cells = dates.map(day => {
      const r = RS.derive.entryFor(d, s.id, day), w = RS.derive.wishFor(d, s.id, day), st = r ? stById(RS.derive.effectiveTypeId(r, mode)) : null;
      const employed = RS.derive.staffEmployedOn(s, day);
      let mark = '', title = '';
      if (r && !actual) { const iss = RS.rules.checkEntry(d, r); if (iss.length) { const blk = iss.some(x => isBlock(x.code)); mark = `<span class="mark ${blk ? 'block' : 'warn'}"></span>`; title = iss.map(x => x.msg).join(' / '); } }
      const ocChanged = actual && r && r.actualOncall !== null && r.actualOncall !== r.oncall;
      const changed = actual && r && ((r.actualShiftTypeId && r.actualShiftTypeId !== r.shiftTypeId) || ocChanged);
      const standby = r ? (actual && r.actualOncall !== null ? r.actualOncall : r.oncall) : false;
      if (changed) title = `予定: ${(stById(r.shiftTypeId) || {}).name || '?'}${r.oncall ? '・待機' : ''} → 実績: ${st ? st.name : '?'}${standby ? '・待機' : ''}${r.oncallCalls ? `・呼び出し ${r.oncallCalls} 回` : ''}`;
      const wish = w && !actual ? `<span class="wish ${w.strength}" title="${esc(RS.ENUMS.wishKind[w.kind])}">${WISH_CODE[w.kind]}</span>` : '';
      if (!employed) return `<td class="closed" title="在籍期間外">—</td>`;
      return `<td class="cell ${dayHeaderCls(day)} ${r ? '' : 'blank'} ${changed ? 'changed' : ''}" data-sid="${esc(s.id)}" data-date="${day}" title="${esc(title)}">${r ? codeSpan(st) : '·'}${standby ? '<span class="oc">◎</span>' : ''}${changed ? '<span class="act">実</span>' : ''}${wish}${mark}</td>`;
    }).join('');
    const st = RS.derive.staffMonthStats(d, s.id, ym, mode);
    return `<tr><th class="sticky-col"><span class="dot" style="background:${esc(s.color)}"></span>${esc(sName(s))}<small>${esc(RS.ENUMS.staffRole[s.role])}・${esc(RS.ENUMS.employment[s.employment])}${s.canOncall ? '' : '・OC不可'}</small></th>${cells}` +
      `<td class="stat">${st.workDays}</td><td class="stat">${st.restDays}</td><td class="stat">${st.ptoDays}<span class="muted">/${s.ptoBalance}</span></td><td class="stat">${st.oncall}</td><td class="stat ${Math.abs(st.diff) >= 8 && s.employment === 'fulltime' ? 'ng' : ''}">${st.hours}</td><td class="stat muted">${st.target}</td></tr>`;
  }).join('');
  const footRow = (label, fn) => `<tr><th>${label}</th>${dates.map(day => { const v = fn(RS.derive.dayStats(d, day, mode)); return `<td class="${v.ng ? 'ng' : ''}">${v.text}</td>`; }).join('')}<td colspan="6"></td></tr>`;
  const foot = footRow('出勤', ds => ({ text: ds.working, ng: ds.working < (ds.closed ? S.minTotalClosed : S.minTotal) })) +
    footRow('看護', ds => ({ text: ds.nurses, ng: ds.nurses < (ds.closed ? S.minNursesClosed : S.minNurses) })) +
    footRow('OC', ds => ({ text: ds.oncall, ng: ds.oncall !== S.oncallPerDay }));
  return banner + `<div class="grid-wrap"><table class="roster"><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>` + legendHtml();
}
function actualPopover(x, y, sid, date) {
  const d = db(), s = RS.derive.staffById(d, sid), r = RS.derive.entryFor(d, sid, date);
  if (!r) { openPopover(x, y, `<h4>${esc(sName(s))}　${Number(date.slice(5, 7))}/${Number(date.slice(8))}</h4><p class="muted">予定が入っていないため実績を入れられません。先に予定モードで勤務を入れてください。</p>`); return; }
  const planned = stById(r.shiftTypeId), cur = r.actualShiftTypeId;
  const opts = activeShiftTypes().map(t => `<button type="button" class="${(cur || r.shiftTypeId) === t.id ? 'on' : ''}" data-set-actual="${esc(t.id)}">${codeSpan(t)}${esc(t.name)}</button>`).join('');
  const standby = r.actualOncall === null ? r.oncall : r.actualOncall;
  openPopover(x, y, `<h4>${esc(sName(s))}　${Number(date.slice(5, 7))}/${Number(date.slice(8))}（${DOW[RS.date.dowOf(date)]}）の実績</h4><p class="muted" style="margin:0 0 6px">予定: ${planned ? esc(planned.name) : '?'}${r.oncall ? '・オンコール待機' : ''}${cur ? `　→ 実績: <b>${esc((stById(cur) || {}).name || '?')}</b>` : '　（勤務は予定どおり）'}</p><div class="opts">${opts}</div>` +
    `<div class="sub-label">オンコール待機の実績${r.actualOncall === null ? '（予定どおり）' : ''}</div><div class="foot"><button type="button" class="small ${standby ? 'primary' : ''}" data-standby="1">待機した</button><button type="button" class="small ${!standby ? 'primary' : ''}" data-standby="0">待機なし</button><span class="stepper">呼び出し <button type="button" class="small" data-calls="-1">−</button><input type="number" id="act-calls" value="${r.oncallCalls}" min="0" max="50"><button type="button" class="small" data-calls="1">＋</button> 回</span></div>` +
    `<div class="foot"><button type="button" class="small" data-clear-actual ${cur || r.actualOncall !== null ? '' : 'disabled'}>すべて予定どおりに戻す</button></div>`);
  const pop = $('#popover');
  pop.querySelectorAll('[data-set-actual]').forEach(b => { b.onclick = () => { const id = b.dataset.setActual; closePopover(); commit(() => RS.repo.roster.setActual(d, sid, date, id === r.shiftTypeId ? null : id)); }; });
  pop.querySelectorAll('[data-standby]').forEach(b => { b.onclick = () => { const v = b.dataset.standby === '1'; closePopover(); commit(() => RS.repo.roster.setActualOncall(d, sid, date, { actualOncall: v === r.oncall ? null : v })); }; });
  pop.querySelectorAll('[data-calls]').forEach(b => { b.onclick = () => { const n = Math.max(0, Math.min(50, Number($('#act-calls').value || 0) + Number(b.dataset.calls))); closePopover(); commit(() => RS.repo.roster.setActualOncall(d, sid, date, { oncallCalls: n })); }; });
  $('#act-calls').onchange = () => { const n = Math.max(0, Math.min(50, Number($('#act-calls').value || 0))); closePopover(); commit(() => RS.repo.roster.setActualOncall(d, sid, date, { oncallCalls: n })); };
  const cl = pop.querySelector('[data-clear-actual]'); if (cl) cl.onclick = () => { closePopover(); commit(() => { RS.repo.roster.setActual(d, sid, date, null); RS.repo.roster.setActualOncall(d, sid, date, { actualOncall: null, oncallCalls: 0 }); }); };
}
function cellPopover(x, y, sid, date) {
  if (state.mode === 'actual') { actualPopover(x, y, sid, date); return; }
  const d = db(), s = RS.derive.staffById(d, sid), r = RS.derive.entryFor(d, sid, date), w = RS.derive.wishFor(d, sid, date);
  const confirmed = RS.derive.isConfirmed(d, state.ym);
  const opts = activeShiftTypes().map(t => `<button type="button" class="${r && r.shiftTypeId === t.id ? 'on' : ''}" data-set-shift="${esc(t.id)}" ${confirmed ? 'disabled' : ''}>${codeSpan(t)}${esc(t.name)}</button>`).join('');
  const iss = r ? RS.rules.checkEntry(d, r) : [];
  const msgs = iss.length ? `<ul class="msgs ${iss.some(i => isBlock(i.code)) ? 'err' : 'warn'}">${iss.map(i => `<li>${esc(i.msg)}</li>`).join('')}</ul>` : '';
  const dayIss = RS.rules.checkDay(d, date);
  openPopover(x, y, `<h4>${esc(sName(s))}　${Number(date.slice(5, 7))}/${Number(date.slice(8))}（${DOW[RS.date.dowOf(date)]}）${RS.derive.isClosedDay(d, date) ? '<span class="muted"> 休業日</span>' : ''}</h4>` +
    (w ? `<p class="muted" style="margin:0 0 6px">希望: <b class="${w.strength === 'must' ? 'ng' : ''}">${esc(RS.ENUMS.wishKind[w.kind])}${w.kind === 'shift' && stById(w.shiftTypeId) ? `（${esc(stById(w.shiftTypeId).name)}）` : ''}</b>（${esc(RS.ENUMS.wishStrength[w.strength])}）${w.note ? ' ' + esc(w.note) : ''}</p>` : '') +
    `<div class="opts">${opts}</div>` +
    `<div class="foot"><button type="button" class="small ${r && r.oncall ? 'primary' : ''}" data-toggle-oncall ${confirmed || !r ? 'disabled' : ''}>◎ オンコール${s.canOncall ? '' : '（不可）'}</button><button type="button" class="small" data-note ${confirmed || !r ? 'disabled' : ''}>備考${r && r.note ? '*' : ''}</button><button type="button" class="small danger" data-clear ${confirmed || !r ? 'disabled' : ''}>クリア</button></div>` +
    msgs + (dayIss.length ? `<p class="muted" style="margin:6px 0 0">この日: ${esc(dayIss.map(i => i.msg).join(' / '))}</p>` : '') +
    (confirmed ? '<p class="muted" style="margin:6px 0 0">確定済みのため変更できません</p>' : ''));
  const pop = $('#popover');
  pop.querySelectorAll('[data-set-shift]').forEach(b => { b.onclick = () => { closePopover(); commit(() => RS.repo.roster.set(d, { date, staffId: sid, shiftTypeId: b.dataset.setShift, oncall: r ? r.oncall && stById(b.dataset.setShift).isWork : false, note: r ? r.note : '' })); }; });
  const oc = pop.querySelector('[data-toggle-oncall]'); if (oc) oc.onclick = () => { closePopover(); commit(() => RS.repo.roster.set(d, { date, staffId: sid, shiftTypeId: r.shiftTypeId, oncall: !r.oncall, note: r.note })); };
  const nt = pop.querySelector('[data-note]'); if (nt) nt.onclick = () => { const v = prompt('備考', r.note || ''); if (v === null) return; closePopover(); commit(() => RS.repo.roster.set(d, { date, staffId: sid, shiftTypeId: r.shiftTypeId, oncall: r.oncall, note: v.trim() })); };
  const cl = pop.querySelector('[data-clear]'); if (cl) cl.onclick = () => { closePopover(); commit(() => RS.repo.roster.clear(d, sid, date)); };
}

/* --- 希望 --- */
function renderWishes() {
  const d = db(), ym = state.ym, dates = RS.date.monthDates(ym), m = RS.derive.monthOf(d, ym);
  let staffList = sortedStaff(RS.derive.staffInMonth(d, ym));
  if (!staffList.length) return `<div class="empty">この月に在籍するスタッフがいません。</div>`;
  const sel = `<div class="inline-form"><label>スタッフ<select id="wish-staff"><option value="">全員</option>${staffList.map(s => `<option value="${esc(s.id)}" ${state.wishStaff === s.id ? 'selected' : ''}>${esc(sName(s))}</option>`).join('')}</select></label><span class="muted">セルをクリックして休み・有給・出勤・シフト指定・オンコール不可を入れます。必須にすると自動作成が必ず守り、違反はブロックされます。</span></div>`;
  if (state.wishStaff) staffList = staffList.filter(s => s.id === state.wishStaff);
  const sm = d.meta.submitMode;
  const banner = sm ? `<div class="banner info">希望の提出用セット（${esc(sm.stationName || '事業所')}・${ymTitle(sm.ym)}）です。上の「スタッフ」で自分の名前を選び、セルをクリックして希望を入れ、「希望を提出する」で提出コードを書き出して管理者に送ってください。</div>`
    : (m.wishesLocked ? `<div class="banner info">この月の希望は締め切られています。変更するには「希望の受付を再開」を押してください。</div>` : '');
  const head = `<tr><th class="sticky-col">スタッフ</th>${dates.map(day => `<th class="${dayHeaderCls(day)}">${Number(day.slice(8))}<small>${DOW[RS.date.dowOf(day)]}</small></th>`).join('')}<th>希望数</th></tr>`;
  const rows = staffList.map(s => {
    const ws = d.wishes.filter(w => w.staffId === s.id && RS.date.ymOf(w.date) === ym);
    const cells = dates.map(day => {
      if (!RS.derive.staffEmployedOn(s, day)) return `<td class="closed">—</td>`;
      const w = ws.find(x => x.date === day);
      return `<td class="cell ${dayHeaderCls(day)} ${w ? '' : 'blank'}" data-wsid="${esc(s.id)}" data-date="${day}" title="${esc(w ? RS.ENUMS.wishKind[w.kind] + (w.note ? ' ' + w.note : '') : '')}">${w ? `<span class="code ${w.strength === 'must' ? 'ng' : ''}" style="background:${w.strength === 'must' ? '#fee2e2' : '#e0e7ff'}">${WISH_CODE[w.kind]}</span>` : '·'}</td>`;
    }).join('');
    return `<tr><th class="sticky-col"><span class="dot" style="background:${esc(s.color)}"></span>${esc(sName(s))}</th>${cells}<td class="stat">${ws.length}</td></tr>`;
  }).join('');
  return sel + banner + `<div class="grid-wrap"><table class="roster"><thead>${head}</thead><tbody>${rows}</tbody></table></div><div class="legend"><span><b>休</b> 休み希望</span><span><b>有</b> 有給希望</span><span><b>出</b> 出勤希望</span><span><b>指</b> シフト指定</span><span><b>×OC</b> オンコール不可</span><span><span class="code" style="background:#fee2e2">　</span> 必須</span><span><span class="code" style="background:#e0e7ff">　</span> 希望</span></div>`;
}
function wishPopover(x, y, sid, date) {

function openMonthCheck() {
  const d = db(), ym = state.ym, issues = RS.rules.checkMonth(d, ym);
  const blocks = issues.filter(i => i.level === 'block').length;

  for (const [code, list] of groups) {

function masterFooterHtml(entity) {

function saveEntity(coll, entity, patch, validator, factory) {
  const candidate = entity ? Object.assign(RS.clone(entity), patch) : factory(patch);
  const errs = validator(candidate);
  if (errs.length) { showMsgs(errs, []); return; }
  try { if (entity) RS.repo[coll].update(db(), entity.id, patch); else RS.repo[coll].add(db(), candidate); }
  catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); loadDb(); return; }
  if (!persist()) { closeModal(); render(); return; }
  closeModal(); render(); toast('保存しました');
}
function wireMasterFooter(coll, entity, archiveMsg) {
  $('#btn-close-modal').onclick = closeModal;
  const a = $('#btn-archive'); if (a) a.onclick = () => { if (!confirm(archiveMsg)) return; try { RS.repo[coll].archive(db(), entity.id); } catch (err) { showMsgs([{ msg: err.message }].concat(err.errors || []), []); return; } if (!persist()) { closeModal(); render(); return; } closeModal(); render(); toast('無効にしました'); };
  const r = $('#btn-restore'); if (r) r.onclick = () => { try { RS.repo[coll].restore(db(), entity.id); } catch (err) { showMsgs([{ msg: err.message }], []); return; } if (!persist()) { closeModal(); render(); return; } closeModal(); render(); toast('有効に戻しました'); };
}

  $('#btn-export').onclick = () => download(`勤務表_${RS.date.todayStr()}.json`, RS.store.exportJson(db()), 'application/json');
  $('#btn-import').onclick = () => $('#file-import').click();
  $('#file-import').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => { try { const { db: d, errors } = RS.store.parseDb(String(reader.result)); if (errors.length) { alert('読み込んだデータに問題があります（保存しません）:\n' + errors.slice(0, 10).map(e => e.path + ' ' + e.msg).join('\n')); return; } if (!confirm(`スタッフ ${d.staff.length} 名・勤務 ${d.roster.length} 件を読み込み、現在の保存データを置き換えます。よろしいですか？`)) return; const r = RS.store.save(d, localStorage); if (!r.ok) alert('保存できませんでした'); } catch (e) { alert(e.message); } finally { ev.target.value = ''; loadDb(); render(); } }; reader.readAsText(f); };
  $('#btn-import-staff').onclick = () => $('#file-import-staff').click();
  $('#file-import-staff').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => { try { importStaffText(String(reader.result)); } catch (e) { alert(e.message); } ev.target.value = ''; }; reader.readAsText(f); };
  $('#btn-clear').onclick = () => { if (!confirm('保存データをすべて削除します。先にJSONを書き出していますか？')) return; RS.store.clear(localStorage); loadDb(); render(); };
}
function runAutoFill(overwrite) {
  let r;
  if (!commit(() => { r = RS.rules.autoFill(db(), state.ym, { overwrite }); })) return;
  const unmet = r.unmet.length ? `\n人手が足りない日が ${r.unmet.length} 日あります（例: ${r.unmet[0].date.slice(5).replace('-', '/')} ${r.unmet[0].msg}）。月次チェックで確認してください。` : '';
  alert(`${r.filled} マスを埋め、オンコールを ${r.oncallAssigned} 日分割り当てました。${unmet}`);
}
function bulkHolidays() {
  const year = Number($('#bulk-year').value); let list;
  try { list = RS.rules.japaneseHolidays(year); } catch (err) { alert(err.message); return; }
  const existing = new Set(db().holidays.map(h => h.date)), add = list.filter(h => !existing.has(h.date));
  if (!add.length) { toast(`${year}年の祝日はすべて登録済みです`); return; }
  if (!confirm(`${year}年の祝日 ${add.length} 件を登録します。よろしいですか？`)) return;
  commit(() => add.forEach(h => RS.repo.holidays.add(db(), RS.create.holiday({ date: h.date, name: h.name, kind: 'national' }))), `${add.length} 件の祝日を登録しました`);
}
function importStaffText(text) {
  const r = RS.importers.staffFromVisitApp(text);
  const existing = new Set(db().staff.map(s => s.id));
  const add = r.staff.filter(s => !existing.has(s.id)), dup = r.staff.length - add.length;
  const html = `<p><b>${add.length}</b> 名を取り込みます${dup ? `（${dup} 名は同じIDで登録済みのため飛ばします）` : ''}${r.skipped.length ? `。氏名のない ${r.skipped.length} 件は読み飛ばします` : ''}。</p><ul class="issue-list">${add.map(s => `<li>${esc(s.name)}（${esc(RS.ENUMS.staffRole[s.role])}・${esc(RS.ENUMS.employment[s.employment])}・週${s.weeklyHours}時間・${s.workDows.map(x => DOW[x]).join('')}）</li>`).join('')}</ul><p class="muted">勤務可能枠から週の所定時間と勤務曜日を推定しました。取り込み後にスタッフ画面で確認してください。</p><div id="form-msgs"></div><div class="modal-foot"><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button>${add.length ? '<button type="button" class="primary" id="btn-staff-apply">取り込む</button>' : ''}</div>`;
  openModal('①訪問スケジュールからスタッフを取り込む', html);
  $('#btn-close-modal').onclick = closeModal;
  const apply = $('#btn-staff-apply'); if (apply) apply.onclick = () => { closeModal(); commit(() => add.forEach(s => RS.repo.staff.add(db(), s)), `${add.length} 名を取り込みました`); };
}

/* ---------- 複数案の比較 ---------- */
function openCompare() {
  let cands;
  try { cands = RS.rules.generateCandidates(db(), state.ym); } catch (err) { toast(err.message); return; }
  const cols = [['block', '要対応', true], ['warn', '注意', true], ['wishViolations', '希望違反', true], ['oncallSpread', 'OC回数の差', true], ['closedWorkSpread', '週末出勤の差', true], ['hoursGap', '所定との差(合計h)', true], ['blank', '未入力', true], ['nurseFte', '看護 常勤換算', false]];
  const best = {}; cols.forEach(([k, , lowerBetter]) => { const vals = cands.map(c => c.score[k]); best[k] = lowerBetter ? Math.min(...vals) : Math.max(...vals); });
  const html = `<p class="muted">方針の違う3案を、この月を一から作り直す形で比べます（今の勤務表は変わりません）。「適用」を押すと、その案でこの月を置き換えます。</p>` +
    `<table class="cands"><thead><tr><th>方針</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>` +
    cands.map((c, i) => `<tr><td><b>${esc(c.label)}</b><div class="muted">${c.strategy === 'balanced' ? '所定時間の不足が大きい人から配置' : c.strategy === 'wishes' ? 'シフト指定の希望も使って配置' : '週末出勤とオンコールの回数を均す'}${c.unmet.length ? `・人手不足 ${c.unmet.length} 日` : ''}</div></td>${cols.map(([k]) => `<td class="${c.score[k] === best[k] ? 'best' : ''}">${c.score[k]}</td>`).join('')}<td><button type="button" class="small primary" data-apply="${i}">適用</button></td></tr>`).join('') +
    `</tbody></table><div class="modal-foot"><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button></div>`;
  openModal(`複数案の比較 ${ymTitle(state.ym)}`, html, { wide: true });
  $('#btn-close-modal').onclick = closeModal;
  $$('#modal [data-apply]').forEach(b => { b.onclick = () => { const c = cands[Number(b.dataset.apply)]; if (!confirm(`「${c.label}」の案で ${ymTitle(state.ym)} の勤務表を置き換えます。手で入れたセルも置き換わります。よろしいですか？`)) return; closeModal(); commit(() => RS.rules.applyCandidate(db(), state.ym, c), `「${c.label}」の案を適用しました`); }; });
}

/* ---------- 希望の提出（本人） ---------- */
function openWishSubmit() {
  const s = RS.derive.staffById(db(), state.wishStaff); if (!s) return;
  const code = RS.exporters.wishSubmission(db(), state.ym, s.id), n = JSON.parse(code).wishes.length;
  openModal('希望を提出する', `<p><b>${esc(sName(s))}</b> の ${ymTitle(state.ym)} の希望 <b>${n}</b> 件を提出コードにしました。ファイルで渡すか、コードをコピーしてメッセージで送ってください。管理者は「希望 › 提出を取り込む」で受け取ります。</p><textarea class="code" id="submit-code" readonly>${esc(code)}</textarea><div class="modal-foot"><button type="button" id="btn-copy-code">コードをコピー</button><button type="button" class="primary" id="btn-dl-code">ファイルで保存</button><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button></div>`);
  $('#btn-close-modal').onclick = closeModal;
  $('#btn-copy-code').onclick = async () => { try { await navigator.clipboard.writeText(code); toast('コピーしました'); } catch (_) { $('#submit-code').select(); document.execCommand && document.execCommand('copy'); toast('コピーしました（選択した内容）'); } };
  $('#btn-dl-code').onclick = () => download(`希望_${esc(s.name)}_${state.ym}.json`, code, 'application/json');
}
function openWishImport() {
  openModal('提出された希望を取り込む', `<p class="muted">本人が書き出した提出コード（JSON）を貼り付けるか、ファイルを選んでください。その人のその月の希望を置き換えます。締め切った月には取り込めません。</p><textarea class="code" id="import-code" placeholder='{"type":"kinmu_wish_submission", ...}'></textarea><div class="modal-foot"><button type="button" id="btn-import-file">ファイルを選ぶ</button><input type="file" id="file-import-code" accept="application/json,.json,.txt" hidden><span class="spacer"></span><button type="button" id="btn-close-modal">閉じる</button><button type="button" class="primary" id="btn-import-apply">取り込む</button></div><div id="form-msgs"></div>`);
  $('#btn-close-modal').onclick = closeModal;
  $('#btn-import-file').onclick = () => $('#file-import-code').click();
  $('#file-import-code').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => { $('#import-code').value = String(reader.result); }; reader.readAsText(f); };
  $('#btn-import-apply').onclick = () => {
    let sub; try { sub = RS.importers.parseWishSubmission($('#import-code').value); } catch (err) { showMsgs([{ msg: err.message }], []); return; }
    if (sub.ym !== state.ym && !confirm(`この提出は ${ymTitle(sub.ym)} の希望です。表示中の ${ymTitle(state.ym)} とは違いますが取り込みますか？`)) return;
    let r; closeModal();
    if (commit(() => { r = RS.repo.wishes.applySubmission(db(), sub); })) toast(`${sName(r.staff)} の ${ymTitle(sub.ym)} の希望 ${r.added} 件を取り込みました（置き換え ${r.removed} 件）`);
  };
}

/* ---------- 起動 ---------- */
loadPrefs(); loadDb(); wireEvents(); renderTests(); render();
if (state.load.errors.length) toast('保存データに問題がありました。「データ」タブで内容を確認してください');
})();
</script>
</body>
</html>
