# ---------------------------------------------------------------------------
# 公開予定日が来たブログ・採用記事を、自動で公開します。
# 記事の日付を未来にしておくと、その日の朝までホームページに出ません。
# 中身をさわる必要はありません。
# ---------------------------------------------------------------------------
name: 予約投稿を公開する

on:
  schedule:
    - cron: "0 21 * * *"      # 日本時間で毎朝6時ごろ
  workflow_dispatch:          # 手動で実行したいとき用

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: サイトを生成
        run: python3 build.py

      - name: 点検（問題があればここで止まります）
        run: python3 tools/check.py

      - name: 公開用に受け渡し
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
