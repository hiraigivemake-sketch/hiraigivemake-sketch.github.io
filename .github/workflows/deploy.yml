# ---------------------------------------------------------------------------
# GitHub に変更を送ると、自動でホームページを作り直して公開する設定です。
# 中身をさわる必要はありません。
# ---------------------------------------------------------------------------
name: サイトを公開する

on:
  push:
    branches: [main]
  workflow_dispatch:      # 手動で実行したいとき用

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: サイトを生成
        run: python3 build.py

      - name: 点検（問題があればここで止まります）
        run: python3 tools/check.py

      - name: 公開用に受け渡し
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
